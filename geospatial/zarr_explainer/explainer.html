<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An Interactive guide to Zarr</title>
<style>
  :root {
    /* warm paper + ink (visual-explainers house style) */
    --paper:#f6f2e9; --card:#fffdf8; --line:#e4dccb; --line2:#d6cdb8;
    --ink:#28231a; --dim:#7b7260; --mut:#a89e8a;
    --gold:#b8860b;            /* your selection */
    --fetch:#1f8fb8;           /* bytes that traveled */
    --cache:#2f9e57;           /* served free from cache */
    --miss:#c9366b;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center; }
  .mono { font-family:"SF Mono",ui-monospace,Menlo,monospace; }
  .col { width:100%; max-width:880px; padding:18px 28px 20px; display:flex;
         flex-direction:column; min-height:100vh; }

  /* ---------- progress ---------- */
  .prog { display:flex; align-items:center; gap:10px; color:var(--mut); font-size:12px; flex:0 0 auto; }
  .dots { display:flex; gap:5px; flex:1; justify-content:center; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--line2);
            transition:background .2s, transform .2s; cursor:pointer; }
  .dots i.on { background:var(--ink); transform:scale(1.25); }
  .dots i.past { background:var(--mut); }
  .prog .n { font-variant-numeric:tabular-nums; min-width:72px; }
  .prog .n:last-child { text-align:right; }

  /* ---------- step copy ---------- */
  .head { margin:12px 0 10px; min-height:104px; flex:0 0 auto; position:relative; }
  .kicker { font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold);
            font-weight:700; margin:0 0 5px; min-height:14px; }
  a.learn { position:absolute; top:0; right:0; font-size:11.5px; color:var(--gold);
            text-decoration:none; border-bottom:1px dotted var(--gold); }
  a.learn:hover { color:#8a6508; }
  h1 { font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-size:29px;
       line-height:1.15; margin:0 0 7px; letter-spacing:-.2px; font-weight:600; }
  .copy { color:#4d463a; font-size:15px; margin:0; max-width:720px; }
  .copy b { color:var(--ink); }
  .copy .k { font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:12.5px;
             background:#f3edd9; border-radius:4px; padding:0 4px; }

  /* ---------- stage ---------- */
  .stage { background:var(--card); border:1px solid var(--line); border-radius:18px;
           height:500px; position:relative; overflow:hidden; flex:0 0 auto;
           display:flex; align-items:center; justify-content:center;
           box-shadow:0 2px 10px rgba(90,75,40,.06); }
  .stage-in { display:flex; flex-direction:column; align-items:center; gap:12px;
              width:100%; height:100%; padding:18px 22px; justify-content:center; }
  .caption { color:var(--dim); font-size:12.5px; text-align:center; min-height:18px;
             font-variant-numeric:tabular-nums; max-width:760px; flex:none; }
  .caption b { color:var(--ink); }
  .caption .f { color:var(--fetch); font-weight:600; }
  .caption .g { color:var(--cache); font-weight:600; }
  .caption .z { color:var(--gold); font-weight:600; }
  .fadein { animation:fade .45s ease both; }
  @keyframes fade { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

  /* ---------- nav ---------- */
  .nav { display:flex; align-items:center; justify-content:space-between; margin-top:12px; flex:0 0 auto; }
  .nav .hintkeys { color:var(--mut); font-size:12px; }
  button.b { appearance:none; cursor:pointer; font:600 14px/1 -apple-system,BlinkMacSystemFont,sans-serif;
             border-radius:10px; padding:10px 20px; border:1px solid var(--line2);
             background:var(--card); color:var(--ink); transition:box-shadow .15s, opacity .15s; }
  button.b:hover { box-shadow:0 2px 8px rgba(90,75,40,.12); }
  button.b.primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  button.b[disabled] { opacity:.35; cursor:default; box-shadow:none; }
  button.small { appearance:none; cursor:pointer; font:600 12.5px/1 -apple-system,sans-serif;
                 border-radius:8px; padding:8px 14px; border:1px solid var(--line2);
                 background:var(--card); color:var(--ink); }
  button.small:hover { box-shadow:0 1px 6px rgba(90,75,40,.15); }
  button.small.primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  button.small[disabled] { opacity:.4; cursor:default; }
  .foot { color:var(--mut); font-size:11.5px; text-align:center; margin-top:8px; min-height:16px; }
  .foot .f { color:var(--fetch); font-weight:600; }

  /* ---------- components ---------- */
  .statrow { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .stat { border:1px solid var(--line2); border-radius:12px; background:#fbf8f0;
          padding:12px 18px; text-align:center; min-width:150px; cursor:default;
          transition:opacity .3s, border-color .2s, background .2s, transform .35s; }
  .stat .v { font-family:Georgia,serif; font-size:24px; font-variant-numeric:tabular-nums; }
  .stat .l { color:var(--dim); font-size:11.5px; margin-top:3px; }
  .stat.hidden0 { opacity:0; transform:translateY(10px); pointer-events:none; }
  .stat.hot { border-color:var(--gold); background:#f9f0d8; }
  /* the global hover grammar: whatever ISN'T in focus fades away */
  .dimhov { transition:opacity .3s; }
  .dimhov.dim, .stat.dim { opacity:.22; }
  .bigno { font-family:Georgia,serif; font-size:44px; line-height:1.05;
           font-variant-numeric:tabular-nums; }

  canvas.cube { display:block; }

  /* download dialog (step 1) */
  .oldwin { border:1px solid #b9ae97; border-radius:10px; overflow:hidden; background:#ece5d4;
            box-shadow:0 3px 14px rgba(90,75,40,.14); width:480px; }
  .oldbar { display:flex; align-items:center; gap:8px; padding:7px 10px; background:#ddd4bf;
            border-bottom:1px solid #c4b99f; font-size:12px; color:#5d5442; font-weight:600; }
  .oldbar .wdots { display:flex; gap:5px; }
  .oldbar .wdots i { width:9px; height:9px; border-radius:50%; background:#b7ab8f; }
  .oldbody { padding:14px 16px 16px; font-size:12.5px; color:#5d5442; }
  .oldbody .fn { font-family:"SF Mono",Menlo,monospace; font-size:11.5px; color:#4d4535;
                 margin-bottom:10px; word-break:break-all; }
  .dlbar { height:14px; border:1px solid #b3a789; border-radius:3px; overflow:hidden; background:#f6f1e4; }
  .dlbar i { display:block; height:100%; width:0%; background:linear-gradient(#9db7d8,#7d9cc4); }
  .dlmeta { display:flex; flex-direction:column; gap:2px; margin-top:7px;
            font-variant-numeric:tabular-nums; font-size:11.5px; }

  /* narration log */
  .narr { width:100%; max-width:640px; font-size:12.5px; border:1px solid var(--line);
          border-radius:10px; background:#fbf8f0; padding:8px 12px; min-height:64px;
          max-height:150px; overflow-y:auto; }
  .narr .ln { padding:1.5px 0; color:var(--dim); }
  .narr .ln b { color:var(--ink); }
  .narr .ln .req { color:var(--fetch); }
  .narr .ln .sz { color:var(--gold); font-weight:600; font-variant-numeric:tabular-nums; }
  .narr .ln .key { font-family:"SF Mono",Menlo,monospace; font-size:11px;
                   background:#f3edd9; border-radius:4px; padding:0 4px; }

  /* the big hover key (naming step) */
  .bigkey { font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:21px;
            letter-spacing:.4px; color:var(--ink); white-space:nowrap; }
  .bigkey .pre { color:var(--dim); }
  .bigkey .seg { display:inline-block; padding:2px 6px; border-radius:7px;
                 border:1.5px solid transparent; cursor:default;
                 transition:background .15s, border-color .15s, color .15s; }
  .bigkey .seg.glow { background:#f5e3af; border-color:var(--gold); color:#7a5807; }
  .keylab { font-size:11px; letter-spacing:.09em; text-transform:uppercase;
            color:var(--mut); font-weight:700; }
  .keywords { font-size:12.5px; color:var(--dim); line-height:1.6; min-height:66px; }
  .keywords b { color:var(--ink); }
  .keywords .ax { display:inline-block; border-radius:5px; padding:0 5px; }
  .keywords .ax.glow { background:#f5e3af; color:#7a5807; }
  .tstrip { display:flex; gap:3px; }
  .tstrip i { width:26px; height:30px; border:1px solid var(--line2); border-radius:5px;
              background:#fbf8f0; display:flex; flex-direction:column; align-items:center;
              justify-content:center; gap:0;
              font:600 9.5px -apple-system,sans-serif; color:var(--dim); cursor:default;
              font-style:normal; transition:background .12s, border-color .12s; }
  .tstrip i .ix { font:600 8px "SF Mono",Menlo,monospace; color:var(--mut); }
  .tstrip i.on { background:#f5e3af; border-color:var(--gold); color:#7a5807; }
  .tstrip i.on .ix { color:#7a5807; }
  .tstrip i.band { border-color:var(--gold); }

  /* interactive tree + preview (files step) */
  .tree2 { background:#fbf8f0; border:1px solid var(--line); border-radius:10px;
           padding:9px 12px; font-family:"SF Mono",Menlo,monospace; font-size:12px;
           line-height:1.72; width:352px; flex:none; }
  .tree2 .tn { white-space:nowrap; color:var(--dim); border-radius:5px; padding:0 5px;
               margin:0 -5px; transition:opacity .25s; }
  .tree2 .tn.dim { opacity:.3; }
  .tree2 .tn.hov { cursor:default; }
  .tree2 .tn.hov:hover, .tree2 .tn.lit { background:#f3e7c4; color:var(--ink); }
  .tree2 .sz { color:var(--mut); font-size:10.5px; }
  .prevcard { border:1px solid var(--line2); border-radius:12px; background:#fbf8f0;
              width:380px; height:352px; padding:13px 15px; display:flex;
              flex-direction:column; gap:8px; overflow:hidden; }
  .prevcard .ph { font-size:11px; letter-spacing:.08em; text-transform:uppercase;
                  color:var(--mut); font-weight:700; }
  .prevcard .pt { font-family:Georgia,serif; font-size:16.5px; color:var(--ink); }
  .prevcard .pb { font-size:12.5px; color:var(--dim); line-height:1.55; }
  .prevcard .pb b { color:var(--ink); }
  .fieldrow { display:flex; gap:8px; font-family:"SF Mono",Menlo,monospace; font-size:11.5px;
              padding:3px 7px; border-radius:6px; cursor:default; }
  .fieldrow:hover, .fieldrow.on { background:#f3e7c4; }
  .fieldrow .fk { color:#8a6508; min-width:96px; }
  .fieldrow .fv { color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fieldexp { font-size:12px; color:var(--dim); min-height:38px; padding:4px 7px;
              border-top:1px dashed var(--line2); margin-top:2px; }
  .fieldexp b { color:var(--ink); }

  /* plain-words "ID card" rows (tree step, zarr.json previews) */
  .idrow { display:flex; gap:10px; font-size:12.5px; padding:5px 9px; border-radius:7px;
           background:#f7f2e2; align-items:baseline; }
  .idrow .idk { color:#8a6508; min-width:104px; font-weight:700; font-size:11px;
                letter-spacing:.05em; text-transform:uppercase; }
  .idrow .idv { color:var(--ink); }
  .rawtoggle { align-self:flex-start; appearance:none; border:none; background:none;
               color:var(--gold); font:600 11.5px -apple-system,sans-serif; cursor:pointer;
               padding:2px 0; border-bottom:1px dotted var(--gold); }
  .rawpre { font-family:"SF Mono",Menlo,monospace; font-size:9.5px; line-height:1.45;
            background:#f3edd9; border-radius:8px; padding:8px 10px; margin:0;
            white-space:pre; overflow:hidden; color:#4d4535; }

  /* the 16 computed names (reading step) */
  .keygrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; width:440px; }
  .keygrid i { font:600 10.5px "SF Mono",Menlo,monospace; font-style:normal;
               background:#f3edd9; border-radius:4px; padding:3px 0; color:var(--dim);
               text-align:center; transition:background .2s, color .2s, opacity .2s; }
  .keygrid i.hot { background:#d9edf5; color:#155f7d; }
  .keygrid i.done { background:#e2efe0; color:#2c6b3f; }

  /* pinned download panel (real S3 read) — fixed height, never scrolls */
  .dlpanel { width:100%; max-width:300px; border:1px solid var(--line2); border-radius:12px;
             background:#fbf8f0; padding:11px 13px; display:flex; flex-direction:column;
             gap:8px; min-height:150px; overflow:hidden; flex:none; }
  .dlpanel .dlh { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
                  color:var(--mut); font-weight:700; }
  .dlpanel .pbar { height:13px; flex:none; border:1px solid var(--line2); border-radius:4px;
                   background:#efe8d5; overflow:hidden; }
  .dlpanel .pbar i { display:block; height:100%; width:0%;
                     background:linear-gradient(#4fa7c9,#1f8fb8); transition:width .25s linear; }
  .dlpanel .dlstat { font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums;
                     min-height:30px; }
  .dlpanel .dlstat b { color:var(--ink); }
  .dlpanel .dlstat .sz { color:var(--fetch); font-weight:600; }

  /* bars (gotcha + receipt) */
  .cmp { width:100%; max-width:620px; display:flex; flex-direction:column; gap:12px; }
  .cmp .row { display:grid; grid-template-columns:190px 1fr 90px; gap:12px; align-items:center; }
  .cmp .lb { font-size:12.5px; color:var(--dim); text-align:right; }
  .cmp .lb b { color:var(--ink); }
  .cmp .tr { height:20px; border-radius:5px; background:#efe8d5; border:1px solid var(--line2);
             position:relative; overflow:hidden; }
  .cmp .tr i { position:absolute; left:0; top:0; bottom:0; border-radius:4px; }
  .cmp .val { font-size:12.5px; font-variant-numeric:tabular-nums; font-weight:600; }

  /* format cards (comparison step) — all four on one page */
  .fmtgrid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;
             width:100%; max-width:800px; }
  .fmtc { border:1px solid var(--line2); border-radius:13px; background:#fbf8f0;
          padding:9px 16px 10px; display:flex; flex-direction:column; align-items:center;
          gap:2px; text-align:center; opacity:0;
          transition:opacity .3s, border-color .2s; }
  .fmtc { transform:translateY(8px); transition:opacity .4s, transform .4s, border-color .2s; }
  .fmtc.in { opacity:1; transform:none; }
  .fmtc.dim { opacity:.22; }
  .fmtc.hot { border-color:var(--gold); }
  .fmtc .fname { font-family:Georgia,serif; font-size:17px; }
  .fmtc .ftag { font-size:10px; color:var(--gold); font-weight:700;
                letter-spacing:.08em; text-transform:uppercase; }
  .fmtc .fline { font-size:11.5px; color:var(--dim); max-width:360px; line-height:1.45; }
  .fmtc .fline b { color:var(--ink); }

  /* dataset cards */
  .dsgrid { display:grid; grid-template-columns:repeat(2, 320px); gap:14px; }
  .dscard { border:1px solid var(--line2); border-radius:13px; background:#fbf8f0;
            padding:14px 16px; cursor:pointer; text-align:left;
            transition:box-shadow .15s, border-color .15s; }
  .dscard:hover { border-color:var(--gold); box-shadow:0 3px 12px rgba(184,134,11,.16); }
  .dscard .dn { font-family:Georgia,serif; font-size:17px; margin-bottom:2px; }
  .dscard .dd { font-size:12px; color:var(--dim); line-height:1.5; min-height:36px; }
  .dscard .dgo { font-size:12px; color:var(--gold); font-weight:700; margin-top:7px; }

  /* playground */
  .pg { display:flex; gap:18px; width:100%; height:100%; align-items:stretch; }
  .pgL { flex:0 0 340px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .pgR { flex:1; min-width:0; display:flex; flex-direction:column; }
  .pgR .cwrap { flex:1; position:relative; min-height:0; }
  .pgR canvas { position:absolute; inset:0; }
  .pg input[type=text] { width:100%; font-size:11px; padding:7px 9px; border:1px solid var(--line2);
        border-radius:8px; background:var(--card); color:var(--ink);
        font-family:"SF Mono",Menlo,monospace; }
  .pg select { width:100%; font-size:11.5px; padding:6px 8px; border:1px solid var(--line2);
        border-radius:8px; background:var(--card); color:var(--ink);
        font-family:"SF Mono",Menlo,monospace; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; }
  .chip { font-size:10.5px; cursor:pointer; border-radius:99px; padding:3px 9px;
          border:1px solid var(--line2); background:var(--card); color:var(--dim); }
  .chip:hover { color:var(--ink); border-color:var(--mut); }
  .chip.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .dims { border:1px solid var(--line); border-radius:9px; background:#fbf8f0; padding:6px 9px; }
  .dimRow { display:grid; grid-template-columns:78px 1fr 96px; gap:7px; align-items:center;
            padding:3px 0; }
  .dimRow .dn { font-family:"SF Mono",Menlo,monospace; font-size:10.5px; font-weight:600;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dimRow .dn .tag { font-size:8.5px; letter-spacing:.05em; color:var(--paper);
        background:var(--gold); border-radius:3px; padding:1px 4px; margin-left:4px;
        vertical-align:1px; }
  .dimRow .num { font-size:10px; color:var(--dim); text-align:right;
                 font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dimRow .num .cur { color:var(--gold); font-weight:600; }
  .cbar { position:relative; height:18px; border-radius:4px; overflow:hidden;
          background:#efe8d5; border:1px solid var(--line2); cursor:ew-resize; touch-action:none; }
  .cbar .cb { position:absolute; top:0; bottom:0; border-right:1px solid #d8cfb6; pointer-events:none; }
  .cbar .win { position:absolute; top:0; bottom:0; background:rgba(184,134,11,.35);
               border:1.5px solid var(--gold); border-radius:3px; pointer-events:none; }
  .cbar .ix { position:absolute; top:0; bottom:0; width:3px; background:var(--gold); pointer-events:none; }
  .pgEst { font-size:11.5px; color:var(--dim); min-height:30px; }
  .pgEst b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .pgEst .warn { color:var(--miss); font-weight:600; }
  .pgNarr { font-size:11.5px; border:1px solid var(--line); border-radius:8px;
            background:#fbf8f0; padding:6px 9px; flex:1; overflow-y:auto; min-height:44px; }
  .pgNarr .sz { color:var(--gold); font-weight:600; }
  .pgNarr .key { font-family:"SF Mono",Menlo,monospace; font-size:10px;
                 background:#f3edd9; border-radius:4px; padding:0 3px; }

  .banner { font-size:12px; color:var(--miss); background:#fdeee9; border:1px solid #eecabc;
            border-radius:9px; padding:6px 11px; margin-top:8px; display:none; }
  .banner.show { display:block; }
</style>
</head>
<body>
<div class="col">
  <div class="prog">
    <span class="n" id="pn"></span>
    <div class="dots" id="pdots"></div>
    <span class="n" id="pt"></span>
  </div>

  <div class="head">
    <p class="kicker" id="kicker"></p>
    <a class="learn" id="learn" target="_blank" rel="noopener"></a>
    <h1 id="title"></h1>
    <p class="copy" id="copy"></p>
  </div>

  <div class="stage" id="stage"></div>

  <div class="nav">
    <button class="b" id="back">← Back</button>
    <span class="hintkeys">use ← → keys</span>
    <button class="b primary" id="next">Next →</button>
  </div>
  <div class="foot" id="foot"></div>
  <div class="banner" id="banner"></div>
</div>

<script>
/* PIXEL_ICONS_INLINE_START — inlined copy of pixel_icons/icons.js.
   Relative <script src> does not resolve under /render?path=…, so the
   library is embedded verbatim. To update: re-copy pixel_icons/icons.js
   between these markers, then escape the literal closing script tag in
   its header comment as <\/script> (it terminates this block otherwise). */
/* ============================================================
   PixelIcons — pixelated / dithered icon library
   for the Zarr explainer (paper-editorial design system).

   Dependency-free. Attach with:
     <script src="pixel_icons/icons.js"><\/script>
     PixelIcons.draw('zarr', canvasEl, { size: 96, palette: 'paper' });

   Every icon is painted on a small logical grid (16 / 24 / 32 px)
   then blitted up with imageSmoothingEnabled = false, so pixels
   stay crisp at any size and any devicePixelRatio.
   Tone is done with a 4x4 ordered-dither (Bayer) matrix — the same
   checker shading the explainer's world map uses.
   ============================================================ */
(function () {
  "use strict";

  /* ---------- palettes (mirrors explainer.html tokens) ---------- */
  const PALETTES = {
    paper: {
      ink:      "#28231a",
      dim:      "#7b7260",
      line:     "#d6cdb8",
      card:     "#fffdf8",
      paper:    "#f6f2e9",
      gold:     "#b8860b",
      goldSoft: "#e9c869",
      goldDeep: "#7a5807",
      land:     "#e8dcc0",
      landMid:  "#cdbd97",
      landDark: "#a8966b",
      ocean:    "#d7e4ea",
      oceanDeep:"#b9cfd9",
      fetch:    "#1f8fb8",
      fetchSoft:"#9fcfe2",
      cache:    "#2f9e57",
      cacheSoft:"#b5dcc3"
    },
    /* thermal accent — warm check-palette to sanity-check contrast */
    thermal: {
      ink:      "#241c14",
      dim:      "#8a6a52",
      line:     "#dcc9ae",
      card:     "#fdf6ec",
      paper:    "#f6ede0",
      gold:     "#c4571a",
      goldSoft: "#f0a468",
      goldDeep: "#7c3208",
      land:     "#eedcbe",
      landMid:  "#d5b487",
      landDark: "#a97f4e",
      ocean:    "#e3d3be",
      oceanDeep:"#cdb694",
      fetch:    "#b03a12",
      fetchSoft:"#e8b294",
      cache:    "#6f7d2c",
      cacheSoft:"#cdd3a4"
    }
  };

  /* 4x4 Bayer ordered-dither matrix (values 0..15) */
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

  /* ---------- 32x16 land mask, downsampled at build time from
     mock_store/land_mask.json (lat 58°S..86°N, majority filter).
     Row 0 = north. -------------------------------------------- */
  const LAND32 = [
    "00000000000111000000000000000000",
    "00000000000111000000000111100000",
    "00111111000000000111111111111111",
    "00001111011000000111111111110000",
    "00000111110000001111111111110000",
    "00000111100000000001111111100000",
    "00000011000000011111111111100000",
    "00000000000000111111101111000000",
    "00000000011000011111000000000000",
    "00000000011100000111000000000000",
    "00000000011110000111000000000000",
    "00000000001110000110000000011000",
    "00000000001100000110000000111100",
    "00000000011000000000000000001000",
    "00000000000000000000000000000000",
    "00000000000000000000000000000000"
  ];

  /* ---------- tiny painter over a logical-pixel context ---------- */
  function painter(ctx, pal) {
    const p = {
      pal,
      px(x, y, c) { ctx.fillStyle = pal[c] || c; ctx.fillRect(x, y, 1, 1); },
      rect(x, y, w, h, c) { ctx.fillStyle = pal[c] || c; ctx.fillRect(x, y, w, h); },
      frame(x, y, w, h, c) {
        p.rect(x, y, w, 1, c); p.rect(x, y + h - 1, w, 1, c);
        p.rect(x, y, 1, h, c); p.rect(x + w - 1, y, 1, h, c);
      },
      /* ordered dither: paint cA where bayer < d (0..16), else cB (or skip) */
      dither(x, y, w, h, cA, d, cB) {
        for (let yy = y; yy < y + h; yy++)
          for (let xx = x; xx < x + w; xx++) {
            const on = bayer(xx, yy) < d;
            if (on) p.px(xx, yy, cA);
            else if (cB) p.px(xx, yy, cB);
          }
      },
      hline(x, y, w, c) { p.rect(x, y, w, 1, c); },
      vline(x, y, h, c) { p.rect(x, y, 1, h, c); }
    };
    return p;
  }

  /* ---------- ASCII-map painter ----------
     key: char -> color role, or {c, d, c2} for dithered mix */
  function paintMap(p, map, key) {
    for (let y = 0; y < map.length; y++) {
      const row = map[y];
      for (let x = 0; x < row.length; x++) {
        const k = key[row[x]];
        if (!k) continue;
        if (typeof k === "string") { p.px(x, y, k); }
        else {
          const on = bayer(x, y) < k.d;
          if (on) p.px(x, y, k.c);
          else if (k.c2) p.px(x, y, k.c2);
        }
      }
    }
  }

  /* ============================================================
     ICON DEFINITIONS
     each: { grid: N, paint(p, pal) }  — logical square grid NxN
     ============================================================ */
  const ICONS = {};

  /* ---- globe : pixel world map, real continents (32 grid) ---- */
  ICONS.globe = {
    grid: 32,
    paint(p) {
      // ocean field with a soft dithered frame band
      p.rect(0, 7, 32, 18, "ocean");
      p.dither(0, 7, 32, 1, "oceanDeep", 8);
      p.dither(0, 24, 32, 1, "oceanDeep", 8);
      // gentle ocean texture
      p.dither(0, 8, 32, 16, "oceanDeep", 2);
      // land
      for (let y = 0; y < 16; y++)
        for (let x = 0; x < 32; x++)
          if (LAND32[y][x] === "1") p.px(x, y + 8, "landDark");
      // dithered land highlight (sun-side)
      for (let y = 0; y < 16; y++)
        for (let x = 0; x < 32; x++)
          if (LAND32[y][x] === "1" && bayer(x, y) < 5) p.px(x, y + 8, "landMid");
    }
  };

  /* ---- cube : isometric data cube (24 grid) ---- */
  ICONS.cube = {
    grid: 24,
    paint(p) {
      const cx = 12;
      // top diamond: rows 3..13, widest at row 8 (x 1..22)
      for (let y = 3; y <= 13; y++) {
        const hw = (y <= 8 ? (y - 3) * 2 + 1 : (13 - y) * 2 + 1);
        p.rect(cx - hw, y, hw * 2, 1, "land");
        p.px(cx - hw, y, "ink"); p.px(cx + hw - 1, y, "ink");
      }
      p.rect(cx - 1, 3, 2, 1, "ink");
      // left face: cols 1..11, dithered within the face only
      for (let x = 1; x <= 11; x++) {
        const yt = 8 + ((x - 1) >> 1) + 1;
        for (let i = 0; i < 8; i++) {
          const y = yt + i;
          p.px(x, y, bayer(x, y) < 5 ? "landDark" : "landMid");
        }
        p.px(x, yt + 8, "ink");
      }
      // right face: mirrored, darker, dithered within the face only
      for (let x = 12; x <= 22; x++) {
        const m = 22 - x;
        const yt = 8 + (m >> 1) + 1;
        for (let i = 0; i < 8; i++) {
          const y = yt + i;
          p.px(x, y, bayer(x, y) < 2 ? "ink" : "landDark");
        }
        p.px(x, yt + 8, "ink");
      }
      // vertical edges
      p.vline(1, 8, 9, "ink"); p.vline(22, 8, 9, "ink");
      p.vline(11, 13, 9, "ink"); p.px(12, 13, "ink");
      // top-face grid hint (it's data)
      p.dither(cx - 5, 6, 10, 5, "landMid", 3);
    }
  };

  /* ---- zarr : chunked cube — 3x3 grid of blocks, one gold (24 grid) ---- */
  ICONS.zarr = {
    grid: 24,
    paint(p) {
      for (let r = 0; r < 3; r++)
        for (let c = 0; c < 3; c++) {
          const x = 1 + c * 8, y = 1 + r * 8; // 7px blocks, 1px gaps
          const hot = (r === 1 && c === 1);
          p.rect(x, y, 7, 7, hot ? "goldSoft" : "land");
          p.frame(x, y, 7, 7, hot ? "gold" : "landDark");
          p.dither(x + 1, y + 1, 5, 5, hot ? "gold" : "landMid", 4);
        }
      // corner tick: it's one addressable block
      p.px(1 + 8 + 1, 1 + 8 + 1, "goldDeep");
    }
  };

  /* ---- cog : one big raster file with overview pyramid (24 grid) ---- */
  ICONS.cog = {
    grid: 24,
    paint(p) {
      // page body with a clean folded corner (fold x13..16, y1..4)
      p.rect(3, 1, 14, 22, "card");
      p.rect(13, 1, 4, 4, "paper");   // cut the corner
      p.hline(3, 1, 10, "ink");       // top edge up to the fold
      p.vline(3, 1, 22, "ink");       // left
      p.hline(3, 22, 14, "ink");      // bottom
      p.vline(16, 4, 19, "ink");      // right, below the fold
      p.px(13, 1, "ink"); p.px(14, 2, "ink"); p.px(15, 3, "ink"); // diagonal
      p.hline(13, 4, 4, "ink");       // fold underside
      p.px(13, 2, "line"); p.px(13, 3, "line"); p.px(14, 3, "line"); // flap
      // overview pyramid: 3 rasters, small on top
      p.dither(9, 6, 3, 2, "fetch", 9, "fetchSoft");
      p.frame(8, 5, 5, 4, "ink");
      p.dither(8, 11, 6, 3, "fetch", 9, "fetchSoft");
      p.frame(7, 10, 8, 5, "ink");
      p.dither(6, 17, 9, 3, "fetch", 9, "fetchSoft");
      p.frame(5, 16, 11, 5, "ink");
    }
  };

  /* ---- netcdf : classic container box with layers (24 grid) ---- */
  ICONS.netcdf = {
    grid: 24,
    paint(p) {
      // lid (slightly lifted)
      p.rect(4, 2, 16, 3, "landMid");
      p.frame(4, 2, 16, 3, "ink");
      // box body
      p.rect(3, 6, 18, 16, "land");
      p.frame(3, 6, 18, 16, "ink");
      // three stacked layers inside
      const shades = ["landMid", "landDark", "landMid"];
      for (let i = 0; i < 3; i++) {
        const y = 8 + i * 5;
        p.dither(5, y, 14, 4, shades[i], 9, "land");
        p.frame(5, y, 14, 4, "ink");
      }
      // little "n" dimension ticks on the lid
      p.px(7, 3, "ink"); p.px(11, 3, "ink"); p.px(15, 3, "ink");
    }
  };

  /* ---- parquet : columnar bars (24 grid) ---- */
  ICONS.parquet = {
    grid: 24,
    paint(p) {
      const bars = [
        { x: 3,  h: 13, c: "fetch" },
        { x: 8,  h: 18, c: "gold" },
        { x: 13, h: 9,  c: "fetch" },
        { x: 18, h: 15, c: "fetch" }
      ];
      for (const b of bars) {
        const y = 21 - b.h;
        p.dither(b.x, y, 4, b.h, b.c, 9, b.c === "gold" ? "goldSoft" : "fetchSoft");
        p.frame(b.x, y, 4, b.h, "ink");
        // row-group segment lines
        for (let yy = y + 4; yy < 20; yy += 4) p.hline(b.x, yy, 4, "ink");
      }
      p.hline(1, 22, 22, "ink"); // baseline
    }
  };

  /* ---- chunk : single tile (16 grid) ---- */
  ICONS.chunk = {
    grid: 16,
    paint(p) {
      p.rect(2, 2, 12, 12, "land");
      p.dither(3, 3, 10, 10, "landMid", 6);
      p.frame(2, 2, 12, 12, "ink");
      // gold index tag in the corner: chunk "0.0"
      p.rect(3, 3, 4, 4, "goldSoft");
      p.frame(3, 3, 4, 4, "gold");
    }
  };

  /* ---- chunks_grid : 4x4 grid of tiles, one fetched (24 grid) ---- */
  ICONS.chunks_grid = {
    grid: 24,
    paint(p) {
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++) {
          const x = 0 + c * 6, y = 0 + r * 6; // 5px tiles + 1px gap
          const fetched = (r === 1 && c === 2);
          const cached = (r === 2 && c === 1);
          const body = fetched ? "fetch" : cached ? "cache" : "land";
          p.rect(x, y, 5, 5, body);
          if (!fetched && !cached) p.dither(x + 1, y + 1, 3, 3, "landMid", 5);
          p.frame(x, y, 5, 5, fetched ? "ink" : cached ? "ink" : "landDark");
        }
    }
  };

  /* ---- shard : many tiles packed into one file strip (24 grid) ---- */
  ICONS.shard = {
    grid: 24,
    paint(p) {
      // the one file (outer capsule)
      p.rect(1, 6, 22, 12, "card");
      p.frame(1, 6, 22, 12, "ink");
      // packed chunk tiles inside
      for (let i = 0; i < 4; i++) {
        const x = 3 + i * 4;
        p.rect(x, 8, 3, 8, "land");
        p.dither(x, 8, 3, 8, "landMid", 6);
        p.frame(x, 8, 3, 8, "landDark");
      }
      // gold index footer block at the end (shard index)
      p.rect(19, 8, 3, 8, "goldSoft");
      p.dither(19, 8, 3, 8, "gold", 6);
      p.frame(19, 8, 3, 8, "gold");
    }
  };

  /* ---- folder (16 grid) ---- */
  ICONS.folder = {
    grid: 16,
    paint(p) {
      paintMap(p, [
        "................",
        ".########.......",
        ".#ffffff#.......",
        ".##############.",
        ".#ffffffffffff#.",
        ".#ffffffffffff#.",
        ".#ffffffffffff#.",
        ".#ffffffffffff#.",
        ".#ffffffffffff#.",
        ".#dddddddddddd#.",
        ".#dddddddddddd#.",
        ".#dddddddddddd#.",
        ".##############.",
        "................",
        "................",
        "................"
      ], {
        "#": "ink",
        "f": "land",
        "d": { c: "landMid", d: 8, c2: "land" }
      });
    }
  };

  /* ---- file_json : metadata file with braces (16 grid) ---- */
  ICONS.file_json = {
    grid: 16,
    paint(p) {
      // page + fold + braces
      p.rect(2, 1, 12, 13, "card");
      p.frame(2, 1, 12, 13, "ink");
      // folded corner
      p.rect(10, 1, 4, 4, "paper");
      p.px(10, 1, "ink"); p.px(11, 2, "ink"); p.px(12, 3, "ink");
      p.hline(10, 4, 4, "ink");
      p.vline(13, 4, 10, "ink");
      p.px(10, 2, "line"); p.px(10, 3, "line"); p.px(11, 3, "line"); // flap
      // { } braces in ink
      p.vline(5, 6, 4, "ink"); p.px(6, 5, "ink"); p.px(6, 10, "ink"); p.px(4, 7, "ink");
      p.vline(10, 6, 4, "ink"); p.px(9, 5, "ink"); p.px(9, 10, "ink"); p.px(11, 7, "ink");
      // gold key:value dot
      p.rect(7, 7, 2, 2, "gold");
    }
  };

  /* ---- download : arrow into tray (16 grid) ---- */
  ICONS.download = {
    grid: 16,
    paint(p) {
      // arrow shaft
      p.rect(7, 1, 2, 6, "fetch");
      // arrow head
      p.rect(4, 6, 8, 1, "fetch");
      p.rect(5, 7, 6, 1, "fetch");
      p.rect(6, 8, 4, 1, "fetch");
      p.rect(7, 9, 2, 1, "fetch");
      // dither trail (bytes streaming)
      p.dither(7, 1, 2, 5, "fetchSoft", 5);
      // tray
      p.vline(2, 10, 4, "ink"); p.vline(13, 10, 4, "ink");
      p.hline(2, 13, 12, "ink");
      p.dither(3, 12, 10, 1, "line", 8);
    }
  };

  /* ---- receipt : till receipt (24 grid) ---- */
  ICONS.receipt = {
    grid: 24,
    paint(p) {
      p.rect(6, 1, 12, 20, "card");
      p.vline(6, 1, 20, "ink"); p.vline(17, 1, 20, "ink");
      p.hline(6, 1, 12, "ink");
      // zigzag torn bottom
      for (let x = 6; x < 18; x += 2) {
        p.px(x, 21, "ink"); p.px(x + 1, 20, "ink");
        p.px(x + 1, 21, "paper");
      }
      // printed lines
      p.hline(8, 4, 8, "dim");
      p.hline(8, 7, 5, "dim"); p.hline(14, 7, 2, "landDark");
      p.hline(8, 10, 6, "dim"); p.hline(15, 10, 1, "landDark");
      p.hline(8, 13, 4, "dim"); p.hline(14, 13, 2, "landDark");
      // divider + gold total
      p.dither(8, 15, 8, 1, "dim", 8);
      p.hline(8, 17, 3, "ink"); p.rect(13, 16, 3, 2, "goldSoft");
      p.frame(13, 16, 3, 2, "gold");
    }
  };

  /* ---- clock_wait (16 grid) ---- */
  ICONS.clock_wait = {
    grid: 16,
    paint(p) {
      p.rect(3, 3, 10, 10, "card");
      // circle-ish rim
      p.hline(5, 2, 6, "ink"); p.hline(5, 13, 6, "ink");
      p.vline(2, 5, 6, "ink"); p.vline(13, 5, 6, "ink");
      p.px(3, 3, "ink"); p.px(4, 3, "ink"); p.px(3, 4, "ink");
      p.px(11, 3, "ink"); p.px(12, 3, "ink"); p.px(12, 4, "ink");
      p.px(3, 11, "ink"); p.px(3, 12, "ink"); p.px(4, 12, "ink");
      p.px(12, 11, "ink"); p.px(11, 12, "ink"); p.px(12, 12, "ink");
      p.rect(4, 4, 8, 8, "card"); p.dither(4, 4, 8, 8, "paper", 3);
      // hands: minute up, hour right (waiting…)
      p.vline(7, 4, 4, "ink");
      p.hline(7, 8, 3, "ink"); p.px(7, 8, "gold");
    }
  };

  /* ---- bolt_fast (16 grid) ---- */
  ICONS.bolt_fast = {
    grid: 16,
    paint(p) {
      paintMap(p, [
        "................",
        "........KK......",
        ".......KGG......",
        "......KGGG......",
        ".....KGGG.......",
        "....KGGG........",
        "...KGGGGGKK.....",
        "...KKKKGGGK.....",
        "......KGGK......",
        ".....KGGK.......",
        "....KGGK........",
        "....KGK.........",
        "...KGK..........",
        "...KK...........",
        "................",
        "................"
      ], { "K": "ink", "G": "gold" });
      // speed ticks trailing on the left
      p.hline(1, 9, 2, "dim");
      p.hline(1, 11, 2, "dim");
    }
  };

  /* ---- link_out : learn-more arrow (16 grid) ---- */
  ICONS.link_out = {
    grid: 16,
    paint(p) {
      // box
      p.frame(2, 5, 9, 9, "ink");
      p.rect(3, 6, 7, 7, "card");
      p.dither(3, 6, 7, 7, "paper", 3);
      // arrow out to top-right
      p.px(8, 8, "gold"); p.px(9, 7, "gold"); p.px(10, 6, "gold");
      p.px(11, 5, "gold"); p.px(12, 4, "gold");
      // arrow head
      p.hline(9, 2, 5, "gold");
      p.vline(13, 2, 5, "gold");
      p.px(12, 3, "gold");
    }
  };

  /* ---- bulb : idea (16 grid) ---- */
  ICONS.bulb = {
    grid: 16,
    paint(p) {
      paintMap(p, [
        "................",
        ".....#####......",
        "....#ggggg#.....",
        "...#ggggggg#....",
        "...#ggGgggg#....",
        "...#gGggggg#....",
        "...#ggggggg#....",
        "....#ggggg#.....",
        ".....#ggg#......",
        ".....#####......",
        ".....#KKK#......",
        ".....#KKK#......",
        "......###.......",
        "................",
        "................",
        "................"
      ], {
        "#": "ink",
        "g": { c: "goldSoft", d: 11, c2: "gold" },
        "G": "card",
        "K": { c: "dim", d: 8, c2: "line" }
      });
      // rays
      p.px(1, 4, "gold"); p.px(13, 4, "gold");
      p.px(2, 1, "gold"); p.px(12, 1, "gold");
      p.px(7, 0, "gold");
    }
  };

  /* ---- act badges : aliases with palette shifts ---- */
  function shifted(base, shift) {
    return {
      grid: ICONS[base].grid,
      paint(p) {
        const pal2 = Object.assign({}, p.pal, shift(p.pal));
        ICONS[base].paint(painterProxy(p, pal2));
      }
    };
  }
  function painterProxy(p, pal2) {
    const q = Object.assign({}, p);
    q.pal = pal2;
    q.px = (x, y, c) => p.px(x, y, pal2[c] || c);
    q.rect = (x, y, w, h, c) => p.rect(x, y, w, h, pal2[c] || c);
    q.frame = (x, y, w, h, c) => p.frame(x, y, w, h, pal2[c] || c);
    q.hline = (x, y, w, c) => p.hline(x, y, w, pal2[c] || c);
    q.vline = (x, y, h, c) => p.vline(x, y, h, pal2[c] || c);
    q.dither = (x, y, w, h, cA, d, cB) =>
      p.dither(x, y, w, h, pal2[cA] || cA, d, cB ? (pal2[cB] || cB) : cB);
    return q;
  }
  ICONS.act_data = shifted("cube", (pal) => ({
    land: pal.goldSoft, landMid: pal.gold, landDark: pal.goldDeep
  }));
  ICONS.act_idea = shifted("bulb", () => ({}));
  ICONS.act_files = shifted("folder", (pal) => ({
    land: pal.goldSoft, landMid: pal.gold
  }));
  ICONS.act_world = shifted("globe", (pal) => ({
    ocean: pal.paper, oceanDeep: pal.line,
    landDark: pal.gold, landMid: pal.goldSoft
  }));

  /* ============================================================
     public API
     ============================================================ */
  function resolvePalette(pal) {
    if (!pal) return PALETTES.paper;
    if (typeof pal === "string") return PALETTES[pal] || PALETTES.paper;
    return Object.assign({}, PALETTES.paper, pal);
  }

  function draw(name, canvas, opts) {
    opts = opts || {};
    const def = ICONS[name];
    if (!def) throw new Error("PixelIcons: unknown icon '" + name + "'");
    const size = opts.size || 48;
    const pal = resolvePalette(opts.palette);

    // paint on the logical grid
    const off = document.createElement("canvas");
    off.width = def.grid; off.height = def.grid;
    const octx = off.getContext("2d");
    def.paint(painter(octx, pal), pal);

    // blit up, crisp
    const dpr = (typeof window !== "undefined" && window.devicePixelRatio) || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  const names = [
    "zarr", "cog", "netcdf", "parquet",
    "globe", "cube", "chunk", "chunks_grid", "shard",
    "folder", "file_json", "download", "receipt",
    "clock_wait", "bolt_fast", "link_out", "bulb",
    "act_data", "act_idea", "act_files", "act_world"
  ];

  window.PixelIcons = { draw, names, palettes: PALETTES, icons: ICONS };
})();
/* PIXEL_ICONS_INLINE_END */
</script>

<script>
"use strict";
/* =====================================================================
   What is Zarr? — a step-driven story.
   Instant interactions run against a LOCAL mini twin of the real store
   (mock_store/mur_sst_mini.zarr — real ERA5-derived temperatures, same
   layout as NASA's MUR store). Talking to the huge real store on S3 is
   one explicit opt-in moment, where the wait itself is the lesson.
   All numbers are measured live by the zarr_probe.py daemon, or are
   explicitly labelled canned (demo mode without the FusedRender bridge).
   ===================================================================== */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function el(tag, cls, html){ const e = document.createElement(tag);
  if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtB = n => n >= 1e12 ? (n/1e12).toFixed(1)+" TB"
             : n >= 1e9 ? (n/1e9).toFixed(1)+" GB"

  let tail = node.path ? key.slice(node.path.length + 1) : key;

    if (!tail.startsWith("c" + (node.separator || "/"))) return null;

  for (let r = 0; r < 90; r++) for (let c = 0; c < 180; c++)
    if (landDisp(r, c)) x.fillRect(c, r, 1, 1);
  x.fillStyle = "#93876c";                                   // coastline
  for (let r = 0; r < 90; r++) for (let c = 0; c < 180; c++){
    if (!landDisp(r, c)) continue;
    const sea = (r > 0 && !landDisp(r-1, c)) || (r < 89 && !landDisp(r+1, c)) ||
                (c > 0 && !landDisp(r, c-1)) || (c < 179 && !landDisp(r, c+1));
    if (sea) x.fillRect(c, r, 1, 1);
  }
  _face = cv;
  return cv;
}
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const W = +cv.dataset.w, H = +cv.dataset.h;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  c.imageSmoothingEnabled = false;
  return { c, W, H };
}
function planeCanvas(w, h){
  const cv = el("canvas", "cube");
  cv.dataset.w = w; cv.dataset.h = h;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  return cv;
}
/* stacked slabs behind a face — the time axis */
function paintSlabs(c, x, y, w, h, n, dx = 9, dy = -8){
  for (let s = n; s >= 1; s--){
    c.fillStyle = "rgba(214,205,184,.30)";
    c.strokeStyle = "rgba(168,158,138,.55)";
    c.lineWidth = 1;
    c.beginPath();
    c.roundRect(x + s*dx, y + s*dy, w, h, 3);
    c.fill(); c.stroke();
  }
}
function paintFace(c, x, y, w, h, opts = {}){
  c.drawImage(worldFace(), x, y, w, h);
  if (opts.dim){
    c.fillStyle = `rgba(246,242,233,${opts.dim})`;
    c.fillRect(x, y, w, h);
  }
  if (opts.grid){
    const [gr, gc] = opts.grid;
    c.strokeStyle = opts.gridColor || "rgba(90,75,40,.42)";
    c.lineWidth = opts.gridWidth || 1;
    for (let i = 1; i < gc; i++){
      c.beginPath(); c.moveTo(x + w*i/gc, y); c.lineTo(x + w*i/gc, y + h); c.stroke();
    }
    for (let i = 1; i < gr; i++){
      c.beginPath(); c.moveTo(x, y + h*i/gr); c.lineTo(x + w, y + h*i/gr); c.stroke();
    }
  }
  c.strokeStyle = "#a89e8a"; c.lineWidth = 1.2;
  c.strokeRect(x, y, w, h);
}
function axisLabels(c, x, y, w, h, lonLbl, latLbl, timeLbl, slabN, dx = 9, dy = -8){
  c.font = "12px Georgia, serif"; c.fillStyle = "#7b7260";
  if (lonLbl) c.fillText(lonLbl, x + w/2 - c.measureText(lonLbl).width/2, y + h + 18);
  if (latLbl){
    c.save();
    c.translate(x - 12, y + h/2 + c.measureText(latLbl).width/2);
    c.rotate(-Math.PI/2);
    c.fillText(latLbl, 0, 0);
    c.restore();
  }
  if (timeLbl){
    const tx = x + w + slabN*dx - c.measureText(timeLbl).width;
    c.fillText(timeLbl, tx, y + slabN*dy - 10);
  }
}

/* ---------- slice values -> colored picture ---------- */
const THERMAL = ["#31548f","#4a7fb5","#7fb2d0","#cfd9c4","#e8c46a","#dd8b4e","#c4503a"]
  .map(hx => [1,3,5].map(i => parseInt(hx.slice(i,i+2),16)));
const VIRIDIS = ["#440154","#472d7b","#3b528b","#2c728e","#21918c","#28ae80",
                 "#5ec962","#addc30","#fde725"].map(hx => [1,3,5].map(i => parseInt(hx.slice(i,i+2),16)));
function cmapOf(pal){
  return t => {
    const x = clamp(t, 0, 1) * (pal.length - 1);
    const i = Math.min(pal.length - 2, Math.floor(x)), f = x - i;
    return pal[i].map((v, k) => Math.round(v*(1-f) + pal[i+1][k]*f));
  };
}
const cmap = cmapOf(VIRIDIS);
function sliceImage(res, pal, flipY){
  const vals = res.values;
  if (!vals || !vals.length || res.numeric === false) return null;
  const h = vals.length, w = vals[0].length;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const x = cv.getContext("2d");
  const img = x.createImageData(w, h);
  const lo = res.p2 ?? res.vmin ?? 0, hi = res.p98 ?? res.vmax ?? 1;
  const span = (hi - lo) || 1;
  const cm = cmapOf(pal || VIRIDIS);
  const flip = flipY && !res.flipDone;
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++){
    const v = vals[flip ? h - 1 - yy : yy][xx], o = (yy*w + xx) * 4;
    if (v == null){ img.data[o+3] = 0; continue; }
    const [r,g,b] = cm((v - lo) / span);
    img.data[o] = r; img.data[o+1] = g; img.data[o+2] = b; img.data[o+3] = 255;
  }
  x.putImageData(img, 0, 0);
  return cv;
}

/* narration helper */
function narr(host){

    host.scrollTop = 1e9;
  }};
}

/* ---------- the isometric cube (playground only) ---------- */
function drawIso(cv, o){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || +cv.dataset.w, H = cv.clientHeight || +cv.dataset.h;
  if (!W || !H) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const gh = o.gh || 1, gw = o.gw || 1, slabs = Math.min(o.slabs || 0, 6);
  const availW = W - 40, availH = H - (o.labelU || o.labelV ? 58 : 30);
  let dw = Math.min(availW, o.maxW || 460);
  let ax = dw / 2, ay = dw / 4;
  const slabGap = slabs ? clamp(availH / (slabs + 4), 10, 22) : 0;
  const totalH = ay * 2 + slabs * slabGap + 26;
  if (totalH > availH){ const s = availH / totalH; dw *= s; ax = dw/2; ay = dw/4; }
  const cx = W * 0.5, cy = 26 + ay;
  const ux = ax / gw, uy = ay / gw, vx = -ax / gh, vy = ay / gh;
  const org = { x: cx - (ux*gw + vx*gh)/2, y: cy - (uy*gw + vy*gh)/2 };
  const pt = (r, cc) => ({ x: org.x + cc*ux + r*vx, y: org.y + cc*uy + r*vy });
  for (let s = slabs; s >= 1; s--){
    const oy = s * slabGap;
    const q = [pt(0,0), pt(0,gw), pt(gh,gw), pt(gh,0)];
    c.beginPath();
    c.moveTo(q[0].x, q[0].y + oy);
    q.slice(1).forEach(p => c.lineTo(p.x, p.y + oy));
    c.closePath();
    c.fillStyle = "rgba(214,205,184,.22)";
    c.strokeStyle = "rgba(168,158,138,.5)";
    c.lineWidth = 1;
    c.fill(); c.stroke();
  }
  const maxCells = 130;
  const stepR = Math.ceil(gh / maxCells), stepC = Math.ceil(gw / maxCells);
  const quad = (r, cc, sr, sc) => {
    const a = pt(r,cc), b = pt(r,cc+sc), d = pt(r+sr,cc+sc), e = pt(r+sr,cc);
    c.beginPath();
    c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.lineTo(d.x,d.y); c.lineTo(e.x,e.y);
    c.closePath();
  };
  for (let r = 0; r < gh; r += stepR) for (let cc = 0; cc < gw; cc += stepC){
    quad(r, cc, Math.min(stepR, gh-r), Math.min(stepC, gw-cc));
    c.fillStyle = "#efe8d5"; c.fill();
    c.strokeStyle = o.faint ? "#e6dfcc" : "#d6cdb8"; c.lineWidth = 0.7; c.stroke();
  }
  if (o.cells) for (const [k, st] of o.cells){
    const [r, cc] = k.split(",").map(Number);
    if (r >= gh || cc >= gw) continue;
    quad(r, cc, 1, 1);
    c.fillStyle = st.color; c.fill();
    c.strokeStyle = st.line || st.color; c.lineWidth = st.line ? 1.4 : 0.6; c.stroke();
    const cellPx = Math.min(Math.hypot(ux,uy), Math.hypot(vx,vy));
    if (cellPx < 5){
      const p = pt(r + .5, cc + .5);
      c.beginPath(); c.arc(p.x, p.y, 3.2, 0, Math.PI*2);
      c.fillStyle = st.color; c.fill();
      c.strokeStyle = "#fffdf8"; c.lineWidth = 1; c.stroke();
    }
  }
  if (o.img && o.imgWin){
    const [rA, rB, cA, cB] = o.imgWin.map((f, i) => f * (i < 2 ? gh : gw));
    const p0 = pt(rA, cA);
    const iw = o.img.width, ih = o.img.height;
    c.save();
    c.setTransform(dpr*(cB-cA)*ux/iw, dpr*(cB-cA)*uy/iw,
                   dpr*(rB-rA)*vx/ih, dpr*(rB-rA)*vy/ih, dpr*p0.x, dpr*p0.y);
    c.globalAlpha = 0.95;
    c.drawImage(o.img, 0, 0);
    c.restore();
  }
  if (o.outline){
    const [rA, rB, cA, cB] = o.outline.map((f, i) => f * (i < 2 ? gh : gw));
    const q = [pt(rA,cA), pt(rA,cB), pt(rB,cB), pt(rB,cA)];
    c.beginPath(); c.moveTo(q[0].x, q[0].y);
    q.slice(1).forEach(p => c.lineTo(p.x, p.y));
    c.closePath();
    c.strokeStyle = "#b8860b"; c.lineWidth = 1.8; c.stroke();
  }
  c.font = "12px Georgia, serif"; c.fillStyle = "#7b7260";
  if (o.labelU){ const p = pt(-0.06*gh - .001, gw*0.45); c.fillText(o.labelU, p.x - 30, p.y - 10); }
  if (o.labelV){ const p = pt(gh*0.55, -0.06*gw); c.fillText(o.labelV, p.x - c.measureText(o.labelV).width, p.y + 6); }
  if (o.labelD && slabs){ const p = pt(gh, gw); c.fillText(o.labelD, p.x + 8, p.y + slabGap + 6); }
  if (o.note){ c.fillStyle = "#a89e8a"; c.font = "11px Georgia, serif"; c.fillText(o.note, 10, H - 8); }
  return { pt, gh, gw };
}

/* ---- 0 · hook — the dataset builds itself, then hover to explore -------- */
step({
  act: 0,
  title: "An Interactive guide to Zarr",
  copy: "How huge datasets live in the cloud — told through NASA's record of the ocean's " +
        "temperature, <b>every day since 2002</b>.",
  async mount(st){
    const inn = el("div", "stage-in fadein");
    const cv = planeCanvas(620, 296);
    inn.appendChild(cv);
    const stats = el("div", "statrow");
    inn.appendChild(stats);
    const cap = el("div", "caption", "reading the dataset's own description…");
    inn.appendChild(cap);
    st.appendChild(inn);

    const t = await loadTree(MUR).catch(() => DEMO_TREES[MUR]);
    if (!st.isConnected) return;
    const a = arrOf(t, "analysed_sst");
    const total = a.shape.reduce((x,y) => x*y, 1);

    /* geometry of the drawing */
    const X = 118, Y = 82, W = 424, H = 194, SLABS = 5;
    /* draw state: 0..1 per phase + hover focus */
    const D = { grid: 0, slabs: 0, count: 0, bytes: 0, focus: null };
    function draw(){
      if (!st.isConnected) return;
      const { c } = setupCanvas(cv);
      const dimSlabs = D.focus && D.focus !== "days" && D.focus !== "count";
      const dimFace  = D.focus === "days" || D.focus === "bytes";
      // time slabs behind
      if (D.slabs > 0){
        const n = Math.max(1, Math.round(SLABS * D.slabs));
        c.globalAlpha = dimSlabs ? .25 : 1;
        for (let s = n; s >= 1; s--){
          c.fillStyle = D.focus === "days" ? "rgba(245,227,175,.65)" : "rgba(214,205,184,.30)";
          c.strokeStyle = D.focus === "days" ? "#b8860b" : "rgba(168,158,138,.55)";
          c.lineWidth = D.focus === "days" ? 1.4 : 1;
          c.beginPath(); c.roundRect(X + s*9, Y + s*-8, W, H, 3);
          c.fill(); c.stroke();
        }
        c.globalAlpha = 1;
        if (D.slabs >= 1){
          c.font = "12px Georgia, serif";
          c.fillStyle = D.focus === "days" ? "#7a5807" : "#7b7260";
          const lbl = `time — ${fmtN(a.shape[0])} days, stacked behind`;
          c.fillText(lbl, X + W + SLABS*9 - c.measureText(lbl).width, Y + SLABS*-8 - 10);
        }
      }
      // the world face, revealed left→right during the grid phase
      if (D.grid > 0){
        c.save();
        c.beginPath(); c.rect(X, Y, W * D.grid, H); c.clip();
        paintFace(c, X, Y, W, H, { dim: dimFace ? .8 : 0 });
        c.restore();
        // the "grid" texture: fine cell lines over the revealed part
        const gc = 24, gr = 12;
        c.strokeStyle = D.focus === "grid" ? "rgba(184,134,11,.65)" : "rgba(90,75,40,.18)";
        c.lineWidth = D.focus === "grid" ? 1 : .6;
        for (let i = 1; i < gc; i++){
          const gx = X + W*i/gc;
          if (gx > X + W*D.grid) break;
          c.beginPath(); c.moveTo(gx, Y); c.lineTo(gx, Y + H); c.stroke();
        }
        for (let i = 1; i < gr; i++){
          c.beginPath(); c.moveTo(X, Y + H*i/gr); c.lineTo(X + W*D.grid, Y + H*i/gr); c.stroke();
        }
        c.strokeStyle = D.focus === "grid" ? "#b8860b" : "#a89e8a";
        c.lineWidth = D.focus === "grid" ? 2 : 1.2;
        c.strokeRect(X, Y, W, H);
        if (D.grid >= 1){
          c.font = "12px Georgia, serif"; c.fillStyle = D.focus === "grid" ? "#7a5807" : "#7b7260";
          const lonL = `longitude — ${a.shape[2].toLocaleString("en-US")} cells →`;
          c.fillText(lonL, X + W/2 - c.measureText(lonL).width/2, Y + H + 18);
          c.save();
          const latL = `← latitude — ${a.shape[1].toLocaleString("en-US")} cells`;
          c.translate(X - 12, Y + H/2 + c.measureText(latL).width/2);
          c.rotate(-Math.PI/2); c.fillText(latL, 0, 0); c.restore();
        }
      }
      // whole-cube glow for the "temperatures" chip
      if (D.focus === "count"){
        c.strokeStyle = "#b8860b"; c.lineWidth = 2.4;
        c.strokeRect(X - 4, Y + SLABS*-8 - 4, W + SLABS*9 + 8, H - SLABS*-8 + 8);
      }
      // byte annotation for the TB chip
      if (D.focus === "bytes"){
        c.font = "600 15px Georgia, serif"; c.fillStyle = "#7a5807";
        const s1 = "every cell = one float32 temperature = 4 bytes";
        c.fillText(s1, X + W/2 - c.measureText(s1).width/2, Y + H/2 - 6);
        c.font = "13px Georgia, serif";
        const s2 = `${fmtN(total)} × 4 bytes = ${fmtB(a.logical_bytes)}`;
        c.fillText(s2, X + W/2 - c.measureText(s2).width/2, Y + H/2 + 16);
      }
    }

    /* the four stat chips, revealed one per phase */
    const CHIPS = [
      { id: "grid",  v: a.shape[1].toLocaleString("en-US") + " × " + a.shape[2].toLocaleString("en-US"),
        l: "grid cells in one day's map" },
      { id: "days",  v: fmtN(a.shape[0]), l: "days of ocean, stacked" },
      { id: "count", v: fmtN(total), l: "temperature points" },
      { id: "bytes", v: fmtB(a.logical_bytes), l: "of raw numbers" },
    ];
    const chipEls = CHIPS.map(ch => {
      const d = el("div", "stat hidden0",
        `<div class="v">${ch.v}</div><div class="l">${ch.l}</div>`);
      d.dataset.focus = ch.id;
      stats.appendChild(d);
      return d;
    });

    /* the build: 4 phases, then hand control to hover */
    const PH = [
      { key: "grid",  dur: 1300, cap: "one day of ocean = <b>one world map</b> — a grid of " +
          `${a.shape[1].toLocaleString("en-US")} × ${a.shape[2].toLocaleString("en-US")} cells` },
      { key: "slabs", dur: 1100, cap: `now stack <b>${fmtN(a.shape[0])} of those maps</b> behind ` +
          `each other — one per day since June 2002` },
      { key: "count", dur: 1300, cap: `count every cell of every map…` },
      { key: "bytes", dur: 800,  cap: `at 4 bytes per temperature, that's <b>${fmtB(a.logical_bytes)}</b> ` +
          `of raw numbers — in one public dataset` },
    ];
    let built = false;
    const countChipV = chipEls[2].querySelector(".v");
    function runPhase(i){
      if (!st.isConnected || i >= PH.length){ finishBuild(); return; }
      const ph = PH[i];
      cap.innerHTML = ph.cap;
      chipEls[i].classList.remove("hidden0");
      const t0 = performance.now();
      const loop = now => {
        if (!st.isConnected) return;
        const p = clamp((now - t0) / ph.dur, 0, 1);
        const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
        if (ph.key === "grid") D.grid = e;
        if (ph.key === "slabs") D.slabs = e;
        if (ph.key === "count"){
          D.count = e;
          const oneMap = a.shape[1] * a.shape[2];   // start the multiplication at one map
          countChipV.textContent = fmtN(oneMap + (total - oneMap) * e);
        }
        if (ph.key === "bytes") D.bytes = e;
        draw();
        if (p < 1) requestAnimationFrame(loop);
        else runPhase(i + 1);
      };
      requestAnimationFrame(loop);
    }
    function finishBuild(){
      if (!st.isConnected) return;
      built = true;
      countChipV.textContent = fmtN(total);
      cap.innerHTML = (DEMO
        ? "demo mode — canned metadata · "
        : "read live from the store's own metadata · ") +
        "<b>hover any number</b> to see it in the drawing — then press <b>Start</b>";
      draw();
    }
    /* hover a chip -> that component glows, everything else fades */
    chipEls.forEach(d => {
      d.addEventListener("mouseenter", () => {
        if (!built) return;
        D.focus = d.dataset.focus;
        chipEls.forEach(x => { x.classList.toggle("dim", x !== d); x.classList.toggle("hot", x === d); });
        draw();
      });
      d.addEventListener("mouseleave", () => {
        if (!built) return;
        D.focus = null;
        chipEls.forEach(x => { x.classList.remove("dim"); x.classList.remove("hot"); });
        draw();
      });
    });
    draw();
    setTimeout(() => runPhase(0), 350);
  }
});
