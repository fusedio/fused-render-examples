<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flightdeck Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.16 0.015 250);
    --surface: oklch(0.19 0.018 250);
    --surface-2: oklch(0.23 0.02 250);
    --border: oklch(0.28 0.02 250);
    --ink: oklch(0.93 0.01 250);
    --muted: oklch(0.62 0.02 250);
    --faint: oklch(0.60 0.02 250);
    --accent: oklch(0.78 0.14 75);
    --accent-dim: oklch(0.78 0.14 75 / 0.35);
    --accent-track: oklch(0.78 0.14 75 / 0.12);
    --accent-lite: oklch(0.84 0.10 75);
    --sel: oklch(0.72 0.09 230);
    --ok: oklch(0.75 0.14 150);
    --bad: oklch(0.68 0.18 25);
    --bad-dim: oklch(0.68 0.18 25 / 0.14);
    --display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: oklch(0.14 0.014 250 / 0.92); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 30; flex-wrap: wrap;
  }
  .brand { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .hspacer { flex: 1; }
  .updated { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .updated b { color: var(--ink); }
  a.navlink {
    color: var(--muted); font-family: var(--mono); font-size: 11px; text-decoration: none;
    border: 1px solid var(--border); padding: 4px 10px; border-radius: 7px; white-space: nowrap;
    transition: color 160ms ease-out, background 160ms ease-out, border-color 160ms ease-out;
  }
  a.navlink:hover { color: var(--ink); background: var(--surface-2); border-color: var(--faint); }

  /* ---------- layout ---------- */
  main { max-width: 1060px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- hero ---------- */
  .hero { padding: 56px 0 44px; }
  .hero .big {
    font-family: var(--display); font-weight: 700; font-size: clamp(52px, 11vw, 84px);
    line-height: 0.98; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  .hero .lbl { font-size: 15px; color: var(--muted); margin-top: 12px; max-width: 42ch; }
  .hero .note { display: none; }
  .hero .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); margin-right: 9px; vertical-align: 2px;
    animation: live-pulse 1.8s ease-out infinite;
  }
  @keyframes live-pulse { 0% { box-shadow: 0 0 0 0 oklch(0.75 0.14 150 / 0.5); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* ---------- sections ---------- */
  section.block { border-top: 1px solid var(--border); padding: 30px 0 8px; }
  .block > h2 {
    margin: 0 0 20px; font-family: var(--mono); font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- horizontal bars ---------- */
  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 190px) 1fr auto; gap: 16px; align-items: center; }
  .bar-row .lab { font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-row .lab .code {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: 7px;
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; letter-spacing: 0.03em;
  }
  .bar-track { position: relative; height: 8px; border-radius: 5px; background: var(--accent-track); overflow: hidden; }
  .bar-fill {
    position: absolute; inset: 0 auto 0 0; width: 0;
    background: var(--accent); border-radius: 5px;
    transition: width 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .bar-row .val { font-family: var(--mono); font-size: 13px; font-weight: 600; text-align: right; min-width: 44px; }
  @media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }

  /* ---------- altitude histogram ---------- */
  .hist { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: end; height: 220px; }
  .hcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 8px; }
  .hcol .hv { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); }
  .hcol .col-track { width: 100%; display: flex; align-items: flex-end; justify-content: center; flex: 1; }
  .hcol .col {
    width: 100%; max-width: 76px; min-height: 3px; height: 0;
    background: var(--accent);
    border-radius: 6px 6px 0 0;
    transition: height 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .hcol .hlab { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
  .hcol .hunit { font-size: 9.5px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .hcol .col { transition: none; } }

  /* ---------- right now superlatives ---------- */
  .super { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 44px; }
  .super .card { border-top: 2px solid var(--accent); padding-top: 14px; }
  .super .card .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .super .card .v {
    font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 44px);
    letter-spacing: -0.02em; line-height: 1.05; margin: 6px 0 4px; font-variant-numeric: tabular-nums;
  }
  .super .card .v small { font-size: 17px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .super .card .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .super .card .sub b { color: var(--ink); font-weight: 600; }
  .emg {
    display: flex; align-items: center; gap: 12px; margin-top: 22px;
    border-top: 1px solid var(--bad); background: var(--bad-dim);
    border-radius: 0 0 8px 8px; padding: 12px 14px; font-family: var(--mono); font-size: 13px; color: var(--bad);
  }
  .emg .sq { font-weight: 700; }
  .muted-line { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 22px; }
  .muted-line b { color: var(--ink); }
  @media (max-width: 640px) { .super { grid-template-columns: 1fr; } }

  /* ---------- states ---------- */
  .state { padding: 90px 0; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .state.err { color: var(--bad); }
  .state .dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .state .dots::after { animation: none; content: "…"; } }

  .foot { border-top: 1px solid var(--border); margin-top: 40px; padding-top: 20px; color: var(--muted); font-size: 12px; }
  .foot span { font-family: var(--mono); color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .hero .live-dot { animation: none; } }

  /* ---------- living world-map hero ---------- */
  .hero {
    position: relative; height: 340px; padding: 0; margin-bottom: 4px;
    display: flex; align-items: flex-end;
  }
  .worldband {
    position: absolute; inset: 0; left: 50%; width: 100vw; transform: translateX(-50%);
    overflow: hidden; z-index: 0;
    background: radial-gradient(120% 140% at 30% 10%, oklch(0.17 0.016 250), oklch(0.115 0.013 250) 70%);
    border-bottom: 1px solid var(--border);
  }
  .worldband canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero::before {
    content: ""; position: absolute; inset: 0; left: 50%; width: 100vw; transform: translateX(-50%);
    z-index: 1; pointer-events: none;
    background:
      linear-gradient(90deg, oklch(0.115 0.013 250 / 0.92), oklch(0.115 0.013 250 / 0.35) 42%, transparent 66%),
      linear-gradient(0deg, oklch(0.115 0.013 250 / 0.8), transparent 45%);
  }
  .herotext { position: relative; z-index: 2; padding-bottom: 30px; }
  .herotext .lbl .glow { color: var(--accent); }

  /* ---------- emergency banner (full-bleed, under hero) ---------- */
  .emgbanner {
    position: relative; left: 50%; width: 100vw; transform: translateX(-50%);
    display: block; border-top: 1px solid var(--bad); border-bottom: 1px solid var(--bad);
    background: var(--bad-dim); margin-bottom: 4px;
  }
  .emgbanner a {
    display: flex; align-items: center; gap: 10px; max-width: 1060px; margin: 0 auto;
    padding: 11px 24px; text-decoration: none;
    font-family: var(--mono); font-size: 13px; color: var(--bad);
  }
  .emgbanner a:hover { background: oklch(0.68 0.18 25 / 0.08); }
  .emgbanner .sq { font-weight: 700; }
  .emgbanner .cs { color: oklch(0.82 0.16 25); font-weight: 700; }
  .emgbanner .arr { margin-left: auto; opacity: 0.8; }
  .emgbanner .edot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); animation: wblink 1s steps(2) infinite; }
  @media (prefers-reduced-motion: reduce) { .emgbanner .edot { animation: none; } }

  /* ---------- military in the air ---------- */
  .mil-wrap { display: grid; grid-template-columns: auto 1fr; gap: 28px 40px; align-items: start; }
  .mil-num {
    font-family: var(--display); font-weight: 700; font-size: clamp(52px, 9vw, 78px);
    line-height: 0.95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  .mil-num small { display: block; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .mil-types { font-family: var(--mono); font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
  .mil-types b { color: var(--ink); font-weight: 600; }
  .mil-rows { display: flex; flex-direction: column; }
  a.mil-row {
    display: grid; grid-template-columns: minmax(90px, 130px) 1fr auto auto; gap: 14px; align-items: baseline;
    padding: 8px 0; border-top: 1px solid var(--border); text-decoration: none; color: var(--ink);
    transition: color 140ms ease-out;
  }
  a.mil-row:hover { color: var(--accent); }
  a.mil-row .mcs { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  a.mil-row .mtype { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  a.mil-row .malt { font-family: var(--mono); font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
  a.mil-row .mradar { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  a.mil-row:hover .mradar { color: var(--accent); }
  @media (max-width: 640px) { .mil-wrap { grid-template-columns: 1fr; gap: 16px; } a.mil-row { grid-template-columns: 1fr auto; gap: 6px 12px; } a.mil-row .mtype { grid-column: 1; } }

  /* ---------- watch strip (cross-page) ---------- */
  #watch {
    position: fixed; left: 50%; bottom: 14px; transform: translate(-50%, 70px); z-index: 1400;
    display: flex; gap: 8px; align-items: center;
    transition: transform 420ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  #watch.show { transform: translate(-50%, 0); }
  #watch .wpill {
    display: flex; align-items: center; gap: 8px; text-decoration: none;
    background: oklch(0.14 0.014 250 / 0.94); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
    font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  #watch .wpill:hover { color: var(--ink); border-color: oklch(0.45 0.02 250); }
  #watch .wpill.emg { border-color: oklch(0.68 0.18 25 / 0.6); color: oklch(0.72 0.16 25); }
  #watch .wpill.emg b { color: oklch(0.78 0.18 25); }
  #watch .wpill .wdot { width: 6px; height: 6px; border-radius: 50%; background: oklch(0.68 0.18 25); animation: wblink 1s steps(2) infinite; }
  #watch .wpill b { color: var(--ink); font-weight: 700; }
  @keyframes wblink { 50% { opacity: 0.2; } }
  @media (prefers-reduced-motion: reduce) { #watch { transition: none; } #watch .wpill .wdot { animation: none; } }
</style>
</head>
<body>

<header>
  <div class="brand">✈ FLIGHTDECK <span>PULSE</span></div>
  <div class="hspacer"></div>
  <div class="updated" id="updated">—</div>
  <svg id="ring" viewBox="0 0 22 22" width="22" height="22" style="transform:rotate(-90deg)"><circle cx="11" cy="11" r="8.5" fill="none" stroke-width="3" stroke="var(--border)"/><circle class="fgc" cx="11" cy="11" r="8.5" fill="none" stroke-width="3" stroke="var(--accent)" stroke-linecap="round" stroke-dasharray="53.4" stroke-dashoffset="0"/></svg>
  <a class="navlink" target="_top" id="to-radar" href="#">RADAR →</a>
  <a class="navlink" target="_top" id="to-airport" href="#">AIRPORT →</a>
  <a class="navlink" target="_top" id="to-hazards" href="#">EARTH OPS →</a>
  <a class="navlink" target="_top" id="to-sky" href="#">SKY →</a>
  <a class="navlink" target="_top" id="to-deck" href="#">FLIGHT LOOKUP →</a>
</header>

<main id="main">
  <div class="state" id="loading"><span class="dots">sampling 12 regions</span></div>
</main>

<script>
/* Fleet link map: in the local explorer, links stay path-derived; on a hosted
   mount (no .html in the pathname) they jump to the sibling pages' mount URLs. */
const FLEET = {
  flightdeck: "https://unstable.open.fused.io/wihwz3nnlet3avpsr3qa22ywrm",
  radar: "https://unstable.open.fused.io/rxinluszcawhiuqq3q6yudzq7i",
  sky: "https://unstable.open.fused.io/haqkwfhssniuf5bnbrk7djcuy4",
  hazards: "https://unstable.open.fused.io/ay5cnfvfsztxf3qexrlkydrepi",
  airport: "https://unstable.open.fused.io/g7vo3aqk7omoe5ghiikwzb2sga",
  pulse: "https://unstable.open.fused.io/eakvgokukg2xxfbq5zejbwsqaa",
  tour: "https://unstable.open.fused.io/ryd4kokg5siosfnxaqwfhzhc4q",
};
function FD(view) {
  const m = String(view).match(/^([^.?]+)(?:\.html)?(\?.*)?$/);
  const name = m ? m[1] : String(view);
  const qs = (m && m[2]) || "";
  let base = null;
  try {
    const p = window.top.location.pathname;
    if (/\.html/.test(p)) base = p.replace(/\/[^/]*\.html.*$/, "");
  } catch (e) {}
  if (base === null && /\.html/.test(location.pathname))
    base = location.pathname.replace(/\/[^/]*\.html.*$/, "");
  const FD_PATHS = {
    flightdeck: "flightdeck.html", radar: "pages/radar.html", sky: "pages/sky.html",
    hazards: "pages/hazards.html", airport: "pages/airport.html",
    pulse: "pages/pulse.html", tour: "pages/tour.html",
  };
  if (base !== null) base = base.replace(/\/pages$/, "");
  return base !== null ? `${base}/${FD_PATHS[name] || name + ".html"}${qs}` : (FLEET[name] || "#") + qs;
}
</script>
<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const REFRESH_MS = 60000;

const base = (() => {
  try { return window.top.location.pathname.replace(/\/[^/]*\.html.*$/, ""); } catch (e) {}
  return location.pathname.replace(/\/pulse\.html.*/, "");
})();
$("#to-radar").href = base + "/radar.html";
$("#to-airport").href = base + "/airport.html";
$("#to-hazards").href = base + "/hazards.html";
$("#to-sky").href = base + "/sky.html";
$("#to-deck").href = base + "/flightdeck.html";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
const nf = n => (n == null ? "—" : Number(n).toLocaleString("en-IN"));

/* ---------------- state ---------------- */
let busy = false, reqCounter = 0;
let lastTs = 0, prevTotal = 0, tickTimer = null;

/* ---------------- fetch loop ---------------- */
async function refresh() {
  if (busy) return;
  busy = true;
  const my = ++reqCounter;
  try {
    const res = await fused.runPython("./pulse.py", {});
    if (my !== reqCounter) return;
    if (!res || !res.ok) { renderError(); return; }
    lastTs = Date.now(); // fetch time, not data ts — server /tmp cache can be minutes old on a warm container
    render(res);
    prevTotal = res.total || 0;
  } catch (e) {
    console.warn("pulse fetch failed", e);
    if (my === reqCounter && !$("#hero")) renderError();
  } finally {
    busy = false;
  }
}

function renderError() {
  $("#main").innerHTML = `<div class="state err">could not reach the ADS-B feed — retrying on the next cycle</div>`;
}

/* ---------------- render ---------------- */
function render(d) {
  const startFrom = prevTotal;
  $("#main").innerHTML = `
    <section class="hero" id="hero">
      <div class="worldband"><canvas id="worldmap"></canvas></div>
      <div class="herotext">
        <div class="big"><span id="total-num">${nf(startFrom || 0)}</span></div>
        <div class="lbl"><span class="live-dot"></span>aircraft airborne across 12 sampled regions right now <span class="glow">· sampled hubs glowing below</span></div>
        <div class="note">${esc(d.sampled_note || "")}</div>
      </div>
    </section>
    ${emgBanner(d)}

    ${barSection("Where they are", (d.regions || []).map(r => ({ lab: r.region, n: r.n })))}
    ${barSection("Who's flying", (d.airlines || []).map(a => ({ lab: a.name, code: a.code, n: a.n })))}
    ${barSection("What they're flying", (d.types || []).map(t => ({ lab: t.name, code: t.code, n: t.n })))}
    ${histSection(d.alt_hist || [])}
    ${superSection(d)}
    ${militarySection(d)}

    <div class="foot">Live ADS-B positions sampled from <span>airplanes.live</span> · 12 hub regions at 250 nm radius, deduplicated by aircraft · airborne only. A snapshot of sampled traffic, not a global census.</div>
  `;
  updateTimeLabel();
  clearInterval(tickTimer);
  tickTimer = setInterval(updateTimeLabel, 1000);

  // count-up on the hero
  countUp($("#total-num"), startFrom || 0, d.total || 0);
  // living world map
  drawWorld(d.points || []);
  // animate bars + columns on next frame
  requestAnimationFrame(() => requestAnimationFrame(animateFills));
}

/* fills tween from their PREVIOUS value on refresh, never back to zero */
const prevFills = new Map();
function fillFrom(key) { return (prevFills.get(key) || 0).toFixed(1); }

function barSection(title, rows) {
  if (!rows.length) return "";
  const max = Math.max(1, ...rows.map(r => r.n));
  const body = rows.map(r => {
    const key = title + "|" + (r.code || r.lab);
    const w = (r.n / max * 100).toFixed(1);
    return `
    <div class="bar-row">
      <div class="lab">${esc(r.lab)}${r.code ? `<span class="code">${esc(r.code)}</span>` : ""}</div>
      <div class="bar-track"><div class="bar-fill" data-w="${w}" data-key="${esc(key)}" style="width:${fillFrom(key)}%"></div></div>
      <div class="val">${nf(r.n)}</div>
    </div>`;
  }).join("");
  return `<section class="block"><h2>${esc(title)}</h2><div class="bars">${body}</div></section>`;
}

function histSection(hist) {
  if (!hist.length) return "";
  const max = Math.max(1, ...hist.map(h => h.n));
  const cols = hist.map(h => {
    const key = "hist|" + h.band;
    const hh = (h.n / max * 100).toFixed(1);
    return `
    <div class="hcol">
      <div class="hv">${nf(h.n)}</div>
      <div class="col-track"><div class="col" data-h="${hh}" data-key="${esc(key)}" style="height:${fillFrom(key)}%"></div></div>
      <div class="hlab">${esc(h.band)}<span class="hunit"> ft</span></div>
    </div>`;
  }).join("");
  return `<section class="block"><h2>How high</h2><div class="hist">${cols}</div></section>`;
}

function superSection(d) {
  const f = d.fastest, h = d.highest;
  const fastCard = f ? `
    <div class="card">
      <div class="k">Fastest right now</div>
      <div class="v">${nf(f.gs)}<small>kt</small></div>
      <div class="sub"><b>${esc(f.cs)}</b> · ${esc(f.type)} · ${esc(f.region)}</div>
    </div>` : "";
  const highCard = h ? `
    <div class="card">
      <div class="k">Highest right now</div>
      <div class="v">${nf(h.alt)}<small>ft</small></div>
      <div class="sub"><b>${esc(h.cs)}</b> · ${esc(h.type)} · ${esc(h.region)}</div>
    </div>` : "";
  const mil = `<div class="muted-line"><b>${nf(d.mil_count || 0)}</b> military aircraft tracked in the sample</div>`;
  return `<section class="block"><h2>Right now</h2><div class="super">${fastCard}${highCard}</div>${mil}</section>`;
}

/* ---------------- emergency banner (full-bleed, under hero) ---------------- */
function emgBanner(d) {
  const list = d.emergencies || [];
  if (!list.length) return "";
  const e = list[0];
  const href = base + `/radar.html?lat=${(+e.lat).toFixed(3)}&lon=${(+e.lon).toFixed(3)}&z=8&sel=${esc(e.hex)}`;
  const more = list.length > 1 ? ` <span style="opacity:0.7">+${list.length - 1} more</span>` : "";
  return `<div class="emgbanner"><a target="_top" href="${href}"><span class="edot"></span>⚠ SQUAWK <span class="sq">${esc(e.squawk)}</span> — <span class="cs">${esc(e.cs)}</span> (${esc(e.type)}) · follow on radar${more}<span class="arr">↗</span></a></div>`;
}

/* ---------------- military in the air ---------------- */
function militarySection(d) {
  const m = d.military || {};
  if (!m.count) return "";
  const types = (m.types || []).map(t => `<b>${esc(t.code)}</b> ×${t.n}`).join(" · ");
  const rows = (m.sample || []).map(s => {
    const href = base + `/radar.html?lat=${(+s.lat).toFixed(3)}&lon=${(+s.lon).toFixed(3)}&z=8&sel=${esc(s.hex)}`;
    const alt = s.alt == null ? "—" : nf(s.alt) + " ft";
    return `<a class="mil-row" target="_top" href="${href}">
      <span class="mcs">${esc(s.cs)}</span>
      <span class="mtype">${esc(s.type)}</span>
      <span class="malt">${alt}</span>
      <span class="mradar">◎ radar</span>
    </a>`;
  }).join("");
  return `<section class="block"><h2>Military in the air</h2>
    <div class="mil-wrap">
      <div class="mil-num">${nf(m.count)}<small>military aircraft airborne</small></div>
      <div class="mil-right">
        ${types ? `<div class="mil-types">${types}</div>` : ""}
        <div class="mil-rows">${rows}</div>
      </div>
    </div></section>`;
}

/* ---------------- living world map (equirectangular, lat-cropped [-60,72]) ---------------- */
let worldFirst = true;
let worldRAF = null;
let lastPoints = [];
function drawWorld(points) {
  lastPoints = points;
  const cv = $("#worldmap");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }
  let { w, h } = resize();

  // projection: x from full lon; y cropped to lat [-60, 72] -> (72-lat)/132
  const px = lon => (lon + 180) / 360 * w;
  const py = lat => (72 - lat) / 132 * h;
  const opacity = alt => 0.25 + Math.max(0, Math.min(1, (alt || 0) / 42000)) * 0.65;

  function graticule() {
    ctx.save();
    ctx.strokeStyle = "oklch(0.28 0.02 250 / 0.4)";
    ctx.lineWidth = 1;
    for (let lon = -180; lon <= 180; lon += 30) {
      const x = px(lon); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let lat = -60; lat <= 72; lat += 30) {
      const y = py(lat); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.restore();
  }

  function dot(p, mul) {
    const x = px(p[1]), y = py(p[0]);
    if (y < -4 || y > h + 4) return;
    ctx.globalAlpha = opacity(p[2]) * mul;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, 6.2832);
    ctx.fill();
  }

  const sweep = worldFirst && !REDUCED;
  worldFirst = false;

  if (!sweep) {
    // refresh (or reduced-motion): quick uniform draw
    ctx.clearRect(0, 0, w, h);
    graticule();
    ctx.fillStyle = "oklch(0.80 0.14 75)";
    for (const p of points) dot(p, 1);
    ctx.globalAlpha = 1;
    return;
  }

  // first paint: west->east staggered fade-in over ~1.2s
  const DUR = 1200, FADE = 380;
  const t0 = performance.now();
  cancelAnimationFrame(worldRAF);
  (function frame(ts) {
    const el = ts - t0;
    ctx.clearRect(0, 0, w, h);
    graticule();
    ctx.fillStyle = "oklch(0.80 0.14 75)";
    for (const p of points) {
      const delay = (px(p[1]) / w) * (DUR - FADE);      // longitude -> delay
      const local = Math.max(0, Math.min(1, (el - delay) / FADE));
      if (local <= 0) continue;
      dot(p, local);
    }
    ctx.globalAlpha = 1;
    if (el < DUR) worldRAF = requestAnimationFrame(frame);
  })(t0);
}

function animateFills() {
  for (const el of document.querySelectorAll(".bar-fill")) {
    el.style.width = el.dataset.w + "%";
    prevFills.set(el.dataset.key, parseFloat(el.dataset.w));
  }
  for (const el of document.querySelectorAll(".hcol .col")) {
    el.style.height = el.dataset.h + "%";
    prevFills.set(el.dataset.key, parseFloat(el.dataset.h));
  }
}

function countUp(el, from, to) {
  if (!el) return;
  if (REDUCED || !isFinite(to)) { el.textContent = nf(to); return; }
  const t0 = performance.now(), dur = 900;
  (function tick(ts) {
    const p = Math.min(1, (ts - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = nf(Math.round(from + (to - from) * e));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

function updateTimeLabel() {
  if (!lastTs) { $("#updated").textContent = "—"; return; }
  const s = Math.max(0, Math.round((Date.now() - lastTs) / 1000));
  const txt = s < 60 ? `${s}s ago` : `${Math.floor(s / 60)}m ${s % 60}s ago`;
  $("#updated").innerHTML = `updated <b>${txt}</b>`;
}

/* ---------------- boot ---------------- */
let lastRefreshAt = performance.now();
(function ringLoop() {
  requestAnimationFrame(ringLoop);
  const k = Math.min(1, (performance.now() - lastRefreshAt) / REFRESH_MS);
  const el = $("#ring .fgc");
  if (el) el.style.strokeDashoffset = String(53.4 * (1 - k));
})();
refresh();
setInterval(() => { lastRefreshAt = performance.now(); refresh(); }, REFRESH_MS);

// keep the world map crisp on resize (static redraw, no sweep)
let worldResizeT = null;
window.addEventListener("resize", () => {
  clearTimeout(worldResizeT);
  worldResizeT = setTimeout(() => { worldFirst = false; drawWorld(lastPoints); }, 150);
});

/* ---------- watch strip: global emergencies + resume-last-flight (all pages share this) ---------- */
(function watchStrip() {
  const PAGE = location.pathname.split("/").pop().replace(".html", "") || "view";
  const el = document.createElement("div");
  el.id = "watch";
  document.body.appendChild(el);
  function wbase() {
    try { return window.top.location.pathname.replace(/\/[^/]*\.html.*$/, ""); } catch (e) {}
    return "";
  }
  function paint(emergencies) {
    const bits = [];
    for (const e of (emergencies || []).slice(0, 2)) {
      bits.push(`<a class="wpill emg" target="_top" href="${FD("radar")}?lat=${(+e.lat).toFixed(3)}&lon=${(+e.lon).toFixed(3)}&z=8&sel=${e.hex}"><span class="wdot"></span>SQUAWK ${e.squawk} — <b>${e.cs}</b>${e.type ? " · " + e.type : ""} · follow ↗</a>`);
    }
    let last = null;
    try { last = JSON.parse(localStorage.getItem("fd:lastFlight") || "null"); } catch (err) {}
    if (last && last.flight && Date.now() - (last.ts || 0) < 86400000 && PAGE !== "flightdeck") {
      bits.push(`<a class="wpill" target="_top" href="${FD("flightdeck")}?flight=${encodeURIComponent(last.flight)}">resume <b>${last.flight}</b> →</a>`);
    }
    el.innerHTML = bits.join("");
    el.classList.toggle("show", bits.length > 0);
  }
  async function sweep() {
    try {
      const r = await fused.runPython("./radar.py", { mode: "watch" });
      paint(r && r.ok ? r.emergencies : []);
    } catch (e) { paint([]); }
  }
  paint([]);
  sweep();
  setInterval(sweep, 90000);
})();
</script>
