    stripWrap.appendChild(strip);
    stripWrap.appendChild(el("div", "caption",
      "months (the time axis) — counted 0…11, not 1…12"));
    left.appendChild(stripWrap);
    row.appendChild(left);
    const side = el("div");
    side.style.cssText = "width:320px; display:flex; flex-direction:column; gap:10px;";
    side.innerHTML = `
      <div class="keylab">the file you'd need</div>
      <div class="bigkey"><span class="pre">analysed_sst/c/</span><span class="seg" data-ax="0"></span><span class="pre">/</span><span class="seg" data-ax="1"></span><span class="pre">/</span><span class="seg" data-ax="2"></span></div>
      <div class="keywords" id="kw"></div>`;
    row.appendChild(side);
    inn.appendChild(row);
    const cap = el("div", "caption");
    inn.appendChild(cap);
    st.appendChild(inn);

    const GR = 4, GC = 4;
    const X = 46, Y = 6, W = 408, H = 204;      // map box inside the canvas
    // state: data-order chunk coords + which axes to glow + axis under key-hover
    const S = { t: HERO.t, latC: HERO.latC, lonC: HERO.lonC, glow: new Set([0,1,2]), hlAx: null };
    const segs = side.querySelectorAll(".seg");
    const kw = side.querySelector("#kw");
    function draw(){
      const { c } = setupCanvas(cv);
      paintFace(c, X, Y, W, H, { grid: [GR, GC] });
      const dispR = GR - 1 - S.latC, dispC = S.lonC;
      const tw = W/GC, th = H/GR;
      if (S.hlAx === 1){                          // whole latitude band
        c.fillStyle = "rgba(184,134,11,.28)";
        c.fillRect(X, Y + dispR*th, W, th);
      } else if (S.hlAx === 2){                   // whole longitude band
        c.fillStyle = "rgba(184,134,11,.28)";
        c.fillRect(X + dispC*tw, Y, tw, H);
      }
      c.fillStyle = "rgba(184,134,11,.38)";
      c.fillRect(X + dispC*tw, Y + dispR*th, tw, th);
      c.strokeStyle = "#b8860b"; c.lineWidth = 2;
      c.strokeRect(X + dispC*tw, Y + dispR*th, tw, th);
      /* --- the axes, annotated: where the numbers come from --- */
      c.font = "600 11px 'SF Mono', Menlo, monospace";
      for (let b = 0; b < GR; b++){               // latitude bands: 0 at the SOUTH edge
        const dr = GR - 1 - b;
        c.fillStyle = b === S.latC ? "#7a5807" : "#a89e8a";
        c.fillText(String(b), X - 14, Y + dr*th + th/2 + 4);
      }
      for (let b = 0; b < GC; b++){               // longitude blocks: 0 at the WEST edge
        c.fillStyle = b === S.lonC ? "#7a5807" : "#a89e8a";
        c.fillText(String(b), X + b*tw + tw/2 - 3, Y + H + 15);
      }
      c.font = "10.5px Georgia, serif"; c.fillStyle = "#a89e8a";
      c.save();                                    // lat arrow, along the left edge
      c.translate(X - 30, Y + H/2);
      c.rotate(-Math.PI/2);
      const latNote = "lat — counted from the south →";
      c.fillText(latNote, -c.measureText(latNote).width/2, 4);
      c.restore();
      const lonNote = "lon — counted from the west, west → east";
      c.fillText(lonNote, X + W - c.measureText(lonNote).width, Y + H + 30);
    }
    function render(){
      const vals = [S.t, S.latC, S.lonC];
      segs.forEach((sg, i) => {
        sg.textContent = vals[i];
        sg.classList.toggle("glow", S.glow.has(i));
      });
      const MONF = ["January","February","March","April","May","June","July",
                    "August","September","October","November","December"];
      kw.innerHTML =
        `<span class="ax ${S.glow.has(0) ? "glow" : ""}">time slab <b>${S.t}</b> — ${MONF[S.t]}</span> · ` +
        `<span class="ax ${S.glow.has(1) ? "glow" : ""}">latitude band <b>${S.latC}</b> — counted from the south edge</span> · ` +
        `<span class="ax ${S.glow.has(2) ? "glow" : ""}">longitude block <b>${S.lonC}</b> — counted from the west edge</span>`;
      strip.querySelectorAll("i").forEach((b, i) => {
        b.classList.toggle("on", i === S.t);
        b.classList.toggle("band", S.hlAx === 0);
      });
      draw();
    }
    // hover the map -> BOTH the lat and lon segments glow (the map fixes both
    // coordinates); the months strip stays fully opaque
    cv.addEventListener("mousemove", ev => {
      const r = cv.getBoundingClientRect();
      const fx = clamp((ev.clientX - r.left - X) / W, 0, .999);
      const fy = clamp((ev.clientY - r.top - Y) / H, 0, .999);
      const dispC = Math.floor(fx * GC), dispR = Math.floor(fy * GR);
      const latC = GR - 1 - dispR, lonC = dispC;
      if (latC !== S.latC || lonC !== S.lonC ||
          !(S.glow.size === 2 && S.glow.has(1) && S.glow.has(2))){
        S.glow = new Set([1, 2]); S.latC = latC; S.lonC = lonC; render();
      }
    });
    /* hovering the strip still dims the map (the month is the focus there) */
    stripWrap.addEventListener("mouseenter", () => cv.classList.add("dim"));
    stripWrap.addEventListener("mouseleave", () => cv.classList.remove("dim"));
    // hover the month strip -> time segment updates
    strip.querySelectorAll("i").forEach(b => {
      b.addEventListener("mouseenter", () => {
        S.t = +b.dataset.t; S.glow = new Set([0]); render();
      });
    });
    // bidirectional: hover a key segment -> its axis lights up on the visuals
    segs.forEach(sg => {
      sg.addEventListener("mouseenter", () => {
        const ax = +sg.dataset.ax;
        S.hlAx = ax; S.glow = new Set([ax]); render();
      });
      sg.addEventListener("mouseleave", () => { S.hlAx = null; render(); });
    });
    render();
    const t = await loadTree(MUR).catch(() => DEMO_TREES[MUR]);
    if (!st.isConnected) return;
    const a = arrOf(t, "analysed_sst");
    cap.innerHTML = `NASA's full-size store works the same — ` +
      `${fmtN(a.chunk_grid[0])} × ${a.chunk_grid[1]} × ${a.chunk_grid[2]} positions = ` +
      `<b>${fmtN(a.n_chunks)}</b> file names, all computed · a reader computes these names ` +
      `and simply fetches those files — <b>no index, no lookup service</b>`;
  }
});

    for (const f of ls.files) sz[f.path] = f.bytes;
    const S = f => sz[f] != null ? fmtB(sz[f]) : "";
    const nChunks = ls.files.filter(f => /^analysed_sst\/c\//.test(f.path)).length || 192;
    const sstBytes = ls.files.filter(f => f.path.startsWith("analysed_sst/"))
                       .reduce((x, f) => x + f.bytes, 0) || 4840000;

    /* the two zarr.json documents, parsed for the plain-words cards */
    let rootDoc = {}, arrDoc = {};
    try { rootDoc = JSON.parse(meta.root["zarr.json"] || "{}"); } catch(e){}
    try { arrDoc = JSON.parse(meta.arr["analysed_sst/zarr.json"] || "{}"); } catch(e){}
    const aShape = arrDoc.shape || [12, 360, 720];
    const aChunk = ((arrDoc.chunk_grid || {}).configuration || {}).chunk_shape || [1, 90, 180];
    const aType  = arrDoc.data_type || "float32";
    const aCodec = (arrDoc.codecs || []).map(c => c.name).filter(n => n && n !== "bytes")
                     .join(", ") || "zstd";
    const aUnits = ((arrDoc.attributes || {}).units) || "kelvin";
    const heroKey = `c/${HERO.t}/${HERO.latC}/${HERO.lonC}`;

    const rows = [
      ["dir",   "📁 mur_sst_mini.zarr/", "", null],
      ["meta",  "├─ zarr.json", S("zarr.json"), "rootmeta"],
      ["dir",   "├─ 📁 analysed_sst/", `${nChunks} chunk files · ${fmtB(sstBytes)}`, null],
      ["meta",  "│&nbsp;&nbsp;&nbsp;├─ zarr.json", S("analysed_sst/zarr.json"), "arrmeta"],
      ["chunk", "│&nbsp;&nbsp;&nbsp;├─ c/0/0/0", S("analysed_sst/c/0/0/0"), "chunk:0/0/0"],
      ["chunk", "│&nbsp;&nbsp;&nbsp;├─ c/0/0/1", S("analysed_sst/c/0/0/1"), "chunk:0/0/1"],
      ["chunk", `│&nbsp;&nbsp;&nbsp;├─ ${heroKey}`, S(`analysed_sst/${heroKey}`), `chunk:${HERO.t}/${HERO.latC}/${HERO.lonC}`],
      ["dim",   `│&nbsp;&nbsp;&nbsp;├─ … ${nChunks - 4} more, one per block`, "", null],
      ["chunk", "│&nbsp;&nbsp;&nbsp;└─ c/11/3/3", S("analysed_sst/c/11/3/3"), "chunk:11/3/3"],
      ["coord", "├─ 📁 lat/&nbsp;&nbsp; (zarr.json · c/0)", S("lat/c/0"), "coord:lat"],
      ["coord", "├─ 📁 lon/&nbsp;&nbsp; (zarr.json · c/0)", S("lon/c/0"), "coord:lon"],
      ["coord", "└─ 📁 time/ (zarr.json · c/0)", S("time/c/0"), "coord:time"],
    ];
    tree.innerHTML = "";
    for (const [kind, label, size, pk] of rows){
      const d = el("div", "tn" + (pk ? " hov" : ""),
        label + (size ? ` &nbsp;<span class="sz">${size}</span>` : ""));
      if (pk) d.dataset.pk = pk;
      tree.appendChild(d);
    }

    /* plain-words ID card + a "see the actual file" toggle to the raw JSON */
    function idCard(host, cardRows, rawObj){
      const wrap = el("div");
      wrap.style.cssText = "display:flex; flex-direction:column; gap:5px;";
      cardRows.forEach(([k, v]) => wrap.appendChild(el("div", "idrow",
        `<span class="idk">${esc(k)}</span><span class="idv">${v}</span>`)));
      const tog = el("button", "rawtoggle", "see the actual file →");
      const pre = el("pre", "rawpre");
      pre.style.display = "none";
      pre.textContent = JSON.stringify(rawObj, null, 1);
      tog.onclick = () => {
        const showRaw = pre.style.display === "none";
        pre.style.display = showRaw ? "block" : "none";
        wrap.querySelectorAll(".idrow").forEach(r =>
          r.style.display = showRaw ? "none" : "flex");
        tog.textContent = showRaw ? "← back to plain words" : "see the actual file →";
      };
      wrap.appendChild(tog);
      wrap.appendChild(pre);
      host.appendChild(wrap);
    }
    function miniGrid(t, latC, lonC, isolate){
      const cv2 = planeCanvas(288, 144);
      setTimeout(() => {
        const { c } = setupCanvas(cv2);
        paintFace(c, 2, 2, 284, 140, { grid: [4, 4] });
        const tw = 284/4, th = 140/4, dr = 3 - latC;
        const cx = 2 + lonC*tw, cy = 2 + dr*th;
        if (isolate){
          /* grey out the ENTIRE map except this chunk's cell */
          c.fillStyle = "rgba(246,242,233,.85)";
          c.fillRect(2, 2, 284, cy - 2);                        // above
          c.fillRect(2, cy + th, 284, 142 - (cy + th));         // below
          c.fillRect(2, cy, cx - 2, th);                        // left
          c.fillRect(cx + tw, cy, 286 - (cx + tw), th);         // right
        } else {
          c.fillStyle = "rgba(184,134,11,.4)";
          c.fillRect(cx, cy, tw, th);
        }
        c.strokeStyle = "#b8860b"; c.lineWidth = 2;
        c.strokeRect(cx, cy, tw, th);
      }, 0);
      return cv2;
    }
    function showPreview(pk){
      prev.innerHTML = "";
      if (!pk){
        prev.appendChild(el("div", "ph", "preview"));
        prev.appendChild(el("div", "pt", "Hover any file on the left"));
        prev.appendChild(el("div", "pb",
          "Everything Zarr knows lives in these files — one small text file per folder " +
          "(<span class='mono'>zarr.json</span>), and one small data file per chunk. " +
          "That's the entire format."));
        return;
      }
      if (pk === "rootmeta"){
        prev.appendChild(el("div", "ph", `zarr.json · ${S("zarr.json")} of plain text`));
        prev.appendChild(el("div", "pt", "The store's ID card"));
        idCard(prev, [
          ["holds", "one data array — <b>analysed_sst</b> (plus its 3 axis rulers)"],
          ["shape", `${aShape[0]} months × ${aShape[1]} × ${aShape[2]} cells`],
          ["cut into", `chunks of ${aChunk[0]} × ${aChunk[1]} × ${aChunk[2]} — ${nChunks} files`],
          ["each number", `${aType}, 4 bytes`],
        ], {
          zarr_format: 3, node_type: "group",
          attributes: (rootDoc.attributes || {}),
          consolidated_metadata: "…a copy of every array's zarr.json, inlined…",
        });
        prev.appendChild(el("div", "pb",
          "<b>Read this one file and you know where every number lives</b> — it even " +
          "carries a copy of each array's own card, so one read opens the whole store."));
        return;
      }
      if (pk === "arrmeta"){
        prev.appendChild(el("div", "ph", `analysed_sst/zarr.json · ${S("analysed_sst/zarr.json")}`));
        prev.appendChild(el("div", "pt", "The array's own ID card"));
        idCard(prev, [
          ["shape", `${aShape[0]} months × ${aShape[1]} × ${aShape[2]} cells`],
          ["cut into", `chunks of ${aChunk[0]} × ${aChunk[1]} × ${aChunk[2]} cells`],
          ["each number", `${aType}, 4 bytes — a temperature in ${esc(aUnits)}`],
          ["squeezed with", `${esc(aCodec)} (like zipping — smaller files, same numbers)`],
        ], {
          shape: aShape, data_type: aType,
          chunk_grid: arrDoc.chunk_grid || { configuration: { chunk_shape: aChunk } },
          chunk_key_encoding: arrDoc.chunk_key_encoding || { configuration: { separator: "/" } },
          fill_value: arrDoc.fill_value ?? "NaN",
          codecs: (arrDoc.codecs || []).map(c => c.name),
          dimension_names: arrDoc.dimension_names || ["time","lat","lon"],
        });
        return;
      }
      if (pk.startsWith("chunk:")){
        const key = pk.slice(6);
        const [t, latC, lonC] = key.split("/").map(Number);
        const bytes = sz["analysed_sst/c/" + key];
        prev.appendChild(el("div", "ph", `analysed_sst/c/${key} · ${bytes ? fmtB(bytes) : "~24 KB"}`));
        prev.appendChild(el("div", "pt", "One chunk — a little file of squeezed numbers"));
        prev.appendChild(miniGrid(t, latC, lonC, true));
        prev.appendChild(el("div", "pb",
          `everything greyed out is <b>other files</b> — this file holds only the lit cell: ` +
          `month <b>${t}</b>, band <b>${latC}</b> up from the south, block <b>${lonC}</b> across`));
        return;
      }
      if (pk.startsWith("coord:")){
        const which = pk.slice(6);
        const what = { lat: ["the 360 real latitudes", "−89.75° … 89.75°"],
                       lon: ["the 720 real longitudes", "−179.75° … 179.75°"],
                       time: ["the 12 real dates", "Jan 2022 … Dec 2022"] }[which];
        prev.appendChild(el("div", "ph", `${which}/ · ${S(which + "/c/0")}`));
        prev.appendChild(el("div", "pt", "A ruler for one axis"));
        prev.appendChild(el("div", "pb",
          `A tiny one-dimensional array holding ${what[0]} (${what[1]}). ` +
          `These “coordinate arrays” are how a reader turns <b>row 213</b> into ` +
          `<b>16.75°N</b> — they're just more Zarr arrays, stored the same way.`));
        return;
      }
    }
    showPreview(null);
    tree.querySelectorAll(".tn.hov").forEach(d => {
      d.addEventListener("mouseenter", () => {
        tree.querySelectorAll(".tn").forEach(x => {
          x.classList.remove("lit");
          x.classList.toggle("dim", x !== d && x.classList.contains("hov"));
        });
        d.classList.add("lit");
        showPreview(d.dataset.pk);
      });
    });
    tree.addEventListener("mouseleave", () => {
      tree.querySelectorAll(".tn").forEach(x => x.classList.remove("dim"));
    });
    cap.innerHTML = `the store's <b>real ${fmtN(ls.n_files)} files (${fmtB(ls.total_bytes)})</b>, ` +
      `listed just now — NASA's cloud store has the same layout, with 141,790 chunk files`;
  }
});

/* ---- 5 · reading data: chunks in practice — one arc, beat-gated ------------
   Merged from the old "Reading just the chunks you need" + "Chunks in
   practice": one lesson, four beats, ONE live cold read from NASA's S3.
   Beat 0 the ask · beat 1 the computed name · beat 2 the live read (blue
   chunk + measured bars + the arrived patch) · beat 3 the CMIP6 comparison. */
step({
  act: 2,
  title: "Reading data: chunks in practice",   // title TBD — Max may rename
  copy: "Time to actually read something — <b>one day of sea temperature around " +
        "Italy</b>, straight from NASA's full-size store. Step through what a " +
        "reader really does:",
  async mount(st){
    const inn = el("div", "stage-in fadein");
    const row = el("div");
    row.style.cssText = "display:flex; gap:18px; align-items:center;";
    const cube = planeCanvas(372, 400);
    row.appendChild(cube);
    const right = el("div");
    right.style.cssText = "display:flex; flex-direction:column; gap:12px; width:420px; flex:none;";
    /* beat 1 — the ONE computed file name */
    const keyWrap = el("div");
    keyWrap.style.cssText = "display:none; flex-direction:column; gap:4px;";
    keyWrap.innerHTML = `
      <div class="keylab">the file that holds it</div>
      <div class="bigkey" style="font-size:18px"></div>`;
    right.appendChild(keyWrap);
    /* beat 2 — the PINNED download panel + the arrived patch beside it */
    const panelRow = el("div");
    panelRow.style.cssText = "display:none; gap:6px; align-items:flex-start;";
    const panel = el("div", "dlpanel");
    panel.innerHTML = `
      <div class="dlh">live · one chunk from NASA's S3</div>
      <canvas class="cube" data-w="270" data-h="54" style="width:270px;height:54px"></canvas>
      <div class="pbar"><i></i></div>
      <div class="dlstat">waiting…</div>`;
    panelRow.appendChild(panel);
    const patchWrap = el("div");
    patchWrap.style.cssText = "display:none; flex-direction:column; gap:4px; " +
      "align-items:center; width:110px; flex:none;";
    const patch = planeCanvas(110, 68);
    patchWrap.appendChild(patch);
    const patchCap = el("div", "caption", "the seas around Italy —<br>real 1-km data");
    patchCap.style.cssText = "font-size:10.5px; line-height:1.35;";
    patchWrap.appendChild(patchCap);
    panelRow.appendChild(patchWrap);
    right.appendChild(panelRow);
    /* the measured bars — rows accumulate per beat */
    const cmpEl = el("div", "cmp");
    right.appendChild(cmpEl);
    const beatBtn = el("button", "small primary", "1 · compute the file's name →");
    const btnwrap = el("div"); btnwrap.style.cssText = "display:flex; justify-content:center;";
    btnwrap.appendChild(beatBtn);
    right.appendChild(btnwrap);
    row.appendChild(right);
    inn.appendChild(row);
    const cap = el("div", "caption");
    inn.appendChild(cap);
    st.appendChild(inn);

    const asked = (READ.r1-READ.r0)*(READ.c1-READ.c0)*2;   // 2.24 MB of int16
    const cmipBytes = 80221890;
    const max = cmipBytes;

    /* --- the datacube: a pixelated box for what traveled, with your sliver inside --- */
    function drawBox(c, x, y, w, h, d, stroke, fill){
      // x,y = front-bottom-left; depth goes up-right
      const dx = d * .85, dy = -d * .55;
      c.fillStyle = fill;
      c.beginPath();                                     // front face
      c.rect(x, y - h, w, h); c.fill();
      c.beginPath();                                     // top face
      c.moveTo(x, y - h); c.lineTo(x + dx, y - h + dy);
      c.lineTo(x + w + dx, y - h + dy); c.lineTo(x + w, y - h);
      c.closePath(); c.fill();
      c.beginPath();                                     // right face
      c.moveTo(x + w, y - h); c.lineTo(x + w + dx, y - h + dy);
      c.lineTo(x + w + dx, y + dy); c.lineTo(x + w, y);
      c.closePath(); c.fill();
      c.strokeStyle = stroke; c.lineWidth = 1.6;
      c.strokeRect(x, y - h, w, h);
      c.beginPath();
      c.moveTo(x, y - h); c.lineTo(x + dx, y - h + dy);
      c.lineTo(x + w + dx, y - h + dy); c.lineTo(x + w, y - h);
      c.moveTo(x + w + dx, y - h + dy); c.lineTo(x + w + dx, y + dy);
      c.lineTo(x + w, y);
      c.stroke();
      // dithered texture on the front face (the house pixel style)
      c.fillStyle = stroke;
      c.globalAlpha = .18;
      for (let yy = y - h + 3; yy < y - 2; yy += 5)
        for (let xx = x + 3 + ((yy | 0) % 2) * 2; xx < x + w - 2; xx += 5)
          c.fillRect(xx, yy, 1.6, 1.6);
      c.globalAlpha = 1;
    }
    /* ONE stable scene across all three beats — nothing morphs or re-lays-out.
       The store box never changes; beat 2 ADDS the blue MUR chunk; beat 3 ADDS
       the CMIP6 chunk while the blue one stays. Size ordering reads instantly:
       store ≫ CMIP6 chunk ≫ MUR chunk ≫ your gold ask (not to scale). */
    const SCENE = {
      store: { x: 30, y: 316, w: 300, h: 212, d: 42 },
      cmip:  { x: 76, y: 296, w: 176, h: 106, d: 22 },
      mur:   { x: 108, y: 274, w: 66, h: 30, d: 8 },
      ask:   { x: 120, y: 264, w: 14, h: 7, d: 2 },
    };
    /* cubePhase: 0 = store + gold ask · 1 = + the blue MUR chunk (only after
       the read ARRIVES) · 2 = + the pink CMIP6 chunk (blue stays) */
    function drawCube(phase, murBytes){
      const { c } = setupCanvas(cube);
      const B = SCENE;
      drawBox(c, B.store.x, B.store.y, B.store.w, B.store.h, B.store.d,
              "rgba(90,75,40,.30)", "rgba(90,75,40,.03)");
      if (phase >= 2)
        drawBox(c, B.cmip.x, B.cmip.y, B.cmip.w, B.cmip.h, B.cmip.d,
                "#c9366b", "rgba(201,54,107,.08)");
      if (phase >= 1)
        drawBox(c, B.mur.x, B.mur.y, B.mur.w, B.mur.h, B.mur.d,
                "#1f8fb8", "rgba(31,143,184,.14)");
      drawBox(c, B.ask.x, B.ask.y, B.ask.w, B.ask.h, B.ask.d,
              "#b8860b", "rgba(245,227,175,.95)");
      /* fixed legend — lines appear per phase, never move */
      c.font = "10.5px Georgia, serif"; c.fillStyle = "#a89e8a";
      c.fillText("the whole store — 8.3 TB", B.store.x, B.store.y - B.store.h - 32);
      c.font = "11px Georgia, serif";
      c.fillStyle = "#7a5807";
      c.fillText("■ your ask — one sea, one day thin (2.2 MB)", 30, 344);
      if (phase >= 1){
        c.fillStyle = "#1f6f8f";
        c.fillText(`■ the chunk that traveled — ${fmtB(murBytes || 13384457)} (stays put)`, 30, 361);
      }
      if (phase >= 2){
        c.fillStyle = "#a52c56";
        c.fillText("■ one CMIP6 chunk — 80 MB, same ask", 30, 378);
      }
      c.fillStyle = "#a89e8a"; c.font = "10px Georgia, serif";
      c.fillText("not to scale", 322, 396);
    }
    function addBar(lb, v, color, note){
      const rowEl = el("div", "row fadein");
      rowEl.innerHTML = `<div class="lb">${lb}</div>
        <div class="tr"><i style="background:${color};width:${Math.max(0.7, v/max*100)}%"></i></div>
        <div class="val">${fmtB(v)}</div>`;
      rowEl.querySelector(".tr").title = note;
      cmpEl.appendChild(rowEl);
    }

    /* the file name, computed live from the store's own metadata when we
       have it (the same arithmetic the daemon's read will do) */
    const keyPromise = (async () => {
      const t = await loadTree(MUR).catch(() => DEMO_TREES[MUR]);
      const a = arrOf(t, "analysed_sst");
      const ch = a.chunks || a.shape;
      const kc = [Math.floor(READ.t / ch[0]),
                  Math.floor(READ.r0 / ch[1]),
                  Math.floor(READ.c0 / ch[2])];
      return { key: chunkKey(a, kc), kc, ch };
    })();

    /* ---- the real S3 read (beat 2): pinned panel, always cold ---- */
    const pfill = panel.querySelector(".pbar i");
    const pstat = panel.querySelector(".dlstat");
    const pmap = panel.querySelector("canvas");
    function drawPanelMap(){
      const { c } = setupCanvas(pmap);
      paintFace(c, 2, 2, 104, 50, {});
      /* MUR chunk grid: 11 lat bands × 10 lon blocks; our chunk = (lat 7, lon 5) */
      c.strokeStyle = "rgba(90,75,40,.25)"; c.lineWidth = .5;
      for (let i = 1; i < 10; i++){ c.beginPath(); c.moveTo(2 + 104*i/10, 2); c.lineTo(2 + 104*i/10, 52); c.stroke(); }
      for (let i = 1; i < 11; i++){ c.beginPath(); c.moveTo(2, 2 + 50*i/11); c.lineTo(106, 2 + 50*i/11); c.stroke(); }
      const dr = 10 - 7, tw = 104/10, th = 50/11;      // lat counted from the south
      c.fillStyle = "rgba(31,143,184,.75)";
      c.fillRect(2 + 5*tw, 2 + dr*th, tw, th);
      c.font = "10.5px Georgia, serif"; c.fillStyle = "#7b7260";
      c.fillText("← the ONE chunk file", 116, 22);
      c.fillText("out of 141,790", 116, 36);
    }
    function drawPatch(res){
      const img = sliceImage(res, THERMAL, true);
      if (!img) return;
      const { c } = setupCanvas(patch);
      c.fillStyle = "#eee7d4"; c.fillRect(0, 0, 110, 68);
      c.imageSmoothingEnabled = true;
      c.drawImage(img, 0, 0, 110, 68);
      c.strokeStyle = "#b8860b"; c.lineWidth = 2;
      c.strokeRect(1, 1, 108, 66);
    }
    const EXPECT = 13.4e6;                          // a cold Mediterranean chunk
    async function runReal(theKey){
      panel.parentElement.style.display = "flex";   // panelRow
      drawPanelMap();
      pfill.style.width = "0%";
      const t0 = performance.now();
      pstat.innerHTML = S3_LIVE
        ? `clearing every cache first — this read is <b>always cold</b>, ` +
          `the wait is the honest cost`
        : `here the numbers are the ones this read really moved (live in the ` +
          `desktop app / a Fused UDF) — this page can't reach S3 directly`;
      /* make it genuinely cold: the daemon forgets the store entirely.
         then reopen it once (via /stats) BEFORE racing /slice against the
         poller — otherwise two concurrent opens can split the meter.
         Only the local app has the daemon; hosted/standalone play the
         measured cost back at a canned pace. */
      if (S3_LIVE){
        try {
          await api(`/clearcache?file=${encodeURIComponent(MUR)}`);
          await api(`/stats?file=${encodeURIComponent(MUR)}`);
        } catch(e){}
      }
      let poll = null, seen = 0;
      if (S3_LIVE){
        poll = setInterval(async () => {
          try {
            const sres = await api(`/stats?file=${encodeURIComponent(MUR)}`);
            /* inflight = bytes of the object currently arriving, live */
            seen = Math.max(seen, sres.net_bytes + (sres.inflight || 0));
            pfill.style.width = clamp(seen / EXPECT * 100, 1.5, 99) + "%";
            pstat.innerHTML = `<span class="sz">${fmtB(seen)}</span> of ~13.4 MB · ` +
              `${((performance.now() - t0)/1000).toFixed(1)} s — one whole chunk must arrive`;
          } catch(e){}
        }, 300);
      } else {
        poll = setInterval(() => {
          const p = clamp((performance.now() - t0) / 2500, 0, .99);
          pfill.style.width = (p * 100) + "%";
          pstat.innerHTML = `<span class="sz">${fmtB(EXPECT * p)}</span> of ~13.4 MB · ` +
            `${((performance.now() - t0)/1000).toFixed(1)} s (played back at a canned pace)`;
        }, 200);
      }
      let r2;
      try {
        r2 = S3_LIVE
          ? await api(`/slice?file=${encodeURIComponent(MUR)}&var=analysed_sst&plane=1,2` +
                      `&idx=${READ.t},0,0&r0=${READ.r0}&r1=${READ.r1}&c0=${READ.c0}&c1=${READ.c1}`)
          : (await sleep(2500), demoSliceMURMed());
      } catch(e){
        clearInterval(poll);
        pstat.innerHTML = `<span style="color:var(--miss)">${esc(e.message)}</span>`;
        throw e;
      }
      clearInterval(poll);
      if (!st.isConnected) return null;
      bump(r2.cost, "NASA store: Mediterranean, 1 day");
      recordTouches(r2.touched, "mur");
      pfill.style.width = "100%";
      pstat.innerHTML = `<span class="sz">${fmtB(r2.cost.net_bytes)}</span> in ` +
        `<b>${(r2.cost.ms/1000).toFixed(1)} s</b> — the file ` +
        `<span class="z mono" style="font-size:10px">${esc(theKey)}</span>` +
        (!S3_LIVE ? " (canned copy)" : "");
      return r2;
    }

    /* ---- the four beats, strictly gated ---- */
    let beat = 0, busy = false;
    let lastGot = 13384457;   // the measured chunk size, for beat 3's redraw
    /* beat 0 — on entry: the store, the gold ask, the asked bar */
    drawCube(0);
    addBar(`you want<br><b>one day, one sea</b>`, asked, "#b8860b",
           "what you asked for (raw numbers)");
    cap.innerHTML = `you want <b>one day of sea temperature around Italy</b> — ` +
      `a <b>2.2 MB</b> sliver of an 8.3 TB store`;
    async function nextBeat(){
      if (busy) return; busy = true;
      beatBtn.disabled = true;
      if (beat === 0){
        /* beat 1 — the ONE computed name appears */
        const { key, kc } = await keyPromise;
        if (!st.isConnected) return;
        keyWrap.style.display = "flex";
        keyWrap.classList.add("fadein");
        keyWrap.querySelector(".bigkey").innerHTML =
          `<span class="pre">analysed_sst/</span><span class="seg glow">${kc[0]}</span>` +
          `<span class="pre">.</span><span class="seg glow">${kc[1]}</span>` +

          `<b>${kc[0]}</b> · lat band <b>${kc[1]}</b> · lon block <b>${kc[2]}</b> — ` +
          `<b>computed from the position, not looked up</b>`;
        beatBtn.textContent = "2 · ask NASA's store for that file →";
        beat = 1;
      } else if (beat === 1){
        /* beat 2 — the live read, front and center; the wait IS the lesson */
        const { key } = await keyPromise;
        beatBtn.textContent = "fetching — one whole chunk must arrive…";
        cap.innerHTML = `asking NASA's store on S3 for that one file — nothing else`;
        let r2 = null;
        try { r2 = await runReal(key); }
        catch(e){ busy = false; beatBtn.disabled = false;
                  beatBtn.textContent = "2 · ask NASA's store for that file →"; return; }
        if (!st.isConnected || !r2) return;
        const got = r2.cost.net_bytes > 0 ? r2.cost.net_bytes : 13384457;
        lastGot = got;
        drawCube(1, got);
        addBar(`the store sent<br><b>one whole chunk</b>`, got, "#1f8fb8",
               r2.cost.net_bytes > 0 ? "measured just now" : "served by the local cache; cold it's ~13.4 MB");
        patchWrap.style.display = "flex";
        patchWrap.classList.add("fadein");
        drawPatch(r2);
        const toC = k => (k - 273.15).toFixed(1);
        cap.innerHTML = `storage hands out <b>whole files</b>: your 2.2 MB ask arrived as a ` +
          `<b>${fmtB(got)}</b> 5-day chunk — with 1.1 million real temperatures, ` +
          `<b>${toC(r2.vmin)} – ${toC(r2.vmax)} °C</b> · NASA's older store spells names ` +
          `with dots — same idea`;
        beatBtn.textContent = "3 · and a store built for centuries, not days? →";
        beat = 2;
      } else if (beat === 2){
        /* beat 3 — the CMIP6 comparison; the blue chunk stays put */
        drawCube(2, lastGot);
        addBar(`a climate store<br><b>would have sent</b>`, cmipBytes, "#c9366b",
               "CMIP6 world-climate archive (canned object size, measured 2026-07-20)");
        cap.innerHTML = `CMIP6 packed <b>50 years per chunk</b> — touch one month, receive 80 MB · ` +
          `<b>chunk size is a promise about how the data will be read</b>`;
        beatBtn.style.display = "none";
        beat = 3;
      }
      busy = false;
      beatBtn.disabled = false;
    }
    beatBtn.onclick = nextBeat;

/* ---- 6 · sharding — the 16 familiar tiles pack into one file -------------- */
step({
  act: 2,
  title: "Sharding",
  copy: "Small chunks read cheap, but a big dataset becomes <b>millions of tiny files</b>. " +
        "A <b>shard</b> is one bigger file that packs many chunks side by side, with a tiny " +
        "index at the end recording where each chunk sits.",
  async mount(st){
    const inn = el("div", "stage-in fadein");
    const cv = planeCanvas(760, 330);
    cv.style.cursor = "crosshair";
    inn.appendChild(cv);
    const idxLine = el("div", "caption");
    idxLine.style.minHeight = "20px";
    inn.appendChild(idxLine);
    const btnwrap = el("div"); btnwrap.style.cssText = "display:flex; justify-content:center;";
    const bundleBtn = el("button", "small primary", "Pack them into one shard file →");
    btnwrap.appendChild(bundleBtn);
    inn.appendChild(btnwrap);
    const cap = el("div", "caption",
      "the <b>same 16 files</b> from the chunking step — now imagine NASA's 141,790, " +
      "or a store with 141 <i>million</i>");
    inn.appendChild(cap);
    st.appendChild(inn);

    /* the 16 July tiles, with their REAL on-disk sizes when available */
    const FALLBACK = { "0/0":20408,"0/1":17149,"0/2":16035,"0/3":18332,
      "1/0":43926,"1/1":32914,"1/2":37261,"1/3":36439,"2/0":36742,"2/1":33286,
      "2/2":15126,"2/3":31232,"3/0":14613,"3/1":23606,"3/2":15377,"3/3":11504 };
    let szOf = k => FALLBACK[k];
    try {
      const ls = await loadLs();
      const m = {};
      for (const f of ls.files) m[f.path] = f.bytes;
      if (m[`analysed_sst/c/${MOCK_T}/2/3`]) szOf = k => m[`analysed_sst/c/${MOCK_T}/` + k] || FALLBACK[k];
    } catch(e){}
    if (!st.isConnected) return;
    const face = worldFace();
    const T = [];                                   // display order, row by row
    for (let i = 0; i < 16; i++){
      const dispR = Math.floor(i/4), dispC = i%4;
      const latC = 3 - dispR, lonC = dispC;
      T.push({ dispR, dispC, latC, lonC, key: `c/${MOCK_T}/${latC}/${lonC}`,
               bytes: szOf(`${latC}/${lonC}`) || 24000,
               color: `hsl(${Math.round(i*360/16 + 12)} 40% 56%)` });
    }
    const offs = [0];
    T.forEach((t, i) => offs.push(offs[i] + t.bytes));
    const totalB = offs[16], idxB = 16 * 16;        // 16 bytes per index entry

    /* layout: ghost grid left · index table right · byte strip along the bottom */
    const GX = 34, GY = 18, TW = 86, TH = 43, GAP = 10;
    const tileRect = t => [GX + t.dispC*(TW+GAP), GY + t.dispR*(TH+GAP+13), TW, TH];
    const SX = 34, SY = 288, SW = 620, SH = 24;     // strip (data zone)
    const IW = 34;                                   // index tail on the strip
    const bandRect = i => [SX + offs[i]/totalB*SW, SY, T[i].bytes/totalB*SW, SH];
    const TXX = 428, TXY = 20, TRH = 13.4;           // index table (right)
    const rowRect = i => [TXX, TXY + 18 + i*TRH, 300, TRH];

    let phase = 0, anim = 0, hov = -1;               // hov = tile index or -1
    function drawTile(c, t, x, y, w, h, alpha, hot){
      c.globalAlpha = alpha;
      c.drawImage(face, t.dispC*45, t.dispR*22.5, 45, 22.5, x, y, w, h);
      c.globalAlpha = 1;
      c.strokeStyle = hot ? "#b8860b" : t.color;
      c.lineWidth = hot ? 2.2 : 1.4;
      c.strokeRect(x, y, w, h);
    }
    function draw(){
      if (!st.isConnected) return;
      const { c } = setupCanvas(cv);
      const packed = phase === 1 && anim >= 1;
      const dimAll = packed && hov >= 0;
      /* tiles / ghosts */
      for (let i = 0; i < 16; i++){
        const t = T[i];
        const [gx, gy, gw, gh] = tileRect(t);
        if (phase === 1 && anim < 1){
          // mid-flight: tile morphs toward its byte band
          const [bx, by, bw, bh] = bandRect(i);
          const q = anim;
          drawTile(c, t, gx + (bx-gx)*q, gy + (by-gy)*q, gw + (bw-gw)*q, gh + (bh-gh)*q, 1 - q*.4, false);
        } else {
          const ghost = packed;
          const hot = hov === i;
          const alpha = ghost ? (hot ? 1 : (dimAll ? .25 : .38)) : 1;
          drawTile(c, t, gx, gy, gw, gh, alpha, hot);
          c.font = "600 9px 'SF Mono', Menlo, monospace";
          c.fillStyle = hot ? "#7a5807" : (dimAll ? "rgba(168,158,138,.35)" : "#a89e8a");
          c.fillText(t.key, gx + 2, gy + gh + 10);
        }
      }
      if (!packed && phase === 0){
        c.font = "11px Georgia, serif"; c.fillStyle = "#7b7260";
        c.fillText("16 separate files on storage — every read = one round-trip each", GX, SY + 8);
        /* the idle right half earns its keep: why tiny files hurt */
        c.font = "600 13px Georgia, serif"; c.fillStyle = "#4d463a";
        c.fillText("why pack them at all?", TXX, TXY + 14);
        c.font = "12.5px Georgia, serif"; c.fillStyle = "#7b7260";
        ["This mini store: 16 tiles per month.",
         "NASA's real store: 141,790 files.",
         "A 10 m global store: 141 million files.",
         "",
         "Object storage lists, bills and throttles",
         "per file — millions of tiny files make",
         "copying and reading painfully slow."]
          .forEach((s, i) => c.fillText(s, TXX, TXY + 40 + i * 20));
      }
      if (packed){
        /* the shard file, seen as bytes */
        c.font = "11px Georgia, serif";
        c.fillStyle = dimAll ? "rgba(123,114,96,.4)" : "#7b7260";
        c.fillText(`one shard file · ${fmtB(totalB + idxB)} — the same bytes, in one file →`, SX, SY - 8);
        for (let i = 0; i < 16; i++){
          const [bx, by, bw, bh] = bandRect(i);
          const hot = hov === i;
          c.globalAlpha = dimAll && !hot ? .18 : 1;
          c.fillStyle = T[i].color;
          c.fillRect(bx, by, bw, bh);
          c.globalAlpha = 1;
          if (hot){ c.strokeStyle = "#b8860b"; c.lineWidth = 2.2; c.strokeRect(bx, by, bw, bh); }
          else { c.strokeStyle = "rgba(255,253,248,.7)"; c.lineWidth = 1; c.strokeRect(bx, by, bw, bh); }
        }
        // the index tail at the end of the file
        c.fillStyle = dimAll ? "rgba(245,227,175,.35)" : "#f5e3af";
        c.fillRect(SX + SW, SY, IW, SH);
        c.strokeStyle = "#b8860b"; c.lineWidth = 1.2;
        c.strokeRect(SX + SW, SY, IW, SH);
        c.font = "600 8.5px -apple-system, sans-serif";
        c.fillStyle = "#7a5807";
        c.fillText("index", SX + SW + 4, SY + 15);
        /* the index table — what those last bytes SAY */
        c.font = "600 10px 'SF Mono', Menlo, monospace";
        c.fillStyle = dimAll ? "rgba(122,88,7,.4)" : "#7a5807";
        c.fillText("the index (the file's last 256 bytes):", TXX, TXY + 8);
        c.font = "9.5px 'SF Mono', Menlo, monospace";
        for (let i = 0; i < 16; i++){
          const [rx, ry, rw, rh] = rowRect(i);
          const hot = hov === i;
          if (hot){ c.fillStyle = "rgba(245,227,175,.95)"; c.fillRect(rx - 3, ry - 1, rw, rh); }
          c.fillStyle = hot ? "#5a4106" : (dimAll ? "rgba(123,114,96,.3)" : "#8b8270");
          c.fillText(`${T[i].key}   starts at ${String(offs[i]).padStart(6, " ")}   ${fmtB(T[i].bytes)}`,
                     rx, ry + 9);
        }
        /* static connectors for the hovered chunk (nothing moves) */
        if (hov >= 0){
          const [gx, gy, gw, gh] = tileRect(T[hov]);
          const [bx, by, bw] = bandRect(hov);
          const [rx, ry] = rowRect(hov);
          c.strokeStyle = "rgba(184,134,11,.55)"; c.lineWidth = 1.3;
          c.beginPath(); c.moveTo(gx + gw/2, gy + gh + 12); c.lineTo(bx + bw/2, by); c.stroke();
          c.beginPath(); c.moveTo(rx - 3, ry + 6); c.lineTo(bx + bw, by + SH/2); c.stroke();
        }
      }
    }
    function hitTest(ev){
      const r = cv.getBoundingClientRect();
      const mx = ev.clientX - r.left, my = ev.clientY - r.top;
      /* containing-cell math over the WHOLE grid area — the gaps between
         tiles belong to their nearest tile, so hover never flickers */
      const cellW = TW + GAP, cellH = TH + GAP + 13;
      if (mx >= GX - GAP && mx < GX + 4*cellW && my >= GY - GAP && my < GY + 4*cellH){
        const col = clamp(Math.floor((mx - GX) / cellW), 0, 3);
        const rw2 = clamp(Math.floor((my - GY) / cellH), 0, 3);
        return rw2 * 4 + col;
      }
      if (phase === 1 && anim >= 1){
        /* the byte strip: continuous, resolve by byte offset */
        if (my >= SY - 6 && my <= SY + SH + 6 && mx >= SX && mx <= SX + SW + IW){
          const f = clamp((mx - SX) / SW, 0, .9999) * totalB;
          for (let i = 0; i < 16; i++) if (f < offs[i + 1]) return i;
          return 15;
        }
        /* the index table: contiguous rows, no dead zones */
        if (mx >= TXX - 6 && mx <= TXX + 300 && my >= TXY + 16 && my < TXY + 18 + 16*TRH)
          return clamp(Math.floor((my - (TXY + 18)) / TRH), 0, 15);
      }
      return -1;
    }
    cv.addEventListener("mousemove", ev => {
      const h = hitTest(ev);
      if (h === hov) return;
      hov = h;
      draw();
      if (phase === 1 && anim >= 1){
        idxLine.innerHTML = hov >= 0
          ? `the index says: <span class="z mono">${T[hov].key}</span> lives at bytes ` +
            `<b>${offs[hov].toLocaleString("en-US")} – ${(offs[hov] + T[hov].bytes - 1).toLocaleString("en-US")}</b> ` +
            `— a reader fetches <b>just that ${fmtB(T[hov].bytes)} sliver</b>`
          : "hover a tile, a colored band, or an index row — they're the same chunk three ways";
      } else if (hov >= 0){
        idxLine.innerHTML = `<span class="z mono">analysed_sst/${T[hov].key}</span> · ${fmtB(T[hov].bytes)}`;
      } else idxLine.innerHTML = "";
    });
    cv.addEventListener("mouseleave", () => { hov = -1; draw();
      if (phase === 1 && anim >= 1)
        idxLine.innerHTML = "hover a tile, a colored band, or an index row — they're the same chunk three ways";
    });
    bundleBtn.onclick = () => {
      if (phase === 1) return;
      phase = 1;
      bundleBtn.style.display = "none";
      const t0 = performance.now(), DUR = 900;
      const ease = q => 1 - Math.pow(1 - q, 3);
      const loop = now => {
        anim = ease(clamp((now - t0) / DUR, 0, 1));
        draw();
        if (anim < 1 && st.isConnected) requestAnimationFrame(loop);
        else {
          cap.innerHTML = `16 files became <b>1</b> — the index still lets a reader fetch ` +
            `only the byte range it needs`;
          idxLine.innerHTML = "hover a tile, a colored band, or an index row — they're the same chunk three ways";
        }
      };
      requestAnimationFrame(loop);
    };
    draw();
  }
});

      grid.appendChild(card);
      setTimeout(() => { if (st.isConnected) card.classList.add("in"); }, 150 + i * 220);
      return card;
    });
    /* the hover grammar: the card you're on stays, the rest fade */
    cardEls.forEach(card => {
      card.addEventListener("mouseenter", () => cardEls.forEach(x => {
        x.classList.toggle("dim", x !== card);
        x.classList.toggle("hot", x === card);

        x.classList.remove("dim"); x.classList.remove("hot");
      }));

/* ---- 10 · the receipt (FINAL step) — ledger + the session's chunks in a datacube ---- */
step({
  id: "receipt",
  act: 5,
  title: "Your data receipt",
  copy: "Step back: here's what your session actually cost. Every chunk you pulled " +
        "glows in the cube — <b>hover one</b> for its file.",
  mount(st){
    const inn = el("div", "stage-in fadein");
    const row = el("div");
    row.style.cssText = "display:flex; gap:26px; align-items:center; justify-content:center; width:100%;";
    const cv = planeCanvas(400, 396);
    row.appendChild(cv);
    const right = el("div");
    right.style.cssText = "display:flex; flex-direction:column; gap:9px; width:350px; align-items:flex-start;";
    row.appendChild(right);
    inn.appendChild(row);
    const hoverLine = el("div", "caption");
    inn.appendChild(hoverLine);
    st.appendChild(inn);

    /* ----- right side: the ledger ----- */
    const did = SES.log.length > 0;
    const totRow = el("div");
    totRow.style.cssText = "display:flex; align-items:center; gap:11px;";
    totRow.appendChild(pixIcon("receipt", 26));
    totRow.appendChild(el("div", "bigno", did ? fmtB(SES.bytes) : "0 B"));
    right.appendChild(totRow);
    right.appendChild(el("div", "caption",
      !did
        ? `traveled the internet — everything so far ran on the local mini twin, free`
        : SES.bytes === 0
        ? `traveled — your real read was served by the local cache; cold it's ~13.4 MB`
        : `traveled the internet, in <b>${SES.reqs}</b> request${SES.reqs === 1 ? "" : "s"}`)
      ).style.textAlign = "left";
    if (SES.log.length){
      const tbl = el("div", "narr"); tbl.style.maxWidth = "350px";
      for (const L of SES.log)
        tbl.appendChild(el("div", "ln",
          `${esc(L.what)} — <span class="sz">${L.bytes ? fmtB(L.bytes) : "0 B (cache)"}</span>` +
          ` · ${L.reqs} req · ${(L.ms/1000).toFixed(1)} s`));
      if (SES.localReads)
        tbl.appendChild(el("div", "ln",
          `plus ${SES.localReads} local read${SES.localReads === 1 ? "" : "s"} — ` +
          `<span class="sz">free</span>`));
      right.appendChild(tbl);
    }
    const moved = SES.bytes || 13.4e6;
    const pct = moved / 8349664104000 * 100;
    const pctCap = el("div", "caption",
      `${SES.bytes ? "that's" : "even a full real read is"} <b>${pct.toFixed(5)}%</b> of the ` +
      `dataset — vs the brute-force plan's <b>~2.6 days</b>`);
    pctCap.style.textAlign = "left";
    right.appendChild(pctCap);

    /* ----- left side: the datacube of fetched chunks ----- */
    const cells = [...SES.touched.values()];
    const mockCells = cells.filter(c => c.store === "mock");
    const murCells  = cells.filter(c => c.store === "mur");
    /* iso helpers (matches the house style: flat diamonds, stacked slabs) */
    function slabPt(geo, r, c){          // r = display row, c = col, in grid units
      const ux = geo.ax/geo.gw, uy = geo.ay/geo.gw, vx = -geo.ax/geo.gh, vy = geo.ay/geo.gh;
      return { x: geo.cx + c*ux + r*vx - (ux*geo.gw + vx*geo.gh)/2,
               y: geo.y0 + c*uy + r*vy - (uy*geo.gw + vy*geo.gh)/2 };
    }
    const inQuad = (q, x, y) => {        // point-in-convex-quad via cross products
      let sgn = 0;
      for (let i = 0; i < 4; i++){
        const a = q[i], b = q[(i+1)%4];
        const cr = (b.x-a.x)*(y-a.y) - (b.y-a.y)*(x-a.x);
        if (!cr) continue;
        if (!sgn) sgn = Math.sign(cr);
        else if (Math.sign(cr) !== sgn) return false;
      }
      return true;
    };
    /* the mock cube: 12 ghost slabs; MUR: one ghost slab of its 11×10 grid */
    const MG = { gh: 4, gw: 4, ax: 96, ay: 48, cx: murCells.length ? 128 : 200, y0: 48, gap: 19 };
    const NG = { gh: 11, gw: 10, ax: 62, ay: 31, cx: 322, y0: 96, gap: 0 };
    let hot = null;                      // the hovered vibrant cell (its info object)
    const hits = [];                     // { quad, info } for every vibrant cell
    function cellQuad(geo, r, c, oy){
      return [slabPt(geo,r,c), slabPt(geo,r,c+1), slabPt(geo,r+1,c+1), slabPt(geo,r+1,c)]
        .map(p => ({ x: p.x, y: p.y + oy }));
    }
    function tracePoly(c2, q){
      c2.beginPath(); c2.moveTo(q[0].x, q[0].y);
      q.slice(1).forEach(p => c2.lineTo(p.x, p.y));
      c2.closePath();
    }
    function draw(){
      if (!st.isConnected) return;
      const { c } = setupCanvas(cv);
      hits.length = 0;
      const dimAll = !!hot;
      /* mock cube — slab 0 (January) on top, drawn bottom-up */
      for (let t = 11; t >= 0; t--){
        const oy = t * MG.gap;
        const full = [slabPt(MG,0,0), slabPt(MG,0,MG.gw), slabPt(MG,MG.gh,MG.gw), slabPt(MG,MG.gh,0)]
          .map(p => ({ x: p.x, y: p.y + oy }));
        c.globalAlpha = dimAll ? .35 : 1;
        tracePoly(c, full);
        c.fillStyle = "rgba(214,205,184,.15)"; c.fill();
        c.strokeStyle = "rgba(168,158,138,.45)"; c.lineWidth = 1; c.stroke();
        c.globalAlpha = 1;
        for (const cell of mockCells){
          if (cell.t !== t) continue;
          const q = cellQuad(MG, MG.gh - 1 - cell.lat, cell.lon, oy);
          const isHot = hot === cell;
          hits.push({ quad: q, info: cell });
          c.globalAlpha = dimAll && !isHot ? .15 : 1;
          tracePoly(c, q);
          c.fillStyle = isHot ? "#c4503a" : "#dd8b4e"; c.fill();
          c.strokeStyle = isHot ? "#b8860b" : "#c4503a";
          c.lineWidth = isHot ? 2 : 1; c.stroke();
          c.globalAlpha = 1;
        }
      }
      c.font = "11px Georgia, serif"; c.fillStyle = "#7b7260";
      const lbl1 = "the mini store — 12 months, stacked";
      c.fillText(lbl1, MG.cx - c.measureText(lbl1).width/2, MG.y0 + 11*MG.gap + MG.ay*2 + 22);
      /* NASA slab, only if a real read happened */
      if (murCells.length){
        const full = [slabPt(NG,0,0), slabPt(NG,0,NG.gw), slabPt(NG,NG.gh,NG.gw), slabPt(NG,NG.gh,0)];
        c.globalAlpha = dimAll ? .35 : 1;
        tracePoly(c, full);
        c.fillStyle = "rgba(214,205,184,.15)"; c.fill();
        c.strokeStyle = "rgba(168,158,138,.45)"; c.lineWidth = 1; c.stroke();
        c.globalAlpha = 1;
        for (const cell of murCells){
          const q = cellQuad(NG, NG.gh - 1 - cell.lat, cell.lon, 0);
          const isHot = hot === cell;
          hits.push({ quad: q, info: cell });
          c.globalAlpha = dimAll && !isHot ? .15 : 1;
          tracePoly(c, q);
          c.fillStyle = isHot ? "#c4503a" : "#dd8b4e"; c.fill();
          c.strokeStyle = isHot ? "#b8860b" : "#c4503a";
          c.lineWidth = isHot ? 2 : 1; c.stroke();
          c.globalAlpha = 1;
        }
        c.fillStyle = "#7b7260"; c.font = "11px Georgia, serif";
        const ts = [...new Set(murCells.map(x => x.t))];
        const lbl2 = "NASA's store — time slab" + (ts.length > 1 ? "s" : "");
        const lbl3 = `${ts.slice(0,3).join(", ")} of 1,289`;
        c.fillText(lbl2, NG.cx - c.measureText(lbl2).width/2, NG.y0 + NG.ay*2 + 20);
        c.fillText(lbl3, NG.cx - c.measureText(lbl3).width/2, NG.y0 + NG.ay*2 + 34);
      }
    }
    function defaultLine(){
      hoverLine.innerHTML = cells.length
        ? `<b>${cells.length}</b> chunk${cells.length === 1 ? "" : "s"} fetched, out of 141,982 — ` +
          `<b>hover a lit cell</b> for its file` +
          (SES.otherReads ? ` · playground reads on other stores aren't drawn` : ``)
        : `read something first — your pulls will light up here ` +
          `(the reading step, or the playground)`;
    }
    cv.style.cursor = "default";
    cv.addEventListener("mousemove", ev => {
      const r = cv.getBoundingClientRect();
      const mx = ev.clientX - r.left, my = ev.clientY - r.top;
      let found = null;
      for (let i = hits.length - 1; i >= 0; i--)
        if (inQuad(hits[i].quad, mx, my)){ found = hits[i].info; break; }
      if (found === hot) return;
      hot = found;
      draw();
      if (hot) hoverLine.innerHTML = `<span class="z mono">analysed_sst/${esc(hot.key.replace(/^analysed_sst\//, ""))}</span>` +
        ` · <span class="f">${hot.bytes ? fmtB(hot.bytes) : "size unknown"}</span> — ` +
        (hot.store === "mock" ? "local mini store" : "NASA's store on S3");
      else defaultLine();
    });
    cv.addEventListener("mouseleave", () => { if (hot){ hot = null; draw(); defaultLine(); } });
    defaultLine();
    draw();
  }
});

/* ================================================================
   the playground (step 9)
   ================================================================ */
function playground(){
  const root = el("div", "pg fadein");
  const L = el("div", "pgL"), R = el("div", "pgR");
  root.appendChild(L); root.appendChild(R);
  const inputRow = el("div"); inputRow.style.cssText = "display:flex; gap:6px;";
  const inp = el("input"); inp.type = "text"; inp.spellcheck = false;
  inp.placeholder = "s3://bucket/store.zarr · https://…/store.zarr · /local/path";
  const goB = el("button", "small primary", "Load");
  inputRow.appendChild(inp); inputRow.appendChild(goB);
  L.appendChild(inputRow);
  const chips = el("div", "chips");
  L.appendChild(chips);
  const sel = el("select");
  L.appendChild(sel);
  const dims = el("div", "dims");
  L.appendChild(dims);
  const est = el("div", "pgEst", "–");
  L.appendChild(est);
  const btnRow = el("div"); btnRow.style.cssText = "display:flex; gap:6px;";
  const readB = el("button", "small primary", "Read this slice");
  btnRow.appendChild(readB);
  L.appendChild(btnRow);
  const log = el("div", "pgNarr",
    S3_LIVE ? "pick a store and read something — the cube shows every chunk it touches"
    : MOCK_LIVE ? "the mini store reads live right here; the remote stores read live in the FusedRender desktop app"
    : "demo mode — only the canned mini store reads here");
  L.appendChild(log);
  const cwrap = el("div", "cwrap");
  const cv = el("canvas", "cube");
  cwrap.appendChild(cv);
  R.appendChild(cwrap);
  const legend = el("div", "caption",
    `<span class="z">selection</span> · <span class="f">fetched</span> · <span class="g">cache</span>` +
    ` — drag the gold bars to move the window · caps: 64 files / 4M numbers per read`);
  R.appendChild(legend);

  const PRESETS = [
    ["mini practice store · instant", MOCK],
    ["ocean temp · 3-D · 8.3 TB", MUR],
    ["forecast · 5-D · sharded", GEFS],
    ["climate run · 80 MB chunks", CMIP6],
    ["settlements · 92k chunks · 8 TB", WSF],
  ];
  const S = { file: null, tree: null, node: null, idx: [], win: [0,1,0,1],
              cells: new Map(), img: null, imgWin: null, reading: false };
  const planeOf = () => { const nd = S.node.shape.length; return [nd-2, nd-1]; };
  const say = html => { log.innerHTML = html; };

  function draw(){
    if (!S.node) return;
    const a = S.node, [d0, d1] = planeOf();
    const gh = gridOf(a, d0), gw = gridOf(a, d1);
    const depth = a.shape.length > 2 ? gridOf(a, 0) : 0;
    drawIso(cv, { gh, gw, slabs: Math.min(4, depth), cells: S.cells,
      maxW: 420,
      outline: [S.win[0]/a.shape[d0], S.win[1]/a.shape[d0],
                S.win[2]/a.shape[d1], S.win[3]/a.shape[d1]],
      img: S.img, imgWin: S.imgWin,
      labelU: `${a.dims[d1]} → ${fmtN(gw)} chunks`,
      labelV: `← ${a.dims[d0]} — ${fmtN(gh)} chunks`,
      labelD: depth ? `↓ ${a.dims[0]}` : null,
      note: gh*gw > 130*130 ? "grid too fine to draw 1:1 — fetched chunks get dots" : null });
  }

  function spanOf(d){
    const a = S.node, ch = a.chunks || a.shape, [d0, d1] = planeOf();
    const c = Math.max(1, ch[d]);
    if (d === d0) return [Math.floor(S.win[0]/c), Math.floor((S.win[1]-1)/c)];
    if (d === d1) return [Math.floor(S.win[2]/c), Math.floor((S.win[3]-1)/c)];
    const i = clamp(S.idx[d], 0, a.shape[d]-1);
    return [Math.floor(i/c), Math.floor(i/c)];
  }
  function estObjects(){
    const a = S.node;
    let total = 1;
    for (let d = 0; d < a.shape.length; d++){ const [lo,hi] = spanOf(d); total *= hi-lo+1; }
    if (a.inner_chunks){
      const [d0, d1] = planeOf();
      let ratio = Math.ceil(Math.min(a.chunks[d0], S.win[1]-S.win[0]) / a.inner_chunks[d0]);
      ratio *= Math.ceil(Math.min(a.chunks[d1], S.win[3]-S.win[2]) / a.inner_chunks[d1]);
      total *= Math.max(1, ratio);
    }
    return total;
  }
  function updateEst(){
    const a = S.node;
    if (!a) return;
    const cells = (S.win[1]-S.win[0]) * (S.win[3]-S.win[2]);
    const objs = estObjects();
    let outer = 1;
    for (let d = 0; d < a.shape.length; d++){ const [lo,hi] = spanOf(d); outer *= hi-lo+1; }
    const over = objs > 64 || cells > 4e6;
    est.innerHTML = `asking for <b>${fmtN(cells)}</b> numbers (<b>${fmtB(cells*a.itemsize)}</b> raw) · ` +
      `they live in <b>${fmtN(outer)}</b> ${a.inner_chunks ? "shard" : "chunk"}${outer>1?"s":""}` +
      (a.inner_chunks ? ` / ~<b>${fmtN(objs)}</b> inner chunks` : "") +
      (over ? ` <span class="warn">· too big — shrink the gold window (caps: 64 files, 4M numbers)</span>` : "");
    readB.disabled = over || S.reading || !S.node;
    markSel();
    draw();
  }
  function markSel(){
    for (const [k, v] of S.cells) if (v.sel) S.cells.delete(k);
    const [d0, d1] = planeOf();
    const [rlo, rhi] = spanOf(d0), [clo, chi] = spanOf(d1);
    if ((rhi-rlo+1) * (chi-clo+1) > 4000) return;
    for (let r = rlo; r <= rhi; r++) for (let c = clo; c <= chi; c++){
      const k = r + "," + c;
      if (!S.cells.has(k)) S.cells.set(k, { color: "rgba(184,134,11,.45)", line: "#b8860b", sel: true });
    }
  }

  function buildDims(){
    const a = S.node, [d0, d1] = planeOf();
    dims.innerHTML = "";
    for (let d = 0; d < a.shape.length; d++){
      const ch = Math.max(1, (a.chunks || a.shape)[d]);
      const grid = gridOf(a, d);
      const isP = d === d0 || d === d1;
      const row = el("div", "dimRow");
      const bar = el("div", "cbar");
      bar.dataset.dim = d;
      const shown = Math.min(grid, 40);
      for (let i = 1; i < shown; i++)
        bar.appendChild(el("span", "cb")).style.left = (i/shown*100) + "%";
      bar.appendChild(el("span", isP ? "win" : "ix"));
      row.appendChild(el("div", "dn",
        esc(a.dims[d] || "dim" + d) + (isP ? `<span class="tag">${d === d0 ? "rows" : "cols"}</span>` : "")));
      row.appendChild(bar);
      row.appendChild(el("div", "num",
        `${fmtN(a.shape[d])} ÷ ${fmtN(ch)} = ${fmtN(grid)}<br><span class="cur" data-d="${d}"></span>`));
      dims.appendChild(row);
      // drag behaviour
      let start = null, moved = false;
      const frac = ev => {
        const r = bar.getBoundingClientRect();
        return clamp((ev.clientX - r.left) / r.width, 0, 1);
      };
      const apply = ev => {
        const size = a.shape[d], f = frac(ev);
        if (!isP){ S.idx[d] = Math.min(size-1, Math.floor(f*size)); }
        else {
          const isR = d === d0;
          let lo, hi;
          if (!moved){
            const span = isR ? S.win[1]-S.win[0] : S.win[3]-S.win[2];
            lo = clamp(Math.round(f*size - span/2), 0, size - span); hi = lo + span;
          } else {
            const A = Math.min(start, f), B = Math.max(start, f);
            lo = Math.floor(A*size/ch)*ch;
            hi = Math.min(size, Math.ceil(B*size/ch)*ch);
            if (hi <= lo) hi = Math.min(size, lo + ch);
          }
          if (isR){ S.win[0] = lo; S.win[1] = hi; } else { S.win[2] = lo; S.win[3] = hi; }
        }
        S.img = null;
        updateBars(); updateEst();
      };
      bar.addEventListener("pointerdown", ev => {
        bar.setPointerCapture(ev.pointerId);
        start = frac(ev); moved = false; apply(ev); ev.preventDefault();
      });
      bar.addEventListener("pointermove", ev => { if (start != null){ moved = true; apply(ev); } });
      bar.addEventListener("pointerup", () => start = null);
      bar.addEventListener("pointercancel", () => start = null);
    }
    updateBars();
  }
  function updateBars(){
    const a = S.node, [d0, d1] = planeOf();
    dims.querySelectorAll(".cbar").forEach(bar => {
      const d = +bar.dataset.dim, size = a.shape[d];
      const wm = bar.querySelector(".win, .ix");
      const lbl = dims.querySelector(`[data-d="${d}"]`);
      if (d === d0 || d === d1){
        const lo = d === d0 ? S.win[0] : S.win[2], hi = d === d0 ? S.win[1] : S.win[3];
        wm.style.left = (lo/size*100) + "%";
        wm.style.width = Math.max(1.2, (hi-lo)/size*100) + "%";
        if (lbl) lbl.textContent = `${fmtN(lo)}–${fmtN(hi)}`;
      } else {
        wm.style.left = (S.idx[d]/size*100) + "%";
        if (lbl) lbl.textContent = `@ ${fmtN(S.idx[d])}`;
      }
    });
  }

  function setArray(path){
    const a = arrOf(S.tree, path);
    if (!a) return;
    S.node = a;
    S.idx = a.shape.map(s => Math.floor(s/2));
    S.cells.clear(); S.img = null;
    const [d0, d1] = planeOf();
    const ch = a.chunks || a.shape;
    let r0 = Math.floor(a.shape[d0]/2/Math.max(1,ch[d0])) * Math.max(1,ch[d0]);
    let c0 = Math.floor(a.shape[d1]/2/Math.max(1,ch[d1])) * Math.max(1,ch[d1]);
    S.win = [r0, Math.min(a.shape[d0], r0+ch[d0]), c0, Math.min(a.shape[d1], c0+ch[d1])];
    for (let i = 0; i < 40 && (estObjects() > 16 || (S.win[1]-S.win[0])*(S.win[3]-S.win[2]) > 3.5e6); i++){
      if (S.win[1]-S.win[0] >= S.win[3]-S.win[2] && S.win[1]-S.win[0] > 1)
        S.win[1] = S.win[0] + Math.max(1, Math.floor((S.win[1]-S.win[0])/2));
      else if (S.win[3]-S.win[2] > 1)
        S.win[3] = S.win[2] + Math.max(1, Math.floor((S.win[3]-S.win[2])/2));
      else break;
    }
    buildDims(); updateEst();
  }

  async function load(file){
    say(`reading <span class="key">${esc(file)}</span>…`);
    chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.f === file));
    inp.value = file;
    let t;
    try { t = await loadTree(file); if (!t) throw new Error("demo mode: only the canned presets load"); }
    catch(e){ say(`<span style="color:var(--miss)">couldn't open it: ${esc(e.message)}</span>`); return; }
    if (!root.isConnected) return;
    S.file = file; S.tree = t;
    const arrs = t.arrays.filter(a => a.shape.length >= 2);
    if (!arrs.length){ say("no 2-D+ arrays in this store"); return; }
    sel.innerHTML = arrs.map(a =>
      `<option value="${esc(a.path)}">${esc(a.path)} — ${a.shape.join("×")} ${esc(a.dtype)}</option>`).join("");
    const pick = arrs.find(a => a.path === t.default_var) || arrs[0];
    sel.value = pick.path;
    setArray(pick.path);
    say(`opened with one metadata read: <b>${t.n_arrays}</b> arrays` +
      ` — no data downloaded yet` +
      (file === MOCK ? ` · this is the local mini twin, so reads are instant` : ""));
  }

  async function read(){
    if (S.reading || !S.node) return;
    S.reading = true; readB.disabled = true;
    const a = S.node, [d0, d1] = planeOf();
    say("fetching the chunks your slice touches…");
    let res;
    try {
      res = S.file === MOCK && MOCK_LIVE
        ? await ZR.slice({ file: MOCK, var: a.path, plane: [d0, d1], idx: S.idx,
                           r0: S.win[0], r1: S.win[1], c0: S.win[2], c1: S.win[3] })
        : S3_LIVE
        ? await api(`/slice?file=${encodeURIComponent(S.file)}&var=${encodeURIComponent(a.path)}` +
            `&plane=${d0},${d1}&idx=${S.idx.join(",")}` +
            `&r0=${S.win[0]}&r1=${S.win[1]}&c0=${S.win[2]}&c1=${S.win[3]}`)
        : S.file === MOCK
        ? (await sleep(150), demoSliceMock())
        : (() => { throw new Error("this store reads live only in the FusedRender desktop app"); })();
    } catch(e){
      say(`<span style="color:var(--miss)">${esc(e.message)}</span>`);
      S.reading = false; updateEst(); return;
    }
    if (!root.isConnected) return;
    bump(res.cost, "playground read (" + (S.file || "").split("/").pop() + ")", S.file === MOCK);
    if (S.file === MOCK || S.file === MUR)
      recordTouches(res.touched, S.file === MOCK ? "mock" : "mur");
    else SES.otherReads++;                 // the receipt cube notes these aren't drawn
    for (const t of res.touched){
      const cc = keyToCoords(a, t.key);
      if (cc) S.cells.set(cc[d0] + "," + cc[d1], { color: t.cached ? "#2f9e57" : "#1f8fb8" });
    }
    S.img = sliceImage(res);
    S.imgWin = [S.win[0]/a.shape[d0], S.win[1]/a.shape[d0],
                S.win[2]/a.shape[d1], S.win[3]/a.shape[d1]];
    const got = res.cost.net_bytes;
    say(S.file === MOCK
      ? `read <span class="sz">${fmtB(got)}</span> from ${res.cost.requests} local file` +
        `${res.cost.requests>1?"s":""} in <b>${Math.max(1, Math.round(res.cost.ms))} ms</b> — ` +
        `free: this store lives on disk`
      : got === 0
      ? `all <b>from cache</b> — <span class="sz">0 bytes</span> traveled, ${Math.round(res.cost.ms)} ms`
      : `asked <span class="sz">${fmtB(res.logical_bytes)}</span> · got ` +
        `<span class="sz">${fmtB(got)}</span> in <b>${res.cost.requests}</b> ` +
        `request${res.cost.requests>1?"s":""} (${(res.cost.ms/1000).toFixed(1)} s)` +
        (a.inner_chunks && got < a.chunk_logical_bytes/4
          ? " — <b>sharding</b> kept it small"
          : got > res.logical_bytes*3 ? " — <b>all-or-nothing</b>: whole chunks travel" : ""));
    S.reading = false;
    updateEst();
  }

  for (const [label, f] of PRESETS){
    const c = el("button", "chip", label);
    c.dataset.f = f;
    c.onclick = () => load(f);
    chips.appendChild(c);
  }
  goB.onclick = () => inp.value.trim() && load(inp.value.trim());
  inp.addEventListener("keydown", e => { if (e.key === "Enter") goB.onclick(); });
  sel.onchange = () => setArray(sel.value);
  readB.onclick = read;
  const ro = new ResizeObserver(() => draw());
  ro.observe(cwrap);
  /* deep-linked ?file= must work on a COLD load too: under the app,
     fused.params may not carry ad-hoc query params, so read the real URL
     first (same trick the ?step= boot uses). */
  const qsFile = new URLSearchParams(location.search).get("file");
  load(PENDING_FILE || qsFile || (P.get && P.get("file")) || MOCK);
  PENDING_FILE = null;
  return root;
}

/* ================================================================
   engine
   ================================================================ */
const stage = $("#stage");
let cur = -1;
function go(i){
  i = clamp(i, 0, steps.length - 1);
  if (i === cur) return;
  cur = i;
  const s = steps[i];
  stage.innerHTML = "";
  const kick = $("#kicker");
  kick.textContent = "";
  /* act badge glyph — negative vertical margins keep the line box (and the
     header height) exactly where it was */
  kick.appendChild(pixIcon(ACT_ICON[s.act], 18,
    "display:inline-block; vertical-align:middle; margin:-5px 7px -3px 0;"));
  kick.appendChild(document.createTextNode(`act ${s.act + 1} · ${ACT[s.act]}`));
  $("#title").textContent = s.title;
  $("#copy").innerHTML = s.copy;
  const ln = $("#learn");
  ln.textContent = LEARN[s.act][0];
  ln.href = LEARN[s.act][1];
  ["#title", "#copy"].forEach(q => {
    $(q).classList.remove("fadein"); void $(q).offsetWidth; $(q).classList.add("fadein");
  });
  s.mount(stage);
  $("#pn").textContent = `Part ${i + 1} of ${steps.length}`;
  $("#pt").textContent = ACT[s.act];
  const dots = $("#pdots"); dots.innerHTML = "";
  steps.forEach((_, j) => {
    const d = el("i", j === i ? "on" : (j < i ? "past" : ""));
    d.addEventListener("click", () => go(j));
    dots.appendChild(d);
  });
  $("#back").disabled = i === 0;
  /* the final step (the receipt) has no dead "The end" — it offers a restart */
  $("#next").textContent = i === 0 ? "Start →"
    : i === steps.length - 1 ? "↺ start over"
    : (s.nextLabel || "Next →");
  $("#next").disabled = false;
  P.set && P.set("step", String(i));
  footNote();
}
$("#back").addEventListener("click", () => go(cur - 1));
$("#next").addEventListener("click", () =>
  go(cur === steps.length - 1 ? 0 : cur + 1));   // final step: "↺ start over"
document.addEventListener("keydown", e => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); go(cur - 1); }
});

(async function boot(){
  if (DEMO) banner(`<b>demo mode</b> — no Fused bridge, so this page can't read the bundled store. ` +
    `Structure and byte counts are canned copies of values measured on 2026-07-20; ` +
    `open via FusedRender for live requests.`);
  if (MOCK_LIVE){ loadTree(MOCK); loadMockMeta(); loadLs(); }              // read the bundled store in-browser
  if (S3_LIVE) ensureDaemon().then(() => loadTree(MUR));                   // warm the real-store metadata via the daemon
  else loadTree(MUR);                                                     // canned MUR metadata (hosted / standalone)
  // deep-link: ?step=N works both standalone and under /render?path=…&step=N
  const qsStep = new URLSearchParams(location.search).get("step");
  go(parseInt(qsStep ?? (P.get && P.get("step")) ?? "0", 10) || 0);
})();
</script>
</body>
</html>
