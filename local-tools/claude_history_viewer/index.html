<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Claude history</title>
<style>
  /* Read-only browser for Claude Code conversation history. Dark theme matching
     the explorer (warm near-black + Claude coral accent). Three columns:
     projects · sessions · transcript (browsing.md §1, transcript.md §4). */
  :root {
    color-scheme: dark;
    --bg: #1a1915;
    --panel: #211f1b;
    --card: #24221d;
    --card-hover: #2f2c26;
    --border: #38352e;
    --text: #ecece6;
    --muted: #a39d92;
    --faint: #7c766c;
    --accent: #d97757;
    --accent-tint: rgba(217, 119, 87, 0.16);
    --user: #6ea8fe;
    --user-tint: rgba(110, 168, 254, 0.10);
    --ok: #7bd88f;
    --warn: #e3c97a;
    --danger: #e5847b;
    --danger-bg: #3a2320;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  #layout { display: flex; height: 100vh; overflow: hidden; }

  /* --- sidebar panes --- */
  .pane {
    flex: none; border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #projectsPane { width: 240px; }
  #sessionsPane { width: 320px; }
  .pane-head {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    flex: none;
  }
  .pane-head h1 { font-size: 14px; margin: 0; }
  .pane-head h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 0; font-weight: 600;
  }
  .pane-head .sub { color: var(--faint); font-size: 11px; margin-top: 3px; }
  .pane-body { flex: 1; overflow-y: auto; padding: 8px; }

  .item {
    padding: 9px 11px; border-radius: 7px; cursor: pointer; margin-bottom: 3px;
    border: 1px solid transparent;
  }
  .item:hover { background: var(--card-hover); }
  .item.active { background: var(--accent-tint); border-color: var(--border); }
  .item .name { color: var(--text); font-size: 13px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .item.renamed .name { font-weight: 700; }
  .item .path { color: var(--faint); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .item .meta {
    color: var(--muted); font-size: 11px; margin-top: 4px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .tool-dot { color: var(--accent); }

  /* --- transcript --- */
  #transcript { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #tHead {
    padding: 14px 22px; border-bottom: 1px solid var(--border); flex: none;
    display: flex; align-items: center; gap: 16px;
  }
  #tHead .title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tHead .stat { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #tBody { flex: 1; overflow-y: auto; padding: 22px; }
  #tFoot {
    padding: 10px 22px; border-top: 1px solid var(--border); flex: none;
    display: none; align-items: center; gap: 14px; color: var(--muted); font-size: 12px;
  }

  .toggle {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px;
    white-space: nowrap;
  }
  .toggle.on { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
  .pager-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .pager-btn:hover:not(:disabled) { background: var(--card-hover); }
  .pager-btn:disabled { opacity: 0.4; cursor: default; }

  /* --- messages --- */
  .msg { margin-bottom: 18px; display: flex; gap: 10px; }
  .msg .gutter { flex: none; width: 46px; text-align: right; color: var(--faint);
    font-size: 11px; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .msg .gutter .model { display: block; color: var(--faint); font-size: 10px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; }
  .msg .body { flex: 1; min-width: 0; }
  .bubble {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    background: var(--card); overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user-tint); border-color: rgba(110,168,254,0.28);
    border-right: 3px solid var(--user); white-space: pre-wrap; }
  .msg.assistant .bubble { background: var(--card); }
  .msg.sidechain .body { margin-left: 24px; }
  .badge {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 1px 6px; border-radius: 4px; background: var(--border); color: var(--muted);
    margin-left: 8px; vertical-align: middle;
  }
  .badge.subagent { background: var(--accent-tint); color: var(--accent); }

  .assistant-md { line-height: 1.55; }
  .assistant-md h1, .assistant-md h2, .assistant-md h3 { margin: 12px 0 6px; line-height: 1.3; }
  .assistant-md h1 { font-size: 18px; } .assistant-md h2 { font-size: 16px; } .assistant-md h3 { font-size: 14px; }
  .assistant-md p { margin: 8px 0; }
  .assistant-md ul, .assistant-md ol { margin: 8px 0; padding-left: 22px; }
  .assistant-md li { margin: 2px 0; }
  .assistant-md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #1b1a16; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .assistant-md pre { background: #14130f; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; margin: 10px 0; }
  .assistant-md pre code { background: none; border: none; padding: 0; font-size: 12.5px; }

  details.block { margin: 8px 0; border: 1px solid var(--border); border-radius: 8px;
    background: #1e1c18; }
  details.block > summary { cursor: pointer; padding: 8px 12px; color: var(--muted);
    font-size: 12px; user-select: none; list-style: none; }
  details.block > summary::-webkit-details-marker { display: none; }
  details.block > summary::before { content: "\25B8"; margin-right: 8px; color: var(--faint); }
  details.block[open] > summary::before { content: "\25BE"; }
  details.block .content { padding: 0 12px 12px; }
  details.thinking .content { color: var(--muted); font-style: italic; white-space: pre-wrap; font-size: 13px; }
  details.tool .content pre { background: #14130f; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; overflow-x: auto; margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  details.tool.error { border-color: #7a3a3a; }
  .tool-name { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
  .result-text { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    color: var(--text); margin: 0; }
  .trunc-note { color: var(--warn); font-size: 11px; margin-top: 6px; font-style: italic; }

  .img-chip { display: inline-block; padding: 4px 10px; border: 1px dashed var(--border);
    border-radius: 6px; color: var(--faint); font-size: 12px; margin: 6px 0; }

  .system-row { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--muted); }
  .system-row .line { flex: 1; height: 1px; background: var(--border); }
  .system-row .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .system-row.err .label { color: var(--danger); }
  .system-row.err .line { background: var(--danger-bg); }
  .system-row .detail { color: var(--faint); font-size: 12px; max-width: 60%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty { color: var(--faint); padding: 40px 20px; text-align: center; line-height: 1.5; }
  .error { color: var(--danger); padding: 20px; }
</style>
</head>
<body>
<div id="layout">
  <section id="projectsPane" class="pane">
    <div class="pane-head">
      <h1>Claude history</h1>
      <div class="sub">read-only · ~/.claude/projects</div>
    </div>
    <div id="projectsBody" class="pane-body"><div class="empty">Loading…</div></div>
  </section>

  <section id="sessionsPane" class="pane" style="display:none">
    <div class="pane-head"><h2 id="sessionsTitle">Sessions</h2></div>
    <div id="sessionsBody" class="pane-body"></div>
  </section>

  <section id="transcript">
    <div id="tHead" style="display:none">
      <span class="title" id="tTitle"></span>
      <span class="stat" id="tStat"></span>
      <button id="sidechainsToggle" class="toggle">subagents</button>
    </div>
    <div id="tBody"><div class="empty">Select a project, then a session to view its transcript.</div></div>
    <div id="tFoot">
      <button id="prevBtn" class="pager-btn">‹ prev</button>
      <span id="pageInfo"></span>
      <button id="nextBtn" class="pager-btn">next ›</button>
    </div>
  </section>
</div>

<script>
/* Load the sibling script.js. The view renders inside the shell via
   /render?path=<abs>, so location.search carries the page's own path; derive
   its dir and load script.js as an absolute raw-bytes URL (a relative <script
   src> would resolve against /render and 404). Mirrors visual_claude. */
(function () {
  var self = new URLSearchParams(location.search).get("path") || "";
  var dir = self.slice(0, self.lastIndexOf("/"));
  var s = document.createElement("script");
  s.src = fused.rawUrl(dir ? dir + "/script.js" : "./script.js");
  s.onerror = function () {
    var b = document.getElementById("tBody");
    if (b) b.innerHTML = '<div class="error">Failed to load script.js — the UI cannot start.</div>';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
