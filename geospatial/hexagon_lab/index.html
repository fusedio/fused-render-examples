<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hexagon lab — buildings, rasters, joins</title>
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; align-items:center;
         background:#f6f2e9; color:#28231a;
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .col { width:100%; max-width:940px; padding:18px 26px 20px; display:flex; flex-direction:column; gap:10px; }
  .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .bar h1 { font-family:Georgia,serif; font-size:18px; margin:0 8px 0 0; font-weight:600; }
  .bar .sp { flex:1; }
  .bar .lbl { font-size:11px; color:#a89e8a; }
  button.sw { appearance:none; cursor:pointer; font:600 12.5px/1 -apple-system,sans-serif;
              border-radius:9px; padding:9px 12px; border:1px solid #d6cdb8;
              background:#fffdf8; color:#28231a; }
  button.sw:hover { box-shadow:0 1px 6px rgba(90,75,40,.15); }
  button.sw.on { background:#28231a; color:#f6f2e9; border-color:#28231a; }
  .resgrp, .tabgrp { display:flex; gap:3px; }
  .resgrp button.sw { padding:9px 10px; }
  .tabgrp button.sw.on { background:#d9642c; border-color:#d9642c; }

  /* selects: unmistakably dropdowns */
  .selwrap { position:relative; display:inline-flex; align-items:center; }
  .selwrap .pin { position:absolute; left:11px; pointer-events:none; font-size:13px; }
  .selwrap .chev { position:absolute; right:11px; pointer-events:none; color:#7b7260; font-size:11px; }
  .selwrap select { appearance:none; -webkit-appearance:none; cursor:pointer;
                    font:600 12.5px/1 -apple-system,sans-serif; color:#28231a;
                    background:#fffdf8; border:1px solid #d6cdb8; border-radius:9px;
                    padding:9px 30px 9px 32px; }
  .selwrap select:hover { box-shadow:0 1px 6px rgba(90,75,40,.15); }

  .stagewrap { position:relative; border-radius:16px; overflow:hidden;
               background:#fffdf8; border:1px solid #e4dccb; box-shadow:0 2px 10px rgba(90,75,40,.06); }
  #stage { position:relative; height:520px; }
  #stage canvas { display:block; touch-action:none; cursor:grab; }
  .cap { min-height:19px; font-size:12.5px; text-align:center; color:#7b7260;
         font-variant-numeric:tabular-nums; }
  .cap b { color:#28231a; }

  .meter { position:absolute; right:14px; top:12px; border-radius:10px; padding:7px 12px;
           font:11.5px/1.7 "SF Mono",ui-monospace,Menlo,monospace; z-index:6; min-width:206px;
           background:rgba(255,253,248,.94); border:1px solid #e4dccb; color:#7b7260; }
  .meter b { color:#28231a; }
  .meter .mr { display:flex; justify-content:space-between; gap:14px; }
  .meter .mx { text-align:right; font-weight:700; color:#33875a; }
  .meter .mx.neg { color:#b5442c; }
  .meter .lg { cursor:pointer; user-select:none; transition:opacity .2s; }
  .meter .lg:hover { text-decoration:underline; }
  .meter .lg.off { opacity:.35; }
  .meter .lg.off span { text-decoration:line-through; }
  .meter i.chip { display:inline-block; width:8px; height:8px; border-radius:2px;
                  margin-right:5px; vertical-align:middle; }

  button.fab { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:7;
               font-size:13px; padding:11px 18px; box-shadow:0 2px 10px rgba(90,75,40,.2); }
  button.fab[disabled] { opacity:.45; cursor:default; box-shadow:none; }
  .fabhint { position:absolute; left:50%; bottom:52px; transform:translateX(-50%); z-index:7;
             font-size:10.5px; padding:3px 9px; border-radius:7px; opacity:.6; pointer-events:none;
             background:rgba(40,35,26,.55); color:#fffdf8; white-space:nowrap; }
  .fabhint.painting { opacity:1; background:rgba(40,35,26,.85); font-weight:700; }

  /* the table: sticky header, hoverable rows, subtle sort */
  .tbl { background:#fff; border:1px solid #d6cdb8;
         border-radius:10px; font:11.5px/1.7 "SF Mono",ui-monospace,Menlo,monospace;
         max-height:200px; overflow-y:auto; z-index:6; white-space:pre; padding:0; }
  .tblwrap { position:absolute; left:16px; bottom:14px; z-index:6;
             display:flex; flex-direction:column; gap:5px; align-items:flex-start; }
  .tbl .hd { position:sticky; top:0; background:#fff; color:#a89e8a;
             border-bottom:1px solid #e4dccb; padding:6px 12px 3px; display:flex; align-items:center; }
  .tbl .hd .sort { cursor:pointer; margin-left:8px; border:0; background:none; color:#a89e8a;
                   font:inherit; padding:0 2px; }
  .tbl .hd .sort:hover, .tbl .hd .sort.on { color:#d9642c; }
  .tbl .rw { padding:0 12px; cursor:default; }
  .tbl .rw:hover, .tbl .rw.hl { background:#f9e3d3; }
  .tbl .hx { color:#d9642c; }
  .tbl .dpos { color:#33875a; font-weight:700; }
  .tbl .dneg { color:#b5442c; font-weight:700; }
  .sql { font:10.5px/1.5 "SF Mono",ui-monospace,Menlo,monospace; color:#a89e8a;
         background:rgba(255,253,248,.94); border:1px solid #e4dccb; border-radius:8px;
         padding:3px 10px; white-space:pre; }
  .sql b { color:#d9642c; font-weight:700; }
</style>
</head>
<body>
<div class="col">
  <div class="bar">
    <h1>Hexagon lab</h1>
    <span class="tabgrp">
      <button class="sw on" data-tab="bld">🏠 buildings</button><button
        class="sw" data-tab="ras">⛰ terrain</button><button
        class="sw" data-tab="cmp">Δ two releases</button>
    </span>
    <span class="selwrap" id="placewrap">
      <span class="pin">📍</span>
      <select id="place">
        <option value="ams">Amsterdam · canal ring</option>
        <option value="nyc">Manhattan · Central Park edge</option>
        <option value="venice">Venice · lagoon city</option>
        <option value="barcelona">Barcelona · Eixample grid</option>
        <option value="assam_new">Assam · brand-new town</option>
      </select>
      <span class="chev">▾</span>
    </span>
    <span class="selwrap" id="cmpplacewrap" style="display:none">
      <span class="pin">📍</span>
      <select id="cmpplace">
        <option value="japan">Kurashiki, Japan · the map fills in</option>
        <option value="ams">Amsterdam · a quiet month</option>
        <option value="assam">Assam · a town appears</option>
      </select>
      <span class="chev">▾</span>
    </span>
    <span class="selwrap" id="metricwrap" style="display:none">
      <span class="pin">Σ</span>
      <select id="metric">
        <option value="avg">average elevation</option>
        <option value="min">lowest pixel</option>
        <option value="max">highest pixel</option>
      </select>
      <span class="chev">▾</span>
    </span>
    <span class="lbl">hex res</span>
    <span class="resgrp">
      <button class="sw" data-r="8">8</button><button class="sw" data-r="9">9</button><button
        class="sw" data-r="10">10</button><button class="sw" data-r="11">11</button>
    </span>
    <span class="sp"></span>
    <button class="sw" id="replay" title="replay">↻</button>
  </div>
  <div class="stagewrap"><div id="stage"></div></div>
  <div class="cap" id="cap">loading the real data…</div>
</div>

const pyCache = new Map();
function callPy(params){
  if (!HAS_FUSED) return Promise.reject(new Error("no local Python (open via the fused-render app)"));
  const key = JSON.stringify(params);
  if (!pyCache.has(key))
    // hosted: no data_dir — the bundled h3_ingest.py finds data/ via openfused.asset_path
    pyCache.set(key, fused.runPython("./h3_ingest.py", HOSTED ? params : { ...params, data_dir: DATA_DIR })
      .catch(e => { pyCache.delete(key); throw e; }));
  return pyCache.get(key);
}

/* ---------- geometry ---------- */
function projector(bbox, H){
  const [x0, y0, x1, y1] = bbox;
  const k = Math.cos((y0 + y1) / 2 * Math.PI / 180);
  const W = Math.round(H * ((x1 - x0) * k) / (y1 - y0));
  return { W, H, x: lng => (lng - x0) / (x1 - x0) * W, y: lat => (y1 - lat) / (y1 - y0) * H };
}
function makeCanvas(W, H){
  const c = document.createElement("canvas");
  c.width = W * DPR; c.height = H * DPR;
  c.style.width = W + "px"; c.style.height = H + "px";
  const g = c.getContext("2d"); g.scale(DPR, DPR);
  return [c, g];
}
function ringsPath(list, px, py){
  const p = new Path2D();
  for (const it of list){
    const r = it.ring || it;
    p.moveTo(px(r[0][0], r[0][1]), py(r[0][0], r[0][1]));
    for (let i = 1; i < r.length; i++) p.lineTo(px(r[i][0], r[i][1]), py(r[i][0], r[i][1]));
    p.closePath();
  }
  return p;
}
const wkbBytes = b => 13 + 16 * b.ring.length;        // real WKB polygon size (matches the backend)
const HEXROW_BYTES = 20;                              // uint64 hex + uint64 area + uint32 cnt
const PX_BYTES = 2;                                   // int16 elevation value per raster pixel
const RASROW_BYTES = 16;                              // uint64 hex + 3x int16 metrics + uint16 cnt
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const STOPS = [[249,227,211],[217,100,44],[110,38,8]];
function ramp(t, alpha){
  const c = t < 0.5 ? mix(STOPS[0], STOPS[1], t * 2) : mix(STOPS[1], STOPS[2], (t - 0.5) * 2);
  return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
}
function divColor(delta, t, alpha){                    // diverging: growth green / loss brick
  const c = delta > 0 ? [51,135,90] : [181,68,44];
  return `rgba(${c[0]},${c[1]},${c[2]},${alpha ?? (.2 + .55 * t)})`;
}

/* ---------- scene: any place × any res (buildings tab) ---------- */
const S = { ready:false, showBuildings:true, showHex:true, hover:-1, active:-1,
            paint:false, mouse:null, bldAlpha:1 };
const sceneCache = new Map();
async function prepare(place, res){
  const key = place + "|" + res;
  if (!sceneCache.has(key)){
    // one data fetch + ONE python round-trip, in parallel (the old
    // assign-then-hexify pair was sequential and doubled first paint)
    const [d, hx] = await Promise.all([
      loadData(fileOf[place]),
      callPy({ action:"scene", dataset:place, res:String(res) }),
    ]);
    const pr = projector(d.bbox, 520);
    const ctr = cell => {
      const b = cell.boundary;
      return [b.reduce((s,p)=>s+pr.x(p[0]),0)/b.length, b.reduce((s,p)=>s+pr.y(p[1]),0)/b.length];
    };
    const memberOf = new Map(hx.cells.map(c => [c.id, []]));
    hx.assign_cells.forEach((cid,i)=>{ if (memberOf.has(cid)) memberOf.get(cid).push(d.buildings[i]); });
    const cells = hx.cells.map(info => {
      const members = memberOf.get(info.id) || [];
      const prefix = [0], bprefix = [0];
      members.forEach(b => { prefix.push(prefix[prefix.length-1] + b.area);
                             bprefix.push(bprefix[bprefix.length-1] + wkbBytes(b)); });
      return { info, members, prefix, bprefix, shown:0, done:false, c: ctr(info) };
    });
    const sortedAreas = cells.map(c => c.info.area).sort((a,b)=>a-b);
    const cand = cells.slice().sort((a,b)=>b.info.cnt-a.info.cnt).slice(0, 40);
    const first = cand[0];
    const trio = cand.slice().sort((a,b)=>
      ((a.c[0]-first.c[0])**2+(a.c[1]-first.c[1])**2)-((b.c[0]-first.c[0])**2+(b.c[1]-first.c[1])**2)
    ).slice(0,3).map(c => cells.indexOf(c));
    sceneCache.set(key, { cells, trio, pr, all: d.buildings, sortedAreas, place, res });
  }
  const sc = sceneCache.get(key);
  Object.assign(S, sc);
  resetScene();
  S.ready = true;
}
function resetScene(){
  S.cells.forEach(c => { c.shown = 0; c.done = false; });
  S.active = -1; S.hover = -1;
}
function rampT(c){                                    // quantile position of the counted area
  const v = c.prefix[c.shown], a = S.sortedAreas;
  let lo = 0, hi = a.length - 1;
  while (lo < hi){ const m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; }
  return a.length > 1 ? lo / (a.length - 1) : 1;
}
function quantT(v, a){                                // quantile rank of v in sorted array a
  let lo = 0, hi = a.length - 1;
  if (hi < 1) return 1;
  while (lo < hi){ const m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; }
  return lo / (a.length - 1);
}

/* ---------- loading state: a hex grid assembling (pure cosmetic) ---------- */
let introToken = 0;
function showLoadingHex(label){
  const my = ++introToken;
  const stage = $("#stage");
  stage.innerHTML = "";
  const W = 880, H = 520;
  const [c, g] = makeCanvas(W, H);
  c.style.cursor = "default";
  stage.appendChild(c);
  cap.textContent = label || "loading…";
  const R = 26, w = R * Math.sqrt(3);
  const t0 = performance.now();
  function hex(cx, cy, r){
    g.beginPath();
    for (let i = 0; i < 6; i++){
      const a = Math.PI/6 + i * Math.PI/3;
      const x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  }
  (function draw(now){
    if (my !== introToken || !c.isConnected) return;
    const t = (now - t0) / 1000;
    g.clearRect(0, 0, W, H);
    for (let row = -1; row * R * 1.5 < H + R; row++){
      for (let col = -1; col * w < W + w; col++){
        const x = col * w + (row % 2 ? w/2 : 0), y = row * R * 1.5;
        const born = (x + y * 0.55) / 950;           // west -> east build wave
        const a = clamp(t * 1.1 - born, 0, 1);
        if (a <= 0) continue;
        const shimmer = 0.05 + 0.045 * Math.sin(t * 2.2 + born * 10);
        hex(x, y, R * (0.55 + 0.39 * a));
        g.fillStyle = `rgba(217,100,44,${shimmer * a})`;
        g.fill();
        g.strokeStyle = `rgba(217,100,44,${0.3 * a})`;
        g.lineWidth = 1;
        g.stroke();
      }
    }
    requestAnimationFrame(draw);
  })(t0);
}

/* ---------- interactive grid preview (buildings tab loading state) --------
   The EXACT h3 grid for the place (baked ids+boundaries) mounts immediately:
   pan, zoom and hover work right away; the buildings then fade in on top. */
let preview = null;                    // { place, res, v, touched } for handoff
async function mountGridPreview(pl, rr, my){
  let gd;
  try { gd = await loadData("grid_" + pl + "_" + rr + ".json"); } catch(e){ return; }
  if (styleToken !== my || !gd.cells) return;
  const cellsB = gd.cells;
  const stage = $("#stage");
  stage.innerHTML = "";
  const W = 880, H = 520;
  const [c, g] = makeCanvas(W, H);
  stage.appendChild(c);
  const pr = projector(gd.bbox, 520);
  const cellP = cellsB.map(cc => ringsPath([cc.boundary], p=>pr.x(p), (p,q)=>pr.y(q)));
  const gridP = new Path2D(); cellP.forEach(p => gridP.addPath(p));
  const v = panzoom(c, pr.W, pr.H);
  v.fit(0, 0, pr.W, pr.H, 60);
  // ~3s entrance: cells appear one by one in a radial sweep with a soft ink
  // pulse. The scene handoff WAITS for readyAt even when the data lands
  // earlier, so the reveal always plays out before the buildings fade in.
  const ANIM_S = 3.0, APPEAR = 0.9;
  const pv = { place: pl, res: rr, v, touched: false,
               readyAt: performance.now() + ANIM_S * 1000 + 150 };
  preview = pv;
  const ctrs = cellsB.map(cc => {
    const b = cc.boundary;
    return [b.reduce((s,p)=>s+pr.x(p[0]),0)/b.length, b.reduce((s,p)=>s+pr.y(p[1]),0)/b.length];
  });
  const maxD = Math.max(1, ...ctrs.map(([x,y]) => Math.hypot(x - pr.W/2, y - pr.H/2)));
  const delays = ctrs.map(([x,y]) =>
    Math.hypot(x - pr.W/2, y - pr.H/2) / maxD * (ANIM_S - APPEAR));
  const touch = () => { pv.touched = true; };
  c.addEventListener("pointerdown", touch);
  c.addEventListener("wheel", touch, { passive:true });
  let hover = -1;
  c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect();
    const bx = (e.clientX - r.left - v.tx) / v.s, by = (e.clientY - r.top - v.ty) / v.s;
    hover = -1;
    for (let i = 0; i < cellP.length; i++)
      if (hitCtx.isPointInPath(cellP[i], bx, by)){ hover = i; break; }
    if (styleToken === my) cap.innerHTML = hover >= 0
      ? `<b>${cellsB[hover].id}</b> — a res-${rr} cell, waiting for its buildings…`
      : PREVIEW_CAP;
  });
  c.addEventListener("pointerleave", () => { hover = -1; if (styleToken === my) cap.innerHTML = PREVIEW_CAP; });
  cap.innerHTML = PREVIEW_CAP;
  // be honest if the hosting is having a slow day
  setTimeout(() => {
    if (styleToken === my && hover < 0)
      cap.innerHTML = "still fetching the buildings (the hosting is slow right now) — the grid is yours meanwhile";
  }, 14000);
  const t0 = performance.now();
  (function frame(now){
    if (styleToken !== my || !c.isConnected) return;
    const t = (now - t0) / 1000;
    g.clearRect(0, 0, W, H);
    withV(g, v, () => {
      if (t < ANIM_S + 0.2){
        for (let i = 0; i < cellP.length; i++){
          const a = clamp((t - delays[i]) / APPEAR, 0, 1);
          if (a <= 0) continue;
          const glow = a * (1 - a) * 2;              // ink pulse mid-appearance
          if (glow > .02){
            g.fillStyle = `rgba(217,100,44,${.09 * glow})`;
            g.fill(cellP[i]);
          }
          g.strokeStyle = `rgba(217,100,44,${.25 * a + .3 * glow})`;
          g.lineWidth = .8/v.s;
          g.stroke(cellP[i]);
        }
      } else {                                       // settled: one cheap stroke
        g.strokeStyle = "rgba(217,100,44,.25)"; g.lineWidth = .8/v.s; g.stroke(gridP);
      }
      if (hover >= 0){
        g.strokeStyle = "#28231a"; g.lineWidth = 2.2/v.s;
        g.setLineDash([6/v.s, 4/v.s]); g.stroke(cellP[hover]); g.setLineDash([]);
      }
    });
    requestAnimationFrame(frame);
  })(t0);
}
const PREVIEW_CAP = "the hexagon grid is ready — buildings on their way… scroll to zoom, drag to pan";

/* ---------- pan/zoom ---------- */
function panzoom(c, contentW, contentH){
  const W = parseFloat(c.style.width), H = parseFloat(c.style.height);
  const v = { s: 1, tx: 0, ty: 0 };
  const sMin = Math.min(W / contentW, H / contentH, 1) * 0.85, sMax = 14;
  const PAD = 260;
  function settle(){
    v.s = clamp(v.s, sMin, sMax);
    const w = contentW * v.s, h = contentH * v.s;
    v.tx = w > W - 2*PAD ? clamp(v.tx, W - w - PAD, PAD) : clamp(v.tx, (W-w)/2 - PAD, (W-w)/2 + PAD);
    v.ty = h > H - 2*PAD ? clamp(v.ty, H - h - PAD, PAD) : clamp(v.ty, (H-h)/2 - PAD, (H-h)/2 + PAD);
  }
  c.addEventListener("wheel", e => {
    e.preventDefault();
    const r = c.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const s0 = v.s;
    v.s = clamp(s0 * Math.exp(-e.deltaY * 0.0016), sMin, sMax);
    v.tx = mx - (mx - v.tx) * (v.s / s0);
    v.ty = my - (my - v.ty) * (v.s / s0);
    settle();
  }, { passive:false });
  let drag = null;
  c.addEventListener("pointerdown", e => {
    if (e.shiftKey) return;                            // shift = paint, not pan
    drag = { x:e.clientX, y:e.clientY, tx:v.tx, ty:v.ty, moved:false };
    c.setPointerCapture(e.pointerId);
  });
  c.addEventListener("pointermove", e => {
    if (!drag) return;
    if (Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y) > 4) drag.moved = true;
    v.tx = drag.tx + (e.clientX - drag.x);
    v.ty = drag.ty + (e.clientY - drag.y);
    settle();
  });
  c.addEventListener("pointerup", () => { setTimeout(()=>{ if(drag) drag = null; }); });
  v.wasDrag = () => drag && drag.moved;
  v.fit = (x0, y0, x1, y1, pad) => {
    v.s = clamp(Math.min(W/(x1-x0+pad), H/(y1-y0+pad)), sMin, sMax);
    v.tx = W/2 - (x0+x1)/2*v.s; v.ty = H/2 - (y0+y1)/2*v.s;
    settle();
  };
  v.settle = settle;
  return v;
}
function withV(g, v, fn){
  g.save();
  g.setTransform(DPR*v.s, 0, 0, DPR*v.s, DPR*v.tx, DPR*v.ty);
  fn();
  g.restore();
}
function animateView(v, to, ms, canvas){
  // smooth camera flight: lerp the view CENTER linearly and the scale in log
  // space (reads as a natural zoom). Any user input cancels it immediately.
  const W = 880, H = 520;
  return new Promise(done => {
    const from = { s: v.s, tx: v.tx, ty: v.ty };
    const c0 = [(W/2 - from.tx)/from.s, (H/2 - from.ty)/from.s];
    const c1 = [(W/2 - to.tx)/to.s, (H/2 - to.ty)/to.s];
    let cancelled = false;
    const cancel = () => { cancelled = true; };
    if (canvas){
      canvas.addEventListener("pointerdown", cancel, { once:true });
      canvas.addEventListener("wheel", cancel, { once:true });
    }
    const t0 = performance.now();
    (function step(now){
      if (cancelled) return done();
      const t = clamp((now - t0) / ms, 0, 1);
      const e = t < .5 ? 2*t*t : 1 - ((-2*t + 2) ** 2) / 2;   // easeInOut
      v.s = from.s * Math.pow(to.s / from.s, e);
      const cx = c0[0] + (c1[0]-c0[0]) * e, cy = c0[1] + (c1[1]-c0[1]) * e;
      v.tx = W/2 - cx * v.s;
      v.ty = H/2 - cy * v.s;
      t < 1 ? requestAnimationFrame(step) : done();
    })(t0);
  });
}

/* ---------- shared table chrome (sticky header + hover + hex-id sort) ---------- */
function makeTable(stage, headerText, rowText, hoverCb, opts = {}){
  const tbl = el("div","tbl",
    `<div class="hd"><span>${headerText}</span>` +
    `<button class="sort" title="sort by hex id">⇅</button></div>`);
  let host = tbl;
  if (opts.sql){
    host = el("div","tblwrap");
    host.appendChild(el("div","sql", opts.sql));
    tbl.style.position = "static";
    host.appendChild(tbl);
    stage.appendChild(host);
  } else {
    tbl.style.position = "absolute"; tbl.style.left = "16px"; tbl.style.bottom = "14px";
    stage.appendChild(tbl);
  }
  const rows = new Map();
  let sorted = false, hiEl = null, seq = 0;
  function resort(){
    const list = [...rows.entries()];
    if (sorted) list.sort((a, b) => a[1]._hx < b[1]._hx ? -1 : 1);
    else list.sort((a, b) => a[1]._seq - b[1]._seq);
    for (const [, rEl] of list) tbl.appendChild(rEl);
  }
  const api = {
    setHeader(t){ tbl.querySelector(".hd span").textContent = t; },
    row(i, hexId){
      if (!rows.has(i)){
        const rEl = el("div","rw","&nbsp;");
        rEl._seq = seq++; rEl._hx = hexId;
        rEl.addEventListener("mouseenter", () => hoverCb(i, true));
        rEl.addEventListener("mouseleave", () => hoverCb(-1));
        rows.set(i, rEl);
        tbl.appendChild(rEl);
        if (sorted) resort();
      }
      rows.get(i).innerHTML = rowText(i);
      if (!sorted) tbl.scrollTop = 1e9;
    },
    rerender(){ for (const i of rows.keys()) rows.get(i).innerHTML = rowText(i); },
    hi(i, fromTable){
      if (hiEl){ hiEl.classList.remove("hl"); hiEl = null; }
      if (i >= 0 && rows.has(i)){
        hiEl = rows.get(i); hiEl.classList.add("hl");
        if (!fromTable) hiEl.scrollIntoView({ block:"nearest" });
      }
    },
  };
  tbl.querySelector(".sort").addEventListener("click", e => {
    sorted = !sorted;
    e.target.classList.toggle("on", sorted);
    e.target.title = sorted ? "back to counting order" : "sort by hex id";
    resort();
  });
  return api;
}

/* ---------- the buildings view (paper) ---------- */
function mountView(stage){
  const W = 880, H = 520, pr = S.pr;
  const [c, g] = makeCanvas(W, H);
  stage.appendChild(c);
  const px = (x)=>pr.x(x), py=(x,y)=>pr.y(y);
  const base = ringsPath(S.all, px, py);
  const cellP = S.cells.map(cc => ringsPath([cc.info.boundary], px, py));
  const gridP = new Path2D(); cellP.forEach(p => gridP.addPath(p));
  const memberP = new Map();
  const memberSlice = i => ringsPath(S.cells[i].members.slice(0, S.cells[i].shown), px, py);
  const v = panzoom(c, pr.W, pr.H);
  const pts = S.trio.flatMap(i => S.cells[i].info.boundary.map(p => [pr.x(p[0]), pr.y(p[1])]));
  v.fit(Math.min(...pts.map(p=>p[0])), Math.min(...pts.map(p=>p[1])),
        Math.max(...pts.map(p=>p[0])), Math.max(...pts.map(p=>p[1])), 380);

  const tblApi = makeTable(stage,
    "hex              area_m2  cnt",
    i => { const cc = S.cells[i];
      return `<span class="hx">${cc.info.id}</span>  ` +
        `${String(Math.round(cc.prefix[cc.shown])).padStart(7)}  ${String(cc.shown).padStart(3)}`; },
    (i, ft) => { S.hover = i; api && api.hi(i, ft); });

  return {
    canvas: c, v, hitPaths: cellP,
    row: i => tblApi.row(i, S.cells[i].info.id),
    hi: tblApi.hi,
    frame(){
      g.clearRect(0,0,W,H);
      withV(g, v, () => {
        if (S.showBuildings && S.bldAlpha > 0){
          g.fillStyle = `rgba(120,112,95,${.05 * S.bldAlpha})`; g.fill(base);
          g.strokeStyle = `rgba(120,112,95,${.38 * S.bldAlpha})`;
          g.lineWidth = .55/v.s; g.stroke(base);
        }
        if (!S.showHex) return;
        g.strokeStyle = "rgba(217,100,44,.25)"; g.lineWidth = .8/v.s; g.stroke(gridP);
        S.cells.forEach((cc,i)=>{
          if (!cc.shown) return;
          const t = rampT(cc);
          g.fillStyle = ramp(t, S.showBuildings ? .35 : .55 + .4 * t);
          g.fill(cellP[i]);
          if (S.showBuildings){
            let p = i === S.active ? memberSlice(i) : memberP.get(i);
            if (!p){ p = memberSlice(i); if (cc.done) memberP.set(i, p); }
            g.fillStyle = "rgba(217,100,44,.45)"; g.fill(p);
            g.strokeStyle = "#d9642c"; g.lineWidth = .8/v.s; g.stroke(p);
          }
          // border carries the ramp so the gradient reads with buildings on
          g.strokeStyle = i === S.active ? "#d9642c" : ramp(Math.max(t, .25), 1);
          g.lineWidth = (i === S.active ? 2.4 : 1.6)/v.s;
          g.stroke(cellP[i]);
        });
        if (S.hover >= 0){
          const hc = S.cells[S.hover];
          if (!hc.shown){
            g.strokeStyle = "#28231a"; g.lineWidth = 2.2/v.s;
            g.setLineDash([6/v.s, 4/v.s]); g.stroke(cellP[S.hover]); g.setLineDash([]);
          } else {
            g.strokeStyle = "#28231a"; g.lineWidth = 2.6/v.s; g.stroke(cellP[S.hover]);
            if (S.showBuildings){
              const p = memberP.get(S.hover) || memberSlice(S.hover);
              g.strokeStyle = "#28231a"; g.lineWidth = 1.2/v.s; g.stroke(p);
            }
          }
        }
      });
    },
  };
}

/* ================================================================ driver */
let styleToken = 0, api = null, tab = "bld";
let queue = Promise.resolve(), queued = 0;
const cap = $("#cap");
const hitCtx = document.createElement("canvas").getContext("2d");
let place = "ams", res = 10, resRas = 9, resCmp = 10, cmpPlace = "japan";
let meterEl = null, fabEl = null, hintEl = null;

function mountMeter(stage){
  meterEl = el("div","meter",
    `<div class="mr lg" id="lg-b"><span>🏠 buildings</span><b id="m1">0 B</b></div>` +
    `<div class="mr lg" id="lg-h"><span>⬡ hex rows</span><b id="m2">0 B</b></div>` +
    `<div class="mx" id="m3">count a cell to compare</div>`);
  stage.appendChild(meterEl);
  meterEl.querySelector("#lg-b").addEventListener("click", toggleBuildings);
  meterEl.querySelector("#lg-h").addEventListener("click", toggleHex);
  syncLegend();
  updateMeter();
}
function syncLegend(){
  if (!meterEl || tab !== "bld") return;
  meterEl.querySelector("#lg-b").classList.toggle("off", !S.showBuildings);
  meterEl.querySelector("#lg-h").classList.toggle("off", !S.showHex);
}
function updateMeter(){
  if (!meterEl || tab !== "bld") return;
  let geo = 0, hex = 0, cells = 0, blds = 0;
  for (const c of S.cells){
    if (!c.shown) continue;
    geo += c.bprefix[c.shown]; hex += HEXROW_BYTES; cells++; blds += c.shown;
  }
  meterEl.querySelector("#m1").textContent = kb(geo) + (blds ? ` (${fmt(blds)})` : "");
  meterEl.querySelector("#m2").textContent = kb(hex) + (cells ? ` (${fmt(cells)})` : "");
  meterEl.querySelector("#m3").textContent = geo
    ? `rows are ×${fmt(Math.round(geo / hex))} smaller` : "count a cell to compare";
}

async function countCell(i, my){
  if (styleToken !== my) return;
  const cc = S.cells[i];
  if (cc.done || !cc.members.length) return;
  S.active = i;
  const inc = Math.max(1, Math.round(cc.members.length / 22));
  for (let s = 0; ; s = Math.min(s + inc, cc.members.length)){
    if (styleToken !== my) return;
    cc.shown = s;
    api.row(i); updateMeter();
    cap.innerHTML = `counting <b>${cc.info.id}</b> — ${s} buildings · ${fmt(Math.round(cc.prefix[s]))} m²`;
    if (s === cc.members.length) break;
    await sleep(42);
  }
  cc.done = true; S.active = -1;
  if (!--queued) cap.innerHTML = IDLE_CAP;
}
function enqueue(i){ const tk = styleToken; queued++; queue = queue.then(() => countCell(i, tk)); }
function countInstant(i){
  const cc = S.cells[i];
  if (cc.done || !cc.members.length) return false;
  cc.shown = cc.members.length; cc.done = true;
  api.row(i);
  return true;
}
async function countAll(){
  const my = styleToken;
  const order = S.cells.map((_, i) => i)
    .filter(i => !S.cells[i].done && S.cells[i].members.length)
    .sort((a, b) => S.cells[a].c[0] - S.cells[b].c[0]);   // west -> east wave
  let n = 0;
  for (const i of order){
    if (styleToken !== my) return;
    countInstant(i);
    if (++n % 6 === 0){ updateMeter(); await sleep(16); }
  }
  updateMeter();
  if (fabEl){ fabEl.textContent = "✓ every cell counted"; fabEl.disabled = true; }
  cap.innerHTML = `every cell counted — <b>${fmt(S.cells.filter(c=>c.done).length)} rows</b>. ` +
    `Hide the buildings layer ↗ for the pure hex view.`;
}

function loop(my){
  if (styleToken !== my || !api) return;
  api.frame();
  if (S.paint && S.mouse){                             // brush ring so ⇧-paint is visible
    const g = api.canvas.getContext("2d");
    const [mx, my2] = S.mouse;
    g.beginPath(); g.arc(mx, my2, 11, 0, 7);
    g.strokeStyle = "rgba(40,35,26,.55)"; g.lineWidth = 4; g.stroke();
    g.beginPath(); g.arc(mx, my2, 11, 0, 7);
    g.strokeStyle = "#fffdf8"; g.lineWidth = 1.8; g.stroke();
  }
  requestAnimationFrame(() => loop(my));
}
function hitTest(mx, my){
  const v = api.v;
  const bx = (mx - v.tx) / v.s, by = (my - v.ty) / v.s;
  const paths = api.hitPaths;
  for (let i = 0; i < paths.length; i++)
    if (paths[i] && hitCtx.isPointInPath(paths[i], bx, by)) return i;
  return -1;
}

const IDLE_CAP = "click a hexagon to count it · hover a counted one (or its row) to inspect · scroll to zoom";
function mountStyle(opts = {}){
  const my = ++styleToken;
  queue = Promise.resolve(); queued = 0;
  resetScene();
  const stage = $("#stage");
  stage.innerHTML = "";
  api = mountView(stage);
  mountMeter(stage);
  fabEl = el("button", "sw fab", "⚡ count all hexagons");
  fabEl.addEventListener("click", () => countAll());
  stage.appendChild(fabEl);
  hintEl = el("span", "fabhint", "🖌 or hold ⇧ and sweep to paint");
  stage.appendChild(hintEl);
  if (opts.keepV && api.v){ Object.assign(api.v, opts.keepV); api.v.settle(); }
  const c = api.canvas;
  c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect();
    S.mouse = [e.clientX - r.left, e.clientY - r.top];
    const h = hitTest(e.clientX - r.left, e.clientY - r.top);
    if (e.shiftKey && h >= 0 && countInstant(h)) updateMeter();   // 🖌 sweep-paint
    if (h !== S.hover){
      S.hover = h;
      api.hi(h >= 0 && S.cells[h].shown ? h : -1);
      if (S.active === -1 && !queued){
        if (h >= 0 && S.cells[h].shown){
          const cc = S.cells[h];
          cap.innerHTML = `<b>${cc.info.id}</b> — ${cc.shown} buildings · ` +
            `${fmt(Math.round(cc.prefix[cc.shown]))} m² · ${kb(cc.bprefix[cc.shown])} of outlines in, 20 B out`;
        } else cap.innerHTML = IDLE_CAP;
      }
    }
    c.style.cursor = S.paint ? "crosshair"
      : h >= 0 && !S.cells[h].shown && S.cells[h].members.length ? "pointer" : "grab";
  });
  c.addEventListener("pointerleave", () => {
    S.hover = -1; S.mouse = null; api.hi(-1);
    if (S.active === -1 && !queued) cap.innerHTML = IDLE_CAP;
  });
  c.addEventListener("pointerup", e => {
    if (api.v.wasDrag()) return;
    const r = c.getBoundingClientRect();
    const i = hitTest(e.clientX - r.left, e.clientY - r.top);
    if (i >= 0 && !S.cells[i].done && S.cells[i].members.length) enqueue(i);
  });
  // seamless handoff from the interactive grid preview: same grid, same
  // camera — the buildings (and the table/meter chrome) FADE in on top.
  const pv = preview && preview.place === S.place && preview.res === S.res ? preview : null;
  preview = null;
  if (opts.fadeIn){
    S.bldAlpha = 0;
    const f0 = performance.now();
    (function fade(now){
      if (styleToken !== my) return;
      S.bldAlpha = clamp((now - f0) / 750, 0, 1);
      if (S.bldAlpha < 1) requestAnimationFrame(fade);
    })(f0);
    stage.querySelectorAll(".tbl,.tblwrap,.meter,.fab,.fabhint").forEach(e2 => {
      e2.style.opacity = "0";
      e2.style.transition = "opacity .8s";
      requestAnimationFrame(() => requestAnimationFrame(() => { e2.style.opacity = "1"; }));
    });
  } else S.bldAlpha = 1;
  loop(my);
  if (opts.instantTrio){
    S.trio.forEach(i => countInstant(i));
    updateMeter();
    cap.innerHTML = IDLE_CAP;
  } else if (pv && pv.touched){
    // the user is already exploring the grid — keep their camera, no dive
    Object.assign(api.v, { s: pv.v.s, tx: pv.v.tx, ty: pv.v.ty });
    api.v.settle();
    cap.innerHTML = `the buildings are in — <b>${fmt(S.all.length)}</b> of them`;
    (async () => {
      await sleep(850);                              // let the fade land
      if (styleToken === my) S.trio.forEach(i => enqueue(i));
    })();
  } else {
    // intro: the whole patch freshly hexified, then dive into the trio and
    // start counting — turns load latency into a deliberate reveal.
    const target = { s: api.v.s, tx: api.v.tx, ty: api.v.ty };
    api.v.fit(0, 0, S.pr.W, S.pr.H, 60);
    if (pv){ Object.assign(api.v, { s: pv.v.s, tx: pv.v.tx, ty: pv.v.ty }); api.v.settle(); }
    cap.innerHTML = `<b>${fmt(S.cells.length)} hexagons</b> laid over ${fmt(S.all.length)} buildings — diving in…`;
    (async () => {
      await sleep(pv ? 900 : 650);                   // let the fade land / a beat
      if (styleToken !== my) return;
      await animateView(api.v, target, 1100, api.canvas);
      if (styleToken !== my) return;
      S.trio.forEach(i => enqueue(i));
    })();
  }
}

let prefetching = null;
function prefetchScenes(pl){
  if (prefetching === pl) return;
  prefetching = pl;
  (async () => {
    for (const r of [10, 9, 11, 8]){
      if (prefetching !== pl || tab !== "bld") return;
      try { await prepare(pl, r); } catch(e){ return; }
      Object.assign(S, sceneCache.get(place + "|" + res));   // restore the live scene
    }
  })();
}
async function switchScene(newPlace, newRes){
  const resOnly = newPlace === place && api && tab === "bld";
  const cached = sceneCache.has(newPlace + "|" + newRes);
  const keepV = resOnly && api && api.v ? { s: api.v.s, tx: api.v.tx, ty: api.v.ty } : null;
  const my = ++styleToken;
  if (!cached && resOnly) cap.textContent = `re-hexifying at res ${newRes}…`;
  else if (!cached) mountGridPreview(newPlace, newRes, my);           // instant real grid
  try {
    await prepare(newPlace, newRes);
    // let the grid reveal finish even if the data beat it — no jump cuts
    const pv0 = preview;
    if (pv0 && pv0.place === newPlace && pv0.res === newRes){
      const wait = pv0.readyAt - performance.now();
      if (wait > 0) await sleep(wait);
    }
    if (styleToken !== my) return;                   // a newer switch won
    place = newPlace; res = newRes;

/* ================================================================ terrain tab
   Same pipeline, different data shape: a real elevation raster (Grand Canyon,
   128x128 pixels from AWS Terrain Tiles) pours PIXELS into hexagons instead
   of buildings. The metric dropdown is the new idea: one cell, several truths. */
const R = { showRaster:true, showHex:true, metric:"avg", hover:-1, active:-1, sc:null };
const rasterCache = new Map();
async function prepareRaster(rr){
  if (!rasterCache.has(rr)){
    const [d, hx] = await Promise.all([
      loadData("elev_canyon_terrarium.json"),
      callPy({ action:"raster_hexify", dataset:"canyon", res:String(rr) }),
    ]);
    const pr = projector(d.bbox, 520);
    const img = document.createElement("canvas");
    img.width = d.nx; img.height = d.ny;
    const ig = img.getContext("2d");
    const idd = ig.createImageData(d.nx, d.ny);
    // straight hypsometric tint: colour by elevation only (no shaded relief),
    // low → warm canyon-floor tan, high → pale rim. Keeps it in the paper
    // family; orange counted cells pop as the one "aggregated" colour.
    const span = d.elev_max - d.elev_min;
    const LOW = [150,120,86], MID = [206,186,150], HIGH = [247,244,235];
    for (let i = 0; i < d.elev.length; i++){
      const t = (d.elev[i] - d.elev_min) / span;
      const c = t < 0.5 ? mix(LOW, MID, t*2) : mix(MID, HIGH, (t-0.5)*2);
      idd.data[i*4] = c[0]; idd.data[i*4+1] = c[1]; idd.data[i*4+2] = c[2]; idd.data[i*4+3] = 255;
    }
    ig.putImageData(idd, 0, 0);
    const pw = pr.W / d.nx, ph = pr.H / d.ny;
    const ctr = cell => {
      const b = cell.boundary;
      return [b.reduce((s,p)=>s+pr.x(p[0]),0)/b.length, b.reduce((s,p)=>s+pr.y(p[1]),0)/b.length];
    };
    const cells = hx.cells.map(info => {
      const elevs = info.px.map(i => d.elev[i]);
      const prefix = [0], runMin = [Infinity], runMax = [-Infinity];
      elevs.forEach(e2 => {
        prefix.push(prefix[prefix.length-1] + e2);
        runMin.push(Math.min(runMin[runMin.length-1], e2));
        runMax.push(Math.max(runMax[runMax.length-1], e2));
      });
      return { info, elevs, prefix, runMin, runMax, shown:0, done:false, c: ctr(info) };
    });
    const sortedVals = {
      avg: cells.map(c => c.info.avg).sort((a,b)=>a-b),
      min: cells.map(c => c.info.min).sort((a,b)=>a-b),
      max: cells.map(c => c.info.max).sort((a,b)=>a-b),
    };
    // the trio starts on the steepest INTERIOR cell (biggest min→max spread
    // within one hexagon) so the first pour makes avg-vs-min-vs-max vivid and
    // never clips the raster edge
    const interior = cells.filter(c =>
      c.c[0] > pr.W*0.25 && c.c[0] < pr.W*0.75 && c.c[1] > pr.H*0.25 && c.c[1] < pr.H*0.75);
    const top = (interior.length ? interior : cells).slice()
      .sort((a,b)=>(b.info.max-b.info.min)-(a.info.max-a.info.min))[0];
    const trio = cells.slice().sort((a,b)=>
      ((a.c[0]-top.c[0])**2+(a.c[1]-top.c[1])**2)-((b.c[0]-top.c[0])**2+(b.c[1]-top.c[1])**2)
    ).slice(0,3).map(c => cells.indexOf(c));
    rasterCache.set(rr, { cells, trio, pr, img, d, pw, ph, sortedVals, res: rr,
                          rasterBytes: hx.raster_parquet_bytes, hexBytes: hx.hex_parquet_bytes });
  }
  R.sc = rasterCache.get(rr);
  R.sc.cells.forEach(c => { c.shown = 0; c.done = false; });
  R.hover = -1; R.active = -1;
}
function rasVal(cc, s){
  if (!s) return 0;
  return R.metric === "avg" ? Math.round(cc.prefix[s] / s)
       : R.metric === "min" ? cc.runMin[s] : cc.runMax[s];
}
const RAS_CAP = "click a hexagon to pour its pixels in · ⛰ Grand Canyon — 128×128 real elevation pixels";

        } else { g.fillStyle = "#fffdf8"; g.fillRect(0, 0, pr.W, pr.H); }

        sc.cells.forEach((cc,i)=>{

          g.fillStyle = ramp(t, R.showRaster ? .5 : .55 + .4 * t);
          g.fill(cellP[i]);
          if (R.showRaster){
            let p = i === R.active ? pxSlice(i) : pxRect.get(i);
            if (!p){ p = pxSlice(i); if (cc.done) pxRect.set(i, p); }
            // the pixels that went in: a soft orange wash, thin grid only when
            // zoomed in enough for it to read (avoids the busy overview mesh)

            if (v.s > 3){ g.strokeStyle = "rgba(217,100,44,.4)"; g.lineWidth = .4/v.s; g.stroke(p); }
          }

        });

      if (s === cc.elevs.length) break;

    cap.innerHTML = `all <b>${fmt(sc.d.nx * sc.d.ny)} pixels</b> filed into <b>${fmt(sc.cells.length)} rows</b> — ` +
      `real parquet: ${kb(sc.rasterBytes)} → ${kb(sc.hexBytes)}`;
  };
  fabEl.addEventListener("click", () => R.instantAll());

  c.addEventListener("pointermove", e => {

  });

let rasPrefetching = false;
function prefetchRaster(){

    for (const r of [9, 8, 10]){
      if (tab !== "ras") { rasPrefetching = false; return; }
      if (rasterCache.has(r)) continue;            // never reset the live scene
      const keep = R.sc;
      try { await prepareRaster(r); } catch(e){ rasPrefetching = false; return; }
      R.sc = keep;                                 // restore the live scene
    }

}
async function switchRaster(newRes, first){

  const keepV = !first && api && api.v ? { s: api.v.s, tx: api.v.tx, ty: api.v.ty } : null;
  styleToken++;

/* ================================================================ compare tab

   patch in two Overture releases, matched row-by-row on the hex id. */
const Cm = { showOld:true, showNew:true, showHex:true, hover:-1, sc:null };
// the two releases get slightly different tints so it reads as two datasets:
// apr = cool blue-grey, may = warm tan. Kept muted per "not a huge difference".
const APR_RGB = "95,120,150", MAY_RGB = "170,130,90";
const cmpCache = new Map();
const cmpFiles = { japan: ["kurashiki_2025-04-23-0.json", "kurashiki_2025-05-21-0.json"],
                   ams: ["ams_2025-04-23-0.json", "ams_2025-05-21-0.json"],
                   assam: ["assam_2025-04-23-0.json", "assam_2025-05-21-0.json"] };
async function prepareCmp(pl, rr){
  const key = pl + "|" + rr;
  if (!cmpCache.has(key)){
    const [dif, dOld, dNew] = await Promise.all([
      callPy({ action:"diff", dataset: pl, res:String(rr) }),
      loadData(cmpFiles[pl][0]),
      loadData(cmpFiles[pl][1]),
    ]);
    const pr = projector(dNew.bbox, 520);
    const ctr = cell => {
      const b = cell.boundary;
      return [b.reduce((s,p)=>s+pr.x(p[0]),0)/b.length, b.reduce((s,p)=>s+pr.y(p[1]),0)/b.length];
    };
    const cells = dif.cells.map(info => ({
      info, delta: info.area_new - info.area_old, shown:false, c: ctr(info) }));
    const sortedAbs = cells.map(c => Math.abs(c.delta)).filter(d => d > 0).sort((a,b)=>a-b);
    const byAbs = cells.slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
    const trio = (sortedAbs.length ? byAbs : cells.slice().sort((a,b)=>b.info.cnt_new-a.info.cnt_new))
      .slice(0,3).map(c => cells.indexOf(c));
    cmpCache.set(key, { cells, trio, pr, allOld: dOld.buildings, allNew: dNew.buildings,
                        sortedAbs, pl, res: rr });

  Cm.sc = cmpCache.get(key);
  Cm.sc.cells.forEach(c => { c.shown = false; });

          g.strokeStyle = `rgba(${APR_RGB},.5)`; g.lineWidth = .5/v.s; g.stroke(baseOld);
        }
        g.strokeStyle = "rgba(217,100,44,.22)"; g.lineWidth = .8/v.s; g.stroke(gridP);
        sc.cells.forEach((cc,i)=>{
          if (!cc.shown) return;
          if (cc.delta !== 0){
            const t = quantT(Math.abs(cc.delta), sc.sortedAbs);
            g.fillStyle = divColor(cc.delta, t);
            g.fill(cellP[i]);
            g.strokeStyle = divColor(cc.delta, 1, .9);
            g.lineWidth = 1.6/v.s;
          } else {
            g.fillStyle = "rgba(120,112,95,.08)";
            g.fill(cellP[i]);
            g.strokeStyle = "rgba(120,112,95,.5)";
            g.lineWidth = 1.1/v.s;
          }
          g.stroke(cellP[i]);
        });
        if (Cm.hover >= 0){
          const hc = sc.cells[Cm.hover];
          g.strokeStyle = "#28231a"; g.lineWidth = (hc.shown ? 2.6 : 2.2)/v.s;
          if (!hc.shown) g.setLineDash([6/v.s, 4/v.s]);
          g.stroke(cellP[Cm.hover]); g.setLineDash([]);
        }
      });
    },
  };

  let cmpQueue = Promise.resolve(), cmpQueued = 0;
  async function join(i){
    if (styleToken !== my) return;
    const cc = sc.cells[i];
    if (cc.shown) return;
    cc.shown = true;
    api.row(i); meter();
    cap.innerHTML = `<b>${cc.info.id}</b> — apr ${fmt(cc.info.area_old)} m² ⋈ may ${fmt(cc.info.area_new)} m² ` +
      `→ Δ <b>${dStr(cc.delta)} m²</b>`;
    await sleep(340);
    if (!--cmpQueued && styleToken === my) cap.innerHTML = CMP_CAP;
  }
  const enq = i => { cmpQueued++; cmpQueue = cmpQueue.then(() => join(i)); };
  const instant = i => {
    const cc = sc.cells[i];
    if (cc.shown) return false;
    cc.shown = true;
    api.row(i);
    return true;
  };
  async function joinAll(){
    const order = sc.cells.map((_, i) => i).filter(i => !sc.cells[i].shown)
      .sort((a, b) => sc.cells[a].c[0] - sc.cells[b].c[0]);
    let n = 0;
    for (const i of order){
      if (styleToken !== my) return;
      instant(i);
      if (++n % 6 === 0){ meter(); await sleep(16); }
    }
    meter();
    const chg = sc.cells.filter(cc => cc.delta !== 0).length;
    fabEl.textContent = "✓ all joined"; fabEl.disabled = true;
    cap.innerHTML = `every row joined — <b>${chg} of ${fmt(sc.cells.length)} cells changed</b> between the two releases`;
  }
  fabEl.addEventListener("click", () => joinAll());

  c.addEventListener("pointermove", e => {
    const r = c.getBoundingClientRect();
    S.mouse = [e.clientX - r.left, e.clientY - r.top];
    const h = hitTest(e.clientX - r.left, e.clientY - r.top);
    if (e.shiftKey && h >= 0 && instant(h)) meter();
    if (h !== Cm.hover){
      Cm.hover = h;
      api.hi(h >= 0 && sc.cells[h].shown ? h : -1);
      if (!cmpQueued){
        if (h >= 0 && sc.cells[h].shown){
          const cc = sc.cells[h];
          cap.innerHTML = `<b>${cc.info.id}</b> — apr ${fmt(cc.info.area_old)} m² (${cc.info.cnt_old} bld) · ` +
            `may ${fmt(cc.info.area_new)} m² (${cc.info.cnt_new} bld) · Δ ${dStr(cc.delta)} m²`;
        } else cap.innerHTML = CMP_CAP;
      }
    }
    c.style.cursor = S.paint ? "crosshair" : h >= 0 && !sc.cells[h].shown ? "pointer" : "grab";
  });
  c.addEventListener("pointerleave", () => {
    Cm.hover = -1; S.mouse = null; api.hi(-1);
    if (!cmpQueued) cap.innerHTML = CMP_CAP;
  });
  c.addEventListener("pointerup", e => {
    if (v.wasDrag()) return;
    const r = c.getBoundingClientRect();
    const i = hitTest(e.clientX - r.left, e.clientY - r.top);
    if (i >= 0 && !sc.cells[i].shown) enq(i);
  });

  loop(my);
  meter();
  if (opts.instantTrio){
    sc.trio.forEach(i => instant(i));
    meter();
    cap.innerHTML = CMP_CAP;
  } else {
    sc.trio.forEach(i => enq(i));
  }
}
let cmpPrefetching = null;
function prefetchCmp(pl){
  if (cmpPrefetching === pl) return;
  cmpPrefetching = pl;
  (async () => {
    for (const r of [10, 9, 11, 8]){
      if (cmpPrefetching !== pl || tab !== "cmp") return;
      if (cmpCache.has(pl + "|" + r)) continue;    // never reset the live scene
      const keep = Cm.sc;
      try { await prepareCmp(pl, r); } catch(e){ return; }
      Cm.sc = keep;                                // restore the live scene
    }
  })();
}
async function switchCmp(newPlace, newRes, first){
  first = first || !api;                           // fresh tab entry = fresh camera
  const resOnly = newPlace === cmpPlace && !first;
  const cached = cmpCache.has(newPlace + "|" + newRes);
  if (!cached && resOnly) cap.textContent = `re-joining at res ${newRes}…`;
  else if (!cached) showLoadingHex("joining the two Overture releases…");
  const keepV = resOnly && api && api.v ? { s: api.v.s, tx: api.v.tx, ty: api.v.ty } : null;
  styleToken++;
  try {
    await prepareCmp(newPlace, newRes);
    cmpPlace = newPlace; resCmp = newRes;
    P.set && (P.set("cmpplace", cmpPlace), P.set("res", String(resCmp)));
    syncBar();
    mountCompare({ instantTrio: !!resOnly, keepV });
    prefetchCmp(cmpPlace);
  } catch(e){
    introToken++;
    cap.textContent = "⚠︎ couldn't join those releases — " + (e.message || e);
  }
}

/* ================================================================ tabs */
function curRes(){ return tab === "ras" ? resRas : tab === "cmp" ? resCmp : res; }
function syncBar(){
  document.querySelectorAll(".tabgrp button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#placewrap").style.display = tab === "bld" ? "" : "none";
  $("#cmpplacewrap").style.display = tab === "cmp" ? "" : "none";
  $("#metricwrap").style.display = tab === "ras" ? "" : "none";
  const r = curRes();
  document.querySelectorAll(".resgrp button").forEach(b => {
    b.classList.toggle("on", +b.dataset.r === r);
    b.style.display = tab === "ras" && +b.dataset.r === 11 ? "none" : "";
  });
  $("#place").value = place;
  $("#cmpplace").value = cmpPlace;
  $("#metric").value = R.metric;
}
async function switchTab(t){
  if (t === tab && api) return;
  tab = t;
  P.set && P.set("tab", tab);
  syncBar();
  styleToken++;
  api = null;                                      // the old tab's view is dead
  // respond to the click IMMEDIATELY: if this tab's scene isn't cached yet,
  // fill the stage with the assembling-hex-grid animation while data loads.
  const cached = t === "bld" ? sceneCache.has(place + "|" + res)
    : t === "ras" ? rasterCache.has(resRas)
    : cmpCache.has(cmpPlace + "|" + resCmp);
  // buildings gets its real interactive grid via switchScene; others shimmer
  if (!cached && t !== "bld") showLoadingHex(
    t === "ras" ? "hexifying the terrain…" : "joining the two Overture releases…");
  if (t === "bld") await switchScene(place, res);
  else if (t === "ras") await switchRaster(resRas);
  else await switchCmp(cmpPlace, resCmp);
  warmOtherTabs();
}

/* warm the OTHER tabs' default scenes in the background right after the first
   tab mounts — each backend call costs ~1.1 s of process-spawn overhead, so
   paying it up front makes every later tab click a cache hit (instant). */
let warmedTabs = false;
function warmOtherTabs(){
  if (warmedTabs) return;
  warmedTabs = true;
  setTimeout(async () => {
    try {
      if (tab !== "cmp" && !cmpCache.has(cmpPlace + "|" + resCmp)) await prepareCmp(cmpPlace, resCmp);
      if (tab !== "ras" && !rasterCache.has(resRas)) await prepareRaster(resRas);
      if (tab !== "bld" && !sceneCache.has(place + "|" + res)) await prepare(place, res);
    } catch(e){ /* warming is best-effort */ }
  }, 900);
}

document.querySelectorAll(".tabgrp button").forEach(b =>
  b.addEventListener("click", () => switchTab(b.dataset.tab)));
document.querySelectorAll(".resgrp button").forEach(b =>
  b.addEventListener("click", () => {
    const r = +b.dataset.r;
    if (tab === "bld") switchScene(place, r);
    else if (tab === "ras") switchRaster(clamp(r, 8, 10));
    else switchCmp(cmpPlace, r);
  }));
$("#place").addEventListener("change", e => switchScene(e.target.value, res));
$("#cmpplace").addEventListener("change", e => switchCmp(e.target.value, resCmp));
$("#metric").addEventListener("change", e => {
  R.metric = e.target.value;
  P.set && P.set("metric", R.metric);
  if (tab === "ras" && R.tbl){
    R.tbl.setHeader("hex".padEnd(17) + (R.metric + "_m").padStart(6) + "  " + "px".padStart(4));
    R.tbl.rerender();
    cap.innerHTML = `same cells, new question — shade is now the <b>${
      {avg:"average elevation", min:"lowest pixel", max:"highest pixel"}[R.metric]}</b> per hexagon`;
  }
});
$("#replay").addEventListener("click", () => {
  if (tab === "bld") mountStyle();
  else if (tab === "ras") mountTerrain();
  else mountCompare();
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (k === "r") $("#replay").click();
  if (k === "b"){
    if (tab === "bld") toggleBuildings();
    else if (tab === "ras") meterEl && meterEl.querySelector("#lg-r").click();
    else meterEl && meterEl.querySelector("#lg-apr").click();   // b = toggle apr layer
  }
  if (k === "n" && tab === "cmp") meterEl && meterEl.querySelector("#lg-may").click();
  if (k === "h" && tab === "bld") toggleHex();
  if (k === "h" && tab === "ras") meterEl && meterEl.querySelector("#lg-h").click();
  if (k === "a"){
    if (tab === "bld") countAll();
    else if (tab === "ras") R.instantAll && R.instantAll();
    else fabEl && !fabEl.disabled && fabEl.click();
  }
});

(async () => {
  try {
    // read initial state ONLY from the URL query (the deep-link mechanism) so a
    // clean open always lands on the intended defaults — never on a value the
    // app happened to persist from an earlier click.
    const qp = new URLSearchParams(location.search);
    if (qp.get("bld") === "0") S.showBuildings = false;
    const p0 = qp.get("place") || "ams";
    place = fileOf[p0] ? p0 : "ams";
    // Kurashiki is always the compare default (the app persists params into the
    // URL, so an earlier pick could otherwise stick); clear any stale value.
    cmpPlace = "japan";
    P.set && P.set("cmpplace", "japan");
    const cmpv = qp.get("cmp");                     // deep-link the layer view
    if (cmpv === "old"){ Cm.showNew = false; }
    else if (cmpv === "new"){ Cm.showOld = false; }
    const m0 = qp.get("metric") || "avg";
    if (["avg","min","max"].includes(m0)) R.metric = m0;
    const r0 = parseInt(qp.get("res") || "0", 10) || 0;
    const t0 = qp.get("tab") || "bld";
    tab = ["bld","ras","cmp"].includes(t0) ? t0 : "bld";
    if (r0){ res = clamp(r0, 8, 11); resRas = clamp(r0, 8, 10); resCmp = clamp(r0, 8, 11); }
    syncBar();
    if (tab !== "bld") showLoadingHex(
      tab === "ras" ? "hexifying the terrain…" : "joining the two Overture releases…");
    if (tab === "bld") await switchScene(place, res);
    else if (tab === "ras") await switchRaster(resRas, true);
    else await switchCmp(cmpPlace, resCmp, true);
    warmOtherTabs();
  } catch(e){
    introToken++;
    cap.textContent = "⚠︎ couldn't load the scene — " + (e.message || e);
  }
})();
</script>
